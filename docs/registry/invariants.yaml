  INV-LEGACY-UNDERLAY-MIGRATION:
    title: Debug underlays move to Geonical without copying an extracted tile tree
    owners: [app, maplib, maplibui]
    statement: >
      A pre-registry com.nextgis.mobile.debug workspace remains in place until an explicit,
      user-confirmed transfer. Only local raster underlays cross to the already selected Geonical
      project; Web GIS project identity, accounts, credentials, vector data and tracks never cross.
      The debug package grants read-only streaming URIs only to the pinned Geonical package and
      signing certificate. Extracted z/x/y tiles are converted directly into one validated raster
      MBTiles database with bounded SQLite transactions, one durable file sync and an atomic final
      rename; source data is retained and a persistent source key makes retries duplicate-safe.
    related_code:
      - app/src/main/java/com/nextgis/mobile/MainApplication.java
      - app/src/main/java/com/nextgis/mobile/activity/LegacyUnderlayExportActivity.java
      - app/src/main/java/com/nextgis/mobile/provider/LegacyUnderlayProvider.java
      - app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayImporter.java
      - maplib/src/main/java/com/nextgis/maplib/map/TMSLayer.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/ProjectOperationCoordinator.java
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-APP-RELEASES, SMOKE-DEBUG-UNDERLAY-MIGRATION]
    must_update_docs:
      - docs/architecture/collector-projects.md
      - docs/architecture/map-rendering.md
      - docs/reference/flavors-and-versioning.md
      - docs/reference/official-differences.md
  INV-BACKUP-BEFORE-DESTRUCTION:
    title: Required backup gates destructive layer mutation
    owners: [maplibui, maplib]
    statement: >
      For editable NGW vector layers, a successful data backup is required before any destructive
      mutation — remote sync delete/overwrite, schema rebuild, Collector vector-layer removal,
      duplicate-layer repair, manual layer delete, manual feature delete, or active project workspace
      delete. Schema rebuild must retain the old layer until its staged replacement is saved in the
      same map commit that removes old references. Backup must include every attachment file that is
      physically present in the layer directory, while server-only attachment metadata remains in the
      attachment table and must never trigger a network download during backup. If backup fails, local
      feature data must remain unchanged and the user must see an alert with the failure reason. Non-editable Collector
      layers and recreatable raster-style tile caches are not data-backup operations. LayerBackups/
      is capped by preference layer_backup_max_gb (default 5); oldest ZIP archives are deleted when
      the limit is exceeded. After a successful attachment push, the local file stays under the
      server attach id and FeatureAttachments is updated so identification works without a second sync.
      Pulling server attachment metadata without downloading its bytes is not destructive: metadata
      is compared with and persisted to FeatureAttachments, not with optional local META files, and
      must not trigger a feature backup by itself. Whole-feature deletion remains backup-gated.
    related_code:
      - maplibui/src/main/java/com/nextgis/maplibui/util/LayerBackupManager.java
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - maplib/src/main/java/com/nextgis/maplib/map/NGWVectorLayer.java
      - maplib/src/main/java/com/nextgis/maplib/util/RemoteAttachmentSyncPolicy.java
      - maplibui/src/main/java/com/nextgis/maplibui/fragment/LayersListAdapter.java
      - app/src/main/java/com/nextgis/mobile/activity/ProjectSettingsActivity.kt
    verify_smoke: [SMOKE-BACKUP-GATE, SMOKE-PROJECT-MANAGEMENT, SMOKE-SCHEMA-REBUILD-GUARD]
    must_update_docs:
      - docs/architecture/collector-projects.md
      - docs/architecture/ngw-sync-and-storage.md
      - docs/runbooks/incident-and-rollback.md
      - docs/registry/config-keys.yaml
      - docs/reference/settings-and-config.md
  INV-MULTIPOLYGON-REPAIR:
    title: Invalid multi-polygons repair into one feature before attribute entry
    owners: [app, maplib, maplibui]
    statement: >
      Automatic topology repair is enabled only when the selected layer type is exactly
      GTMultiPolygon. A valid input remains unchanged; an invalid input may split or union
      polygonal parts but must produce one valid GeoMultiPolygon with the original CRS,
      one feature and one attribute-form handoff. Empty, non-polygonal or still-invalid
      repair output blocks Save and keeps geometry editing active. GTPolygon, LineString
      and MultiLineString retain their existing behavior and never enter this repair path.
      MapLibre conversion assigns CRS to the multi-polygon, polygons and rings. For drafts
      created by an older conversion, repair recovers a missing collection CRS from the
      nested polygon, ring or point before the JTS round trip. A ring with fewer than three
      distinct positions is classified before topology repair and must show the standard
      insufficient-points message rather than a repair-failed message.
    related_code:
