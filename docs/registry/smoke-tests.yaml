      Creation starts immediately with one node at the projected screen centre; taps and midpoint actions build the
      geometry without a generated segment or square. A new MultiPolygon contains exactly one
      polygon part and no sketch action can add or delete a part or hole. Standard line and
      polygon toolbars contain neither touch append nor an overflow trigger. Walk append is
      available from the initial sketch, inserts after the selected node and previews current GPS;
      before insertion the selected node is red and only its ordered successor and connecting
      segment inside the same part/ring are orange; an open endpoint has no target and a closed
      ring wraps to its own first node. Multi geometry never points into another part or ring.
      its separate panel finishes recording only after the service persists and acknowledges the final snapshot.
      For every supported geometry type the attribute action becomes enabled with geometry and
      follows the same validation, topology repair and single-form handoff as Save. Existing
      multipart geometry and holes remain intact unless their vertices are explicitly edited.
      Every successful new/existing geometry or attribute save ends editing, clears selection,
      closes the attributes panel and restores the standard map controls. Failed writes retain
      their edit context; explicit form cancellation follows its normal cancellation path.
      Cancelling a new sketch first requires confirmation; continuing leaves the sketch intact,
      while confirmed cancellation returns to normal map mode without a disabled action panel or
      a duplicate plus button. Ruler area is displayed in hectares. A restored Polygon has one
      outer fill, the original vertex count and no invented hole. A self-intersecting simple
