  INV-PROJECT-OPERATION-EXCLUSION:
    title: Active project identity is stable during database background work
    owners: [app, maplib, maplibui]
    statement: >
      Manual sync operates only on accounts represented in the active map and owns that workspace
      from the button press through every sequential account. Periodic sync, layer fill and schema
      rebuild also own a workspace. Switch/create/rename/delete and duplicate full sync are refused
      until all owners finish. Collector import reserves the switch before creating or updating its
      workspace entry; if another owner is active, import leaves the registry unchanged and explains
      in a modal dialog that synchronization or loading must finish. A dependent fill may reserve only the same workspace while sync is
