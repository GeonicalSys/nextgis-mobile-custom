schema_version: 1
preferences:
  show_sync:
    owner: app
    type: boolean
    default: false
    user_configurable: true
    source: app/src/main/res/xml/preferences_general.xml
    purpose: Optional synchronization start/finish/cancel notices only; queue errors bypass this preference and silent Android foreground indicators last only while the service runs. Preserve explicit user choice.
  track_send:
    owner: app
    type: boolean
    default: true
    user_configurable: true
    source: app/src/main/res/xml/preferences_tracks.xml
    purpose: Independent upload intent; registration and connectivity defer delivery without clearing this choice.
  track_registered_device:
    owner: maplibui
    type: string
    source: maplibui/src/main/java/com/nextgis/maplibui/mapui/TrackRegistrationState.java
    purpose: SHA-256 fingerprint of the exact server and UID after registered=true; absent or mismatched identity hides track badges, registered=false revokes matching confirmation, transport failure preserves known registration. Independent of upload intent and packet ACK.
  track_send_default_enabled_v1:
    owner: maplib
    type: boolean
    default: false
    source: maplib/src/main/java/com/nextgis/maplib/util/TrackSendSettings.java
    purpose: Enable legacy registration-disabled upload once; preserve subsequent user opt-out.
  battery_dont_show_pref:
    owner: app
    type: boolean
    default: false
    source: app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
    purpose: Suppress only the legacy Doze exemption prompt; never suppress a current Battery Saver restriction or launch/resume background-location warning.
  tracks_temp:
    owner: maplibui
    type: shared_preferences_file
    source: maplibui/src/main/java/com/nextgis/maplibui/service/TrackerService.java
    purpose: Owning track_uri, track_map and pending_stop retain Stop intent until the ordered queue and session closure commit.
  location_source:
    owner: app
    type: string
    default: '3'
    source: maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
    purpose: Retired user switch; migrated to GPS-first display with Network only when GPS is absent or stale, shown as a non-editable explanation.
  gnss_input:
    owner: app
    type: string
    default: system
    user_configurable: true
    source: app/src/main/res/xml/preferences_location.xml
    purpose: Choose Android system GNSS or a native external receiver (Bluetooth Classic/LE, USB, TCP/IP) without Mock Location; identified ComNav/Pigo BLE uses paired 3A20 UART and additive BESTPOSB initialization without altering correction inputs.
  gnss_device:
    owner: app
    type: preference_action
    user_configurable: true
    source: app/src/main/res/xml/preferences_location.xml
    purpose: Open the external GNSS device picker for Bluetooth Classic/LE, USB or TCP/IP.
  gnss_transport:
    owner: app
    type: string
    default: bluetooth_classic
    source: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    purpose: Selected external GNSS transport when gnss_input is external.
  gnss_device_id:
    owner: app
    type: string
    default: ''
    source: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    purpose: Saved Bluetooth address, USB device key or TCP host:port for the external NMEA session.
  gnss_device_name:
    owner: app
    type: string
    default: ''
    source: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    purpose: Human-readable receiver name shown in settings; not used for matching.
  gnss_tcp_host:
    owner: app
    type: string
    default: ''
    source: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    purpose: Host of a raw NMEA TCP stream from the receiver, not an NTRIP caster.
  gnss_tcp_port:
    owner: app
    type: string
    default: '9001'
    source: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    purpose: TCP port of the receiver NMEA stream.
  verbose_log:
    owner: app
    type: boolean
    default: false
    user_configurable: true
    source: app/src/main/res/xml/preferences_general.xml
    purpose: Opt-in HyperLog dump of every GNSS/NMEA measurement including coordinates; diagnostics only.
  tracks_location_source:
    owner: app
    type: string
    default: '1'
    source: maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
    purpose: Retired user switch; migrated to GNSS chip or mock-receiver recording for tracks and walking geometry.
  debug_companion_install:
    owner: app
    type: app_private_shared_preferences
    user_configurable: false
    source: app/src/main/java/com/nextgis/mobile/util/DebugCompanionInstaller.java
    purpose: Verified companion manifest, permission/install phase and originating project UID; separate from self-update state, resumed after the external Activity result or process recreation rather than intermediate dialog focus; completed companion install returns to Underlay storage for the same project
  shared_underlay_migration:
    owner: maplibui
    type: app_private_shared_preferences
    user_configurable: false
    source: maplibui/src/main/java/com/nextgis/maplibui/util/SharedUnderlayProjects.java
    purpose: Completed initial shared-underlay migration marker; per-layer recovery and repair of mismatched shared raster formats remain idempotent independently of this marker
  com.nextgis.mobile.PREFS_UNDERLAYS:
    owner: app
    type: preference_action
    user_configurable: true
    source: app/src/main/res/xml/preference_headers.xml
    purpose: Open shared underlay management directly from the top-level Settings list next to Project; Geonical may also start Debug underlay import from that catalog
  sync_all_projects:
    owner: app
    type: boolean
    default: true
    user_configurable: true
    source: app/src/main/res/xml/preferences_general.xml
    purpose: Scope manual and per-account scheduled sync to all downloaded projects; false limits new runs to the open project, while exact pending recovery and layer-specific commands retain their owner
  sync_recovery_journal:
    owner: app
    type: app_private_shared_preferences
    user_configurable: false
    source: app/src/main/java/com/nextgis/mobile/util/SyncRecoveryJournal.java
    purpose: Atomically persist pending_v2 project/account pairs before the queue begins; acknowledge only after scoped children finish and resolve recovery identities through the registry across active-project changes
  map_show_loc:
    owner: app
    type: boolean
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: Show current location on the map
  map_show_compass:
    owner: app
    type: boolean
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: Show compass UI
  map_rotation_enabled:
    owner: app
    type: boolean
    default: false
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    consumer: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    purpose: Allow two-finger MapLibre rotation; disabling restores north-up orientation
  map_bearing:
    owner: app
    type: float_degrees
    default: 0
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    consumer: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    purpose: Persist camera bearing only while explicit map rotation is enabled
  photo_overlay_enabled:
    owner: app
    type: boolean
    default: true
    source: app/src/main/res/xml/preferences_map.xml
    consumer: maplibui/src/main/java/com/nextgis/maplibui/activity/ModifyAttributesActivity.java
    purpose: Burn WGS84 coordinates into newly attached photos
    migration: Enabled once on existing installations by photo_overlay_defaults_enabled_v1
  photo_overlay_use_object_coords:
    owner: app
    type: boolean
    default: true
    source: app/src/main/res/xml/preferences_map.xml
    consumer: maplibui/src/main/java/com/nextgis/maplibui/activity/ModifyAttributesActivity.java
    purpose: Use the edited object's representative coordinate for the photo overlay
    migration: Enabled once on existing installations by photo_overlay_defaults_enabled_v1
  photo_overlay_defaults_enabled_v1:
    owner: app
    type: boolean
    default: false
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: One-time marker after enabling the two new photo-overlay defaults on an existing install
  keep_screen_on:
    owner: app
    type: boolean
    default: true
    user_configurable: true
    source: app/src/main/res/xml/preferences_map.xml
    consumer: maplibui/src/main/java/com/nextgis/maplibui/mapui/MapViewBase.java
    purpose: Keep the map screen awake while the map view is visible
    ui: app/src/main/res/xml/preferences_map.xml (Карта → Не отключать экран)
    migration: Enabled once on existing installations by keep_screen_on_default_enabled_v1
  keep_screen_on_default_enabled_v1:
    owner: app
    type: boolean
    default: false
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: One-time marker after enabling keep_screen_on on an existing install
  stakeout_sound_enabled:
    owner: app
    type: boolean
    default: true
    source: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutSettings.java
    ui: app/src/main/res/xml/preferences_location.xml (Местоположение → Вынос координат)
    purpose: Initial sound-guidance state for each new foreground stakeout or current-location-to-map-point session; static point-to-point measurement does not use it. Muting never changes the location-only service type or makes Bluetooth permission mandatory; rejected starts release GPS and audio.
  stakeout_far_distance:
    owner: app
    type: string_decimal_meters
    default: "5.0"
    source: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutSettings.java
    ui: app/src/main/res/xml/preferences_location.xml (Местоположение → Вынос координат)
    purpose: Outer boundary for the slow stakeout cue
  stakeout_medium_distance:
    owner: app
    type: string_decimal_meters
    default: "1.0"
    source: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutSettings.java
    ui: app/src/main/res/xml/preferences_location.xml (Местоположение → Вынос координат)
    purpose: Outer boundary for the medium stakeout cue
  stakeout_near_distance:
    owner: app
    type: string_decimal_meters
    default: "0.5"
    source: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutSettings.java
    ui: app/src/main/res/xml/preferences_location.xml (Местоположение → Вынос координат)
    purpose: Outer boundary for the fast stakeout cue
  stakeout_reached_distance:
    owner: app
    type: string_decimal_meters
    default: "0.1"
    source: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutSettings.java
    ui: app/src/main/res/xml/preferences_location.xml (Местоположение → Вынос координат)
    purpose: Horizontal in-tolerance distance requiring two fresh GPS or mock precision fixes
  stakeout_declination_correction:
    owner: app
    type: string_decimal_degrees
    default: "0"
    source: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutSettings.java
    ui: app/src/main/res/xml/preferences_location.xml (Местоположение → Вынос координат) and the live/static azimuth widget
    purpose: East-positive offset added to WMM2025 declination while converting true bearing to magnetic azimuth; persists until the user changes or resets it to 0; the widget declination line shows D+C
  check_updates:
    owner: app
    type: boolean
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: Enable application update checks
  layer_backup_max_gb:
    owner: app
    type: string
    default: "5"
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    ui: app/src/main/res/xml/preferences_general.xml (Общие → Другое)
    purpose: Max size of LayerBackups/ directory in gigabytes; oldest ZIPs are deleted when exceeded
  sw_track_service:
    owner: app
    type: boolean
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: Tracking foreground-service preference
  track_recording_enabled:
    owner: maplib
    type: boolean
    default: false
    source: maplib/src/main/java/com/nextgis/maplib/util/SettingsConstants.java
    purpose: >
      Durable user intent for track recording, not confirmation that a service or track row exists; cleared by explicit Stop track menu.
      BootLoader and MainActivity auto-resume TrackerService when true. Toolbar and service
      read it in the default application process so a delayed Start cannot overtake Stop.
      Map GPS callbacks use this flag to request asynchronous track rendering without a main-thread SQLite unfinished-track query.
  track_recording_mode:
    owner: maplibui
    type: string
    default: walk_and_drive
    source: maplibui/src/main/java/com/nextgis/maplibui/service/TrackerService.java
    ui: Track button dropdown (Pedestrian / Pedestrian + car)
    purpose: >
      Checkpointed before interactive start; pedestrian skips speeds above 30 km/h before
      sampling and resumes in a new persisted segment. walk_and_drive keeps shared GNSS
      validation without the pedestrian cap. Missing or unknown values preserve legacy
      mixed recording. The selected mode survives process death and cannot change while
      recording or a pending Stop is active. No database migration or walk policy change.
  permission_requested_marker:
    owner: app
    type: boolean
    default: false
    source: app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
    purpose: Per-permission preference keys permission_requested_<Android permission name> distinguish a first request from a permanently denied request so the next launch offers app settings.
  background_recording_sound:
    owner: maplibui
    type: boolean
    default: true
    source: maplibui/src/main/java/com/nextgis/maplibui/util/SettingsConstantsUI.java
    ui: app/src/main/res/xml/preferences_tracks.xml (Настройки → Треки)
    consumer: maplibui/src/main/java/com/nextgis/maplibui/util/BackgroundRecordingSoundMonitor.java
    purpose: >
      While track or walk recording is active and the app UI is hidden, keep a fixed
      10-second alarm-stream heartbeat as long as the shared GNSS stream
      supplies fresh validated measurements before point decimation, including unchanged stationary
      coordinates. Notification volume does not suppress it; zero or muted alarm volume
      selects short vibration, including a distinct double vibration for a throttled
      persistence failure. Silence all feedback when delivery stops or the setting is disabled.
      This switch does not own or disable the GPS recording wake lock.
  ngw_identity_backup:
    owner: maplib
    type: string
    default: absent
    source: maplib/src/main/java/com/nextgis/maplib/util/SettingsConstants.java
    purpose: >
      Per-layer SharedPreferences JSON containing the last fully initialized NGW account,
      remote id, sync policy and origin; used only to heal an interrupted/partial layer config.
  feature_form_draft:
    owner: maplibui
    type: shared_preferences_file
    source: maplibui/src/main/java/com/nextgis/maplibui/util/FeatureFormDraftStore.java
    purpose: Compatible v1 typed form snapshot with map/operation UUID, assigned feature id, geometry, fields/sign strokes, photos, cascade definition/keys/original values and point/walk owners; periodic, pre-Save and post-id checkpoints survive retry
  geometry_edit_draft:
    owner: maplibui
    type: shared_preferences_file
    source: maplibui/src/main/java/com/nextgis/maplibui/util/GeometryEditDraftStore.java
    purpose: >
      Latest unfinished non-walk geometry WKT plus active map, layer, feature and edit-mode
      identity; cleared only by explicit Cancel, successful update, form handoff or Discard
  walkedit_temp:
    owner: maplibui
    type: shared_preferences_file
    source: maplibui/src/main/java/com/nextgis/maplibui/service/WalkEditService.java
    purpose: >
      Durable full-geometry walk owner with map path, session UUID, RECORDING/FINISHING/FINISHED
      phase, revision and optional point owner/stage/layer/tool; preserves legacy part WKT,
      insertion target and user-controlled gps_paused. GPS loss and sticky recovery never
      infer a new pause; the next usable fix continues automatically. Every manual command is locked until point Save/Cancel.
      Finish acknowledges the final snapshot; successful feature Save or explicit Discard clears it.
    session_source: maplibui/src/main/java/com/nextgis/maplibui/util/WalkSessionStore.java
manifest_metadata:
  io.sentry.auto-init:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Disable provider auto-init; AppDiagnostics initializes after the isolated-script UID guard with explicit delivery, payload-size and duplicate-frequency limits.
  com.nextgis.mobile.UPDATE_FLAVOR:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Bind installed and downloaded APK to the explicit lisa, belka or debug channel independently of version or filename; the pending production 3.1.2.27/221 bump retains channel identities.
  io.sentry.traces.user-interaction.enable:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Disable automatic UI interaction breadcrumbs
  io.sentry.attach-screenshot:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Disable unsupported generic screenshot attachments; useful diagnostics are serialized inside the event.
  io.sentry.attach-view-hierarchy:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Disable collection of the full Android view hierarchy
  io.sentry.traces.sample-rate:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Disable performance traces; the receiver is used for error reports only.
  io.sentry.traces.profiling.sample-rate:
    owner: app
    source: app/src/main/AndroidManifest.xml
    purpose: Disable performance profiles; the receiver is used for error reports only.
runtime_constants:
  feature_type_initial_values:
    owner: maplibui
    source: maplibui/src/main/java/com/nextgis/maplibui/util/FeatureTypeDefaults.java
    purpose: Explicit typed new-feature control state including stable cascade keys and a small verified definition pin; restored Activity or durable draft state takes precedence.
  SOURCE_REVISION:
    owner: app
    type: string
    source: app/build.gradle
    purpose: BuildConfig Git HEAD plus optional dirty marker, included as diagnostic source_revision without changing the APK version.
  apk_version_update:
    owner: app
    type: https_url
    source: app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
    purpose: Base URL of the branch-oriented Lisa Mobile APK repository
variant_resources:
  provider_auth:
    owner: app
    source: app/build.gradle
    purpose: Variant-specific GIS ContentProvider and SyncAdapter authority
  nextgis_accounts_auth:
    owner: app
    source: app/build.gradle
    purpose: Variant-specific AccountAuthenticator account type
  nextgis_accounts_auth_type:
    owner: app
    source: app/build.gradle
    purpose: Variant-specific SyncAdapter account type; must equal nextgis_accounts_auth and MainApplication runtime type
build_inputs:
  diagnosticDeliveryChecks:
    owner: app
    source: app/build.gradle
    optional: true
    purpose: Opt-in false-by-default Gradle property selects an emulator-only diagnostic test runner with an explicit synthetic DSN; normal APK configuration is unchanged.
  ciReliabilityChecks:
    owner: app
    source: app/build.gradle
    optional: true
    purpose: Explicit Gradle property permits empty Sentry DSN only when private sentry.properties is absent during CI reliability checks.
  sentry.properties:
    owner: app
    source: sentry.properties
    secret_values_forbidden: true
    optional: true
    purpose: Private Sentry Gradle configuration required by normal builds; optional only with explicit ciReliabilityChecks=true when the file is absent
  local.properties:
    owner: root
    source: local.properties
    secret_values_forbidden: true
    optional: true
    purpose: Local Android SDK and developer-specific configuration
  maplibui-client-id:
    owner: maplibui
    source: local.properties
    key: client.id
    secret_values_forbidden: true
    optional: true
    purpose: NGID client identifier injected into BuildConfig
storage:
  hyperlog-local-only:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/util/LocalLogInitializer.java
    location_name: URL in HyperLog SharedPreferences
    purpose: Remove obsolete upload endpoint before first process initialization without touching local logs or export settings; never persist a dummy endpoint.
  diagnostic-reports:
    owner: app
    source: app/src/main/java/com/nextgis/mobile/util/AppDiagnostics.java
    purpose: SDK cache under private files/diagnostic-reports partitioned by DSN, bounded to 256 ordinary envelopes; contract 2 retains supplied URLs/query/headers/context without content masking, with bounded strings/collections. Connected WorkManager retry is independent of GIS sync and a process-local ten-minute HTTP 5xx filter never drops cached replay or fatal events.
  ngw-field-required:
    owner: maplib
    location_name: fields[].required in the local layer config JSON
    source: maplib/src/main/java/com/nextgis/maplib/datasource/Field.java
    purpose: Cache authoritative feature_layer.fields[].required for offline form validation; absent means false, changes refresh metadata without SQLite rebuild.
  feature-save-journal:
    owner: maplib
    location_name: ngm_feature_save_journal in owning layers.db
    source: maplib/src/main/java/com/nextgis/maplib/util/FeatureSaveJournal.java
    purpose: Local layer-operation UUID to row-id mapping reconciles lost feature/attachment insert replies; no NGW schema change.
  pending-track-points:
    owner: maplib
    location_name: pending-track-points directory inside owning map workspace
    source: maplib/src/main/java/com/nextgis/maplib/util/PendingTrackPoints.java
    purpose: Capacity2048 ordered UUID AtomicFile JSON queue; corrupt entries retained; acknowledged only after idempotent SQLite insert.
  updater-pending-install:
    owner: app
    location_name: app_update_state SharedPreferences
    source: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
    purpose: One-shot validated update manifest used only while Android install permission is pending; resume revalidates APK identity and Android 9-10 certificate fallback before installation
  collector-registry:
    owner: maplibui
    location_name: collector_projects_registry.json
    source: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorProjectRegistry.java
    purpose: Schema-v2 registry of WEBGIS/LOCAL identity, display alias, remote metadata and isolated map path
  collector-workspaces:
    owner: maplibui
    location_name: collector_projects with atomic per-workspace project.json sidecars
    source: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorProjectRegistry.java
    purpose: Isolated maps/layers/tracks; tombstone rename makes device-only deletion recoverable before registry commit
  collector-initial-local-project:
    owner: maplibui
    location_name: collector_initial_local_project_created_v1 SharedPreferences plus stable initial local workspace identity
    source: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorProjectRegistry.java
    purpose: One-time creation of the initial local project and non-destructive adoption of a legacy standalone map before the first MapDrawable opens
  collector-import-journal:
    owner: maplibui
    location_name: collector_import_journal_<SHA256 canonical map path> SharedPreferences; UID-gated migration from legacy collector_import_journal
    source: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorImportJournal.java
  collector-form-transaction:
    owner: maplibui
    location_name: .collector_form_transaction.properties and same-directory stage/backup files
    source: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorFormFileTransaction.java
  ngw-schema-rebuild-guard:
    owner: maplibui
    location_name: ngw_schema_rebuild_guard SharedPreferences
    source: maplibui/src/main/java/com/nextgis/maplibui/util/SchemaRebuildRetryGuard.java
    purpose: Per workspace/account/remote-id mismatch fingerprint with two attempts per 24 hours and ten-minute retry cooldown
  layer-backups:
    owner: maplibui
    location_name: LayerBackups
    source: maplibui/src/main/java/com/nextgis/maplibui/util/LayerBackupManager.java
    purpose: ZIP archives of editable layer tables plus attachment files physically present on this device before destructive ops; server-only payloads are not downloaded; quota via layer_backup_max_gb
layer_json:
  feature_label_field:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
    type: string
    default: _id
    purpose: >
      Field used as the feature title in identify candidate lists, selection
      toolbar and attribute table; independent from renderer text labels.
    migration: >
      Existing per-layer layer_label preference remains the fallback and is
      mirrored into config.json after the first successful layer load.
  mobile_render_mode:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/util/LayerConfigUtil.java
    purpose: >
      Select classic rendering or opt-in local_vector_tiles for read-only
      polygon/multipolygon and simple circle Point layers; unsupported geometry,
      editability or point style falls back to classic rendering.
  render_mode:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/util/LayerConfigUtil.java
  layer_origin:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/util/LayerConfigUtil.java
  mobile:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/util/LayerConfigUtil.java
  ngrc_provenance:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/map/TMSLayer.java
    purpose: Immutable-local NGRc source name, full original archive SHA-256 and import timestamp; Mapnik.json and raster path normalization do not change source identity
  legacy_underlay_migration:
    owner: maplib
    source: maplib/src/main/java/com/nextgis/maplib/map/TMSLayer.java
    purpose: Debug source package, stable source-layer key and migration timestamp used to make cross-package underlay retries duplicate-safe

form_rules:
