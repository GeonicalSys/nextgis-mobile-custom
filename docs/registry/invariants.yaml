schema_version: 1
invariants:
  INV-FLAVORS:
    title: Lisa and Belka remain separate product flavors
    owners: [app]
    statement: Preserve lisa and belka product flavors, their brand resources, display names and update flavor identity.
    related_code:
      - app/build.gradle
      - app/src/main/AndroidManifest.xml
      - app/src/lisa
      - app/src/belka
    verify_smoke: [SMOKE-LISA-RELEASE, SMOKE-BELKA-RELEASE, SMOKE-SELF-UPDATE]
    must_update_docs:
      - docs/reference/flavors-and-versioning.md
      - docs/runbooks/release-apk.md
  INV-VERSION-COUPLING:
    title: Fork version and maplib diagnostic version stay compatible
    owners: [app, maplib]
    statement: Use <upstream-base>.<fork-patch>, monotonically increase app versionCode per published channel, keep maplib BuildConfig version aligned per variant, and ensure a debug-only bump leaves both production release APK metadata unchanged.
    related_code:
      - app/build.gradle
      - maplib/build.gradle
    verify_smoke: [AUTO-APP-VERSION-MATRIX, SMOKE-LISA-RELEASE, SMOKE-BELKA-RELEASE]
    must_update_docs:
      - docs/reference/build-matrix.md
      - docs/reference/flavors-and-versioning.md
      - docs/runbooks/release-apk.md
  INV-MAPLIBRE-BACKEND-COMPATIBILITY:
    title: Production map rendering does not require Vulkan
    owners: [app, maplibui, maplib]
    statement: MapLibre Android 13.0.2 must resolve through org.maplibre.gl:android-sdk-opengl in app, maplibui and maplib; the generic android-sdk or android-sdk-vulkan artifacts must not enter the production runtime because supported devices may lack a compatible Vulkan implementation.
    related_code:
      - app/build.gradle
      - maplibui/build.gradle
      - maplib/build.gradle
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-ASSEMBLE, AUTO-APP-VERSION-MATRIX, SMOKE-MAP-OPENGL-COMPATIBILITY]
    must_update_docs:
      - docs/reference/build-matrix.md
      - docs/architecture/map-rendering.md
      - docs/reference/official-differences.md
      - app/docs/README.md
      - maplibui/docs/README.md
      - maplib/docs/README.md
  INV-MAPLIBRE-VIEW-LIFECYCLE:
    title: MapLibre renderer follows the Fragment view lifecycle
    owners: [app, maplib]
    statement: >
      Every MapLibre MapView created by MapFragment receives onCreate, onStart,
      onResume, onPause, onStop, onSaveInstanceState, onLowMemory and onDestroy
      from the matching Fragment view lifecycle. Returning from another screen,
      backgrounding, screen lock or Activity recreation must resume rendering;
      onDestroyView must release the old native renderer and clear only bindings
      that still point to that destroyed MapView; a late touch event must be
      discarded before it queries that renderer. Every supported API uses the
      MapLibre SurfaceView renderer so EGL_CONTEXT_LOST can recreate its context
      and surface; API 26-28 additionally disables tile prefetch. No API caps
      MapLibre FPS or keeps CONTINUOUS while the map is idle; recovery on every
      API uses a short CONTINUOUS burst and then restores WHEN_DIRTY.
      Resume and completed project-style application request a bounded continuous
      render and Android-presentation burst. Recovery may complete only after a
      fully rendered frame with no loading foreground; it must not treat an app-
      side frame count as MapLibre's internal InitialRenderCallback state. Once
      app sources/layers are applied, a surviving loading foreground is removed
      without a full style reload; every pending callback is cancelled on pause
      or view destruction and the API-specific idle rendering mode is restored.
    related_code:
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - app/src/main/res/layout/fragment_map.xml
      - app/src/main/res/values/maplibre_rendering.xml
      - app/src/main/res/values-v29/maplibre_rendering.xml
    verify_smoke: [AUTO-APP-RELEASES, SMOKE-MAP-SURFACE-LIFECYCLE]
    must_update_docs:
      - docs/architecture/map-rendering.md
      - docs/reference/official-differences.md
      - app/docs/README.md
      - app/docs/manifest.yaml
  INV-NGW-ACCOUNT-IDENTITY:
    title: Every build variant exposes one consistent NGW account identity
    owners: [app, maplibui]
    statement: MainApplication runtime account type, AccountAuthenticator metadata and SyncAdapter metadata must resolve to the same variant-specific value; provider runtime and manifest authorities must also match.
    related_code:
      - app/build.gradle
      - app/src/main/java/com/nextgis/mobile/MainApplication.java
      - app/src/main/res/xml/syncadapter.xml
      - maplibui/src/main/res/xml/authenticator.xml
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - maplibui/src/main/java/com/nextgis/maplibui/activity/NGWLoginActivity.java
    verify_smoke: [SMOKE-NGW-ACCOUNT-ADD, SMOKE-LISA-RELEASE, SMOKE-BELKA-RELEASE]
    must_update_docs:
      - docs/reference/flavors-and-versioning.md
      - docs/architecture/ngw-sync-and-storage.md
      - app/docs/manifest.yaml
      - maplibui/docs/manifest.yaml
  INV-NGW-RESOURCE-DIALOG-LIFECYCLE:
    title: NGW resource errors use only a live Activity window
    owners: [maplibui]
    statement: >
      Asynchronous NGW connection and resource-tree failures may use application context for
      background work and localized strings, but a user dialog must use the owning Activity only
      while it is neither finishing nor destroyed. A late result after the selector lifecycle ends
      is discarded from UI and must never terminate the process with BadTokenException.
    related_code:
      - maplibui/src/main/java/com/nextgis/maplibui/dialog/NGWResourcesListAdapter.java
    verify_smoke: [AUTO-MAPLIBUI-ASSEMBLE, SMOKE-NGW-CONNECTION-FAILURE]
    must_update_docs:
      - maplibui/docs/README.md
      - maplibui/docs/manifest.yaml
      - docs/reference/official-differences.md
  INV-LAYER-ORDER:
