  lisa_id:
    owner: maplibui
    source: maplibui/src/main/java/com/nextgis/maplibui/util/FormFieldLayout.java
    purpose: Unique top-level NGFP element name for v2 visible.element; Latin letters, underscores and hyphens only, up to 128 chars, preserving legacy clone compatibility.
  lisa_required_pin:
    owner: maplibui
    source: maplibui/src/main/java/com/nextgis/maplibui/util/ConditionalRequiredController.java
    purpose: Verified SHA-256 snapshot in the owning layer form_rules directory, with empty pin preserving absence; no large definitions in Bundle/durable draft.

