schema_version: 1
module_id: app
repository_id: root
maturity: maintained
last_verified: 2026-10-09
entrypoints:
  - app/src/main/java/com/nextgis/mobile/MainApplication.java
  - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
  - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
  - app/src/main/AndroidManifest.xml
key_components:
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/MapEditingToolsTest.java
    responsibility: Verify category choices through sketch, current-location and background-walk creation, recreation, interrupted recorder recovery, point-lock cancellation and the real attribute-form SQLite Save; isolated emulator only.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/StandardFeatureTypesTest.java
    responsibility: Verify all 40 standard point, line and polygon style categories, symbols and canonical class/type defaults, including the actual mixed point form; isolated emulator only.
  - path: app/src/main/java/com/nextgis/mobile/util/AppDiagnostics.java
    responsibility: Initialize error-only Sentry after the isolated UID guard, redact event data and record typed operation stages without reading business data or raw logs.
  - path: app/src/main/java/com/nextgis/mobile/util/DiagnosticsTransport.java
    responsibility: Persist SDK envelopes before async HTTP, retain offline/5xx/rate-limited events, acknowledge SDK crash/replay hints and preserve TLS validation.
  - path: app/src/main/java/com/nextgis/mobile/util/DiagnosticsRetryWorker.java
    responsibility: Retry existing SDK cache/outbox from a connected periodic WorkManager job without opening a GIS project or reinstalling crash handlers.
  - path: app/src/main/java/com/nextgis/mobile/util/DiagnosticsPolicy.java
    responsibility: Bound and redact diagnostic messages, filter expected offline/cancellation outcomes and limit duplicate handled failures.
  - path: app/src/androidTest/java/com/nextgis/mobile/util/DiagnosticsDeliveryTest.java
    responsibility: Test offline handled/fatal reports, process restart, network return and real WorkManager after HTTP 503 on an isolated emulator with explicit test DSN.
  - path: app/src/androidTest/java/com/nextgis/mobile/util/DiagnosticsTestRunner.java
    responsibility: Opt-in test APK runner supplies a synthetic test Application and DSN after rejecting physical or non-Debug devices.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/FormAppearanceTest.java
    responsibility: Verify real light/dark native fields, permanent captions, wrapped long choices, hidden comment layout and footer Save gate on synthetic offline data.
  - path: app/src/main/java/com/nextgis/mobile/util/ProjectSyncRunner.java
    responsibility: Apply default-on all-project scope to manual and scheduled passes; preserve the active map/draft while serially opening headless owning maps, draining async children and recording exact recovery pairs.
  - path: app/src/androidTest/java/com/nextgis/mobile/util/ProjectSyncRunnerTest.java
    responsibility: Native synthetic-project scope, failure continuation, durable queues, equal-id journals, cancellation and real background fill verification.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/ConditionalRequiredFieldsTest.java
    responsibility: Verify dynamic requirements, inactive tabs, toolbar and Back Save, immutable draft pins and corrupt snapshot failures before SQLite writes.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/CascadingFormsTest.java
    responsibility: Verify default-form metadata launch, independent full-width cascade controls and spacing, repeated native swipes over enabled fields and blank space, vertical scroll, text selection and signature exclusion.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/LayerPendingChangesTest.java
    responsibility: Exercise real drawer/worker with synthetic SQLite edits, deletion-only outbox, recycled rows and rotation; confirm row and global indicators clear together after acknowledgment.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/CascadingFormsTest.java
    responsibility: Real dependent NGFP spinners, both audit branches, SQL NULL clearing, pinned draft/recreation, mismatched-choice Save rejection, creation-category parent prefill, legacy pair persistence and asynchronous category-dialog results on synthetic offline SQLite.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/ProjectScriptsTest.java
    responsibility: Real isolated Binder, native VM, ownership, local history and NGFP save/draft regression.
  - path: examples/project-scripts/contractor-audit/manifest.json
    responsibility: Portable ten-layer contractor warning pilot using only native API v1.
  - path: app/src/main/java/com/nextgis/mobile/MainApplication.java
    responsibility: Skip normal initialization under the isolated script UID.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/RequiredFieldsTest.java
    responsibility: Exercise standard and NGFP required controls, whitespace/default placeholders, inactive tabs, dependent choices, Back Save, retained draft geometry/photos, optional placeholders and existing omitted fields against real SQLite without NGW writes.
  - path: app/src/main/java/com/nextgis/mobile/location/TrackPowerWarning.kt
    responsibility: Warn before manual track Start and on active-session Resume or power policy change; offer Battery Saver settings or explicit continuation without conflating Doze exemption or starting from settings.
  - path: app/src/main/java/com/nextgis/mobile/view/GnssDeviceAdapter.java
    responsibility: Render receiver names and measured or unknown Bluetooth RSSI on separate lines, clearing recycled signal rows for USB endpoints.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/TrackRecordingModesTest.java
    responsibility: Exercise the real foreground track service and SQLite for pedestrian drive gaps, missing speed, Stop during driving and mixed recording on an isolated Android emulator.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/StakeoutForegroundServiceTest.kt
    responsibility: Exercise real Android 14+ location foreground enforcement without Bluetooth, background lifetime, synchronous and asynchronous rejection, GPS lease cleanup, rapid owner replacement and obsolete start requests on an isolated emulator.
  - path: app/src/main/res/layout/layout_map_content.xml
    responsibility: Shared phone, landscape and tablet map content with mandatory track toggle and walk panel, a separate horizontal creation row and tools at the right edge.
  - path: app/src/main/java/com/nextgis/mobile/view/MapControlRail.java
    responsibility: Measure available height and width, preserve 48dp controls and expose overflow actions without overlapping the creation row or walk panel.
  - path: app/src/main/java/com/nextgis/mobile/view/MapControlGrid.java
    responsibility: Pure row-count policy covered by dimension and density boundary tests.
  - path: app/src/test/java/com/nextgis/mobile/view/MapLayoutContractTest.java
    responsibility: Require all phone, landscape and tablet wrappers to include the same complete map content and preserve the separate action row.
  - path: app/src/main/java/com/nextgis/mobile/fragment/LayersFragment.java
    responsibility: Run one serial manual-sync pipeline, reconcile sync animation and the determinate progress ring in both directions against worker-owned state and the process-wide data-sync lease throughout the visible lifecycle, query pending changes off the main thread with lifecycle and map guards, and confirm explicit rechecking of skipped server geometries on long press.
  - path: app/src/main/java/com/nextgis/mobile/provider/ExportFileProvider.java
    responsibility: For GPX FileProvider URIs, advertise text/xml in getType and anonymous lookup so MimeTypeMap clients do not append .bin or .null, while retaining canonical root and grant checks.
  - path: app/src/main/java/com/nextgis/mobile/activity/UnderlayCatalogActivity.kt
    responsibility: Browse shared assets, attach, rename and confirm deletion with affected projects; warn before catalog attachment or legacy import interrupts an active synchronization; offer Debug underlay import into the active project on Geonical with visible byte/tile progress, explicit cancellation and a confirmed Back exit during an active transfer, except in layer-picker mode; AppTheme.UnderlayCatalog and an explicit Toolbar above the list respect system bar and display cutout insets in both modes.
  - path: app/src/main/res/layout/activity_underlay_catalog.xml
    responsibility: Keep catalog toolbar, transfer progress/status/cancel controls, empty state, Debug import action and scrolling assets in a vertical layout below system insets.
  - path: app/src/main/java/com/nextgis/mobile/util/DebugCompanionInstaller.java
    responsibility: Separate trusted Debug installer, actual PackageManager exporter availability and enabled/exported checks, durable permission/project continuation, and focus-safe dialog/external-result guards shared by MainActivity and UnderlayCatalogActivity.
  - path: app/src/main/java/com/nextgis/mobile/util/DebugCompanionPolicy.java
    responsibility: Pure manifest, URL, version and signing identity rules for the Debug companion.
  - path: app/build.gradle
    responsibility: Variant application ID, provider authority, NGW authenticator/sync account identity, flavor resources, explicit MapLibre 13.0.2 OpenGL backend, pending production 3.1.2.27/221 versus Lisa Debug 3.1.2.23/218 version contract, and signing configuration.
  - path: app/src/lisa/res/values/launcher_icon.xml
    responsibility: Lisa launcher, intro and about icon binding to density-specific ic_launcher_lisa resources without changing Belka branding.
  - path: app/src/belka/res/values/launcher_icon.xml
    responsibility: Belka-only launcher, intro and about icon binding to density-specific ic_launcher_belka resources without changing Lisa branding.
  - path: app/src/main/java/com/nextgis/mobile/MainApplication.java
    responsibility: Main-process initialization and logging; honour save_log or verbose_log for HyperLog export; create or adopt and activate the initial local project before GISApplication opens its first map, schedule exact registered project/account recovery across active-project changes, except that a pre-registry Debug workspace is kept in place for explicit underlay streaming and does not schedule shared-catalog migration; create editable local vector layers and keep default OSM at internal index zero plus tracks at the top of the reversed layer list for every workspace.
  - path: app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
    responsibility: Main navigation, per-launch and settings-return runtime permission checks for location, device accounts and legacy storage (notification permission is optional and requested only in Settings), track-mode dropdown with durable pedestrian/mixed selection, one-tap Stop without a location-permission gate, system-location-gated track/walk start, confirmed versus pending track toolbar/map-button state and failure warning, map rotation/location recovery, local file and shared-underlay import, default migration, walk-state reconciliation and crash-recovery hub, NGW URL/project selection, sync interruption, backup sharing and updater continuation.
  - path: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    responsibility: Choose Bluetooth Classic/LE, USB or TCP endpoint and persist gnss_input keys without Mock Location; show scan RSSI for duplicate-name Bluetooth receivers, request discovery permissions and release scans on pause/select/transport switch; identified ComNav/Pigo BLE uses the native paired UART/BESTPOSB session and expires stale HUD quality.
  - path: app/src/main/res/xml/preferences_general.xml
    responsibility: General settings including save_log file export, opt-in verbose_log GNSS dumps and a confirmed walk-only emergency reset action.
  - path: app/src/main/java/com/nextgis/mobile/util/WalkEmergencyReset.java
    responsibility: Remove only the durable walk owner and its owned form checkpoint for startup or user-confirmed emergency recovery.
  - path: app/src/main/java/com/nextgis/mobile/activity/SettingsActivity.java
    responsibility: Settings navigation with Project and Underlay storage as adjacent top-level entries, and updater continuation after Android special install permission returns to a manual update check.
  - path: app/src/main/res/xml/preferences_tracks.xml
    responsibility: Track settings UI, including enabled-by-default fixed ten-second background recording heartbeat shared with walk recording, gated by fresh usable location delivery rather than coordinate movement, audible through the alarm stream independently of notification volume and replaced by vibration when alarm audio is muted.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicy.java
    responsibility: Keep the legacy APK archive signature request on Android 9 and newer while also requesting modern SigningInfo, so Android 9 and 10 can validate a same-certificate update through the populated fallback field.
  - path: app/src/test/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicyTest.java
    responsibility: Lock the updater signature-flag contract at the API 27/28 boundary and across Android 9, 10, 11 and current SDKs.
  - path: app/src/main/java/com/nextgis/mobile/activity/ProjectChooserDialog.kt
    responsibility: Name-only project list with radios; a row tap selects, Open switches, Cancel leaves the current project.
  - path: app/src/main/java/com/nextgis/mobile/activity/ProjectSettingsActivity.kt
    responsibility: Active project information and controls for current-project sync, interrupt-before-action local project creation and device-only rename/delete, changed-layer backup gate and schema-rebuild guard reset.
  - path: app/src/main/java/com/nextgis/mobile/activity/LegacyUnderlayExportActivity.java
    responsibility: Require an explicit user confirmation in Debug before granting Geonical read-only underlay stream URIs.
  - path: app/src/main/java/com/nextgis/mobile/provider/LegacyUnderlayProvider.java
    responsibility: Stream one local Debug underlay through a granted pipe without exposing paths, accounts, vectors, tracks or project identity.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayImporter.java
    responsibility: Convert legacy extracted TMS/OSM tiles directly into batched, atomically published raster MBTiles; track pipe progress, cancel or inactivity-timeout a blocked descriptor, retry one stalled source, clean partial stages, and release the project lease before later sync.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayTransferPolicy.java
    responsibility: Define the Android-independent inactivity deadline, one-retry bound and transfer-exit confirmation policy for the cross-package underlay stream.
  - path: app/src/test/java/com/nextgis/mobile/util/LegacyUnderlayTransferPolicyTest.java
    responsibility: Lock inactivity, retry, cancel and catalog Back-exit confirmation policy without Android.
  - path: app/src/test/java/com/nextgis/mobile/util/LegacyUnderlayMigrationContractPolicyTest.java
    responsibility: Lock pre-registry Debug workspace deferral and the shared-catalog migration skip without Android.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayMigrationContract.java
    responsibility: Pin Debug/Geonical package and signing-certificate identities, define the bounded-memory framed streaming schema and detect the one legacy Debug workspace that must stay in place without shared-catalog migration until export.
  - path: app/src/main/java/com/nextgis/mobile/util/OfflineSyncIntentService.java
    responsibility: Reserve the active project before manual sync starts, own a cancellable registration for that reservation, run as a dataSync foreground service, delegate all downloaded projects and accounts to the shared scoped queue under one lease, start the session-scoped progress ring, and interrupt pending or active manual work on an explicit user request.
  - path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    responsibility: Map screen, complete MapLibre MapView lifecycle and renderer-reference cleanup across pause/resume/view recreation, bounded post-style continuous-render/presentation recovery and stale loading-foreground removal without full reload, EGL-recoverable SurfaceView on every API with bounded recovery bursts and no permanent old-API FPS limit, MaplibreMapInteraction implementation, opt-in persistent and immediate concurrent pinch/rotate gestures with north-up/location/layer-extent recovery, foreground rotation-vector heading cone on the GPS cursor without changing stand/go bearing, native NMEA HUD for RTK quality/sats/HDOP, hidden local-vector-tile attribute identification, track-mode popup and Start/Starting/Recording/Error button under the ruler with orange recording person and enlarged red dot, immediate current-camera-centre tap sketch creation with automatic target visibility, confirmed new-sketch cancellation without a duplicate add toolbar action, visible selected-to-successor insertion direction, hectare ruler labels with sketch-equivalent Undo/Redo routed to the active MapLibre measurement geometry and saved-instance restoration, selected-node independent walk insertion, passive preview, session-acknowledged minimum-vertex Finish, active final Save to attributes for new/existing features and confirmed direct Cancel with full point-session control lock, foreground stakeout host/widget plus transient current-location-to-point and arbitrary-point-to-point magnetic azimuth/distance modes with draggable editable endpoints and a widget that shows effective declination D+C without drag-hint copy, acknowledgement of completed post-fill style/source reload, shared Save/form handoff for new geometry with duplicate-launch protection, terminal successful-save cleanup to normal map mode with no feature selection for both new and existing objects, typed Polygon validation messages, GTMultiPolygon-only topology repair, durable non-walk geometry journal, and deferred current-style-safe geometry restoration and owner-aware recovery of coexisting walk and point drafts with polygon-only fill, stable outline and editable vertices after Stop. GPS callbacks use the durable recording flag and asynchronous map-owned track snapshots, never a synchronous unfinished-track query.
  - path: app/src/main/java/com/nextgis/mobile/location/DeviceHeadingProvider.kt
    responsibility: Foreground rotation-vector true heading for the map GPS cone, using WMM2025 declination without stakeout correction, plus magnetometer and heading-jitter inputs to HeadingConeAccuracy.
  - path: app/src/main/java/com/nextgis/mobile/location/HeadingConeAccuracy.kt
    responsibility: Combine rotation-vector heading accuracy, circular yaw jitter, raw-vs-filtered innovation and magnetometer field penalty, then open the cone faster than it closes.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutController.kt
    responsibility: Active selected-feature or arbitrary-point live-guidance lifecycle, in-place target replacement without releasing foreground resources, independent GPS listener, WMM2025 magnetic-bearing UI state with persisted declination correction, GPS/mock precision-source gate, reported-accuracy UI state, monotonic navigation-audio scheduling, 3 s freshness with a 1 s future-timestamp tolerance, high-frequency GPS lease ownership across screen-off/background state, and full rollback on synchronous or owning asynchronous foreground rejection.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutForegroundService.kt
    responsibility: Explicit location-only foreground notification and partial wake lock without Bluetooth permission, process-local session ownership, failure callback and obsolete-request foreground-contract completion without restoring GPS/audio.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutHeadingProvider.kt
    responsibility: Circularly filtered magnetic rotation-vector heading plus location-cached WMM2025 declination for the live guidance arrow without movement-bearing fallback.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/MagneticAzimuthCalculator.kt
    responsibility: Normalize true initial bearing minus east-positive WMM2025 declination plus persisted user correction into clockwise magnetic azimuth and return undefined for coincident points.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/WorldMagneticModel2025.java
    responsibility: Calculate offline magnetic declination from the official WMM2025 coefficients for the 2025-2030 model interval.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutAudioCue.kt
    responsibility: Full-scale limited low-pitched non-overlapping damped wooden-tap PCM cues with 3x digital gain and a distinct double-tap in-tolerance pattern.
  - path: app/src/main/res/menu/add_layer.xml
    responsibility: Add-layer popup; Load project is first, Add NGW layer by URL stays hidden with its handler intact.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
    responsibility: Branch-specific Lisa Mobile manifest, trusted versioned URL, integrity, identity, Android 9-10 archive-certificate fallback without weakening SHA-256 matching, and process-death-safe continuation after Android install permission.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncAdapter.java
    responsibility: Run backup-gated project integrity repair before each account, durably journal unfinished passes, defer heavy MapLibre reload until account completion, and surface the base NGW result or a plain user-visible repair/server failure without duplicating layer retry state.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncService.java
    responsibility: Keep system account sync in a low-priority dataSync foreground service from adapter start through finish/cancel.
  - path: app/src/main/java/com/nextgis/mobile/util/SyncRecoveryJournal.java
    responsibility: Atomically persist pending_v2 project/account pairs before dispatch; acknowledge each only after its children finish and recover its registered owner across active-project changes.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/MapEditingToolsTest.java
    responsibility: Native editable selection, rail bounds, tool gesture regression and the complete layer-category-sketch-form-SQLite creation path, including successful Save returning to the map and clearing drafts.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/FeaturePersistenceTest.java
    responsibility: Native SQLite rollback and unique backup checks.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/FormSaveRecoveryTest.java
    responsibility: Real form failed-photo save and retry without duplicate feature.
  - path: app/src/androidTest/java/com/nextgis/mobile/reliability/TrackerStopRecoveryTest.java
    responsibility: Real service failed Stop preserves and later drains the unwritten tail.
public_contracts:
