  INV-CRASH-DRAFT-RECOVERY:
    title: Crash-safe track resume and geometry/form drafts
    owners: [app, maplibui, maplib]
    statement: >
      Track recording uses durable preference track_recording_enabled, cleared only by the
      explicit menu finish action. After reboot or process death, recording auto-resumes
      without a dialog; already inserted trackpoints must not be lost (closing an unfinished
      track and starting a new id is allowed). TrackerService shares the default application
      process with the toolbar so lifecycle delivery and durable preference reads are ordered;
      stale delayed Start delivery after explicit Stop creates no empty session. Walk digitizing
      keeps its full-geometry owner on unexpected service death and exposes recovery in its
      panel; a restarted service pauses insertion. Finish preserves the draft until successful
      feature Save or explicit Discard. An active point owner locks every walk command and
      survives camera, failed Save and process recreation; GNSS persistence remains independent. Non-walk vertex/tap
      editing synchronously journals its latest WKT plus active-map/layer/feature identity in
      GeometryEditDraftStore and offers Continue/Discard after process/task death; only
      explicit Cancel, successful layer update, or handoff to the attribute form clears it.
      Polygon drafts must restore as explicitly closed MapLibre rings before vertex extraction,
      including new one-part MultiPolygon sketches, so the fill and vertices remain consistent.
      A cold walk preview restores its own source after style load, preserving root CRS before
      conversion to WGS84. The point editor uses separate edit sources and its own journal.
      Starting walk transfers one sketch to its service owner, but does not discard an unrelated
      point draft. Owned forms persist the handoff before Activity launch; their UUID controls
      which point lock or finished walk may be cleared after successful Save.
      Finish publishes manual vertices only after the service acknowledges its final snapshot.

      The shared edit FillLayer is exclusive to Polygon/MultiPolygon and must be removed for a
      cold-restored LineString/MultiLineString even when the preceding edit was polygonal.
      Polygon WKT parsing preserves one outer ring and only actual holes; recovery must not
      duplicate the outer ring as a fill-cancelling inner ring or duplicate its vertices.
      Attribute forms persist a typed FeatureFormDraftStore snapshot (fields, geometry,
      pending photos) until Save or Discard, recovered via Continue/Discard at app start.
      Activity.onPause after successful Save must not recreate the cleared form draft. A
      successful cold-restored form result must carry layer/new-feature identity and must not
      depend on a retained MapFragment.mSelectedLayer or temporary MapLibre edit session. If
      the inserted row is absent from the process-local GeoJSON source, Save must reload layer
      data from SQLite and make the object visible without an application restart.
    related_code:
