  INV-SQLITE-PHASE-DIAGNOSTICS:
    title: Bounded local SQLite phases preserve rendering and distinguish return from content ready
    owners: [maplib, app]
    statement: >
      Fixed enum timings/counts observe the existing bridge IO queue, layer lock, gate,
      cache, RTree, attributes/BLOB/full decode, style/clip/labels, PBF and Main dispatch
      without extra DB, geometry, memory or native SDK reads. Preserve original geometry,
      attributes, gates, free-only admission, cache keys and current/cancellation guards.
      At most16 scopes and32 layer summaries share one observer and bounded writer;
      local LISA-SqlitePhase logs are throttled10s per layer, final suppressed outcomes
      flush later and observation loss is explicit. Clock/writer/watch failures do not
      change caller outcomes or leak closed scopes; unavailable timing is not zero.
      Only numeric layer/source/content IDs, zoom and allowlisted phases/counts may
      appear, with no URI, tile X/Y, coordinates, business fields or exception messages.
      provider_returned, returned_to_sdk, cancelled and failed are separate; Java return
      never establishes native content ready or a performance/Full/2GiB acceptance.
