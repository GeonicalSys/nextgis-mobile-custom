schema_version: 1
tests:
  AUTO-DOCS-VALIDATE:
    type: automatic
    scope: docs
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\docs-check.ps1
    expected: All documentation and registry checks pass.
  AUTO-MAPLIB-UNIT:
    type: automatic
    scope: maplib
    command: .\gradlew.bat :maplib:testDebugUnitTest
    expected: Maplib unit tests pass.
  AUTO-MAPLIBUI-ASSEMBLE:
    type: automatic
    scope: maplibui
    command: .\gradlew.bat :maplibui:assembleDebug
    expected: Maplibui debug library assembles.
  AUTO-MAPLIBUI-UNIT:
    type: automatic
    scope: maplibui
    command: .\gradlew.bat :maplibui:testDebugUnitTest
    expected: Maplibui unit tests pass.
  AUTO-APP-DEBUG:
    type: automatic
    scope: [app, maplib]
    command: .\gradlew.bat :app:assembleLisaDebug
    expected: Lisa Debug APK assembles with the consuming debug maplib variant.
  AUTO-APP-RELEASES:
    type: automatic
    scope: app
    command: .\gradlew.bat :app:assembleLisaRelease :app:assembleBelkaRelease
    expected: Both product release variants assemble.
  AUTO-APP-VERSION-MATRIX:
    type: automatic
    scope: [app, maplib]
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\verify-apk-version-matrix.ps1
    expected: Lisa Debug, Lisa Release and Belka Release assemble; Lisa Release resolves MapLibre android-sdk-opengl 13.0.2 without generic/Vulkan artifact; aapt reports the exact expected package and version for each APK; maplib diagnostic versions match their consuming variants.
  SMOKE-MAP-COLD-START:
    type: device
    scope: [app, maplib]
    steps: [Open an existing multi-layer map from a cold process start, Compare visible layers and order with the saved layer list]
    expected: Map renders once with the saved visibility and order and without a crash.
  SMOKE-MAP-OPENGL-COMPATIBILITY:
    type: device
    scope: [app, maplibui, maplib]
    steps:
      - Install Lisa Release on an Android 9 device without a compatible Vulkan implementation
      - Complete Web GIS authorization and wait for the map screen to render
      - Force-stop the application and cold-open the same map again
    expected: The map renders after authorization and after a cold restart through OpenGL without No Vulkan compatible GPU found or process termination.
  SMOKE-MAP-SURFACE-LIFECYCLE:
    type: device
    scope: [app, maplib]
    steps:
      - Open a populated map and wait until MapLibre renders it
      - Open and close layer properties and project settings at least five times
      - Send the application to background and return, then lock and unlock the screen
      - Recreate MainActivity by switching a Collector project or changing configuration
      - Load or switch to a large Collector project without touching the map and wait for project styling to finish
      - On Android 9 leave the styled map untouched for at least ten minutes, then repeat background and screen-lock cycles and inspect renderer-mode logs
      - During Activity recreation touch the old map surface and verify late events are ignored
      - Inspect HyperLog lifecycle, first-frame-after-resume and render-recovery entries
    expected: The map becomes visible after project styling without requiring a pan gesture and remains rendered and interactive after every return while Android controls stay responsive and are never covered by a full-window black surface; every API logs SurfaceViewMapRenderer, Android 8-9 log tilePrefetch=false without a 5/30 FPS cap or idle CONTINUOUS mode, remains responsive after low-memory pressure, each created MapView has balanced start/stop and one destroy, late touches do not query a destroyed map, and bounded render recovery never reports completion while fully=false or loadingForeground=true and clears only a stale loading foreground without restarting the process. Every API restores the previous rendering mode after the burst.
  SMOKE-LOCATION-CURSOR-TOP:
    type: device
    scope: [app, maplib]
    steps: [Open a map containing overlapping saved and active tracks plus vector layers, Move the current location onto the overlap, Perform a lite reload or hot layer update]
    expected: The standing and moving location cursor remains fully visible above tracks and every other MapLibre object before and after reload.
  SMOKE-MAP-CAMERA-CONTROLS:
    type: device
    scope: app
    steps:
      - Cold-open a project and verify two-finger rotation does nothing until the toolbar rotation button is pressed
      - Enable rotation, place two fingers simultaneously and twist immediately without a hold; repeat while pinching and with sequential finger placement
      - Enable rotation, rotate to several bearings, recreate the activity and verify the enabled state and bearing are restored
      - Disable rotation and verify the camera returns north-up and rotation gestures stop working
      - At zooms below and above 12 press location with a current fix, then repeat with location unavailable and a project layer having a finite extent
      - Repeat the no-location case in an empty project and while stakeout lacks a device compass
    expected: >
      Rotation is explicit, immediate for simultaneous two-finger contact, compatible with
      concurrent pinch zoom and persistent; tilt remains disabled, location resets north and never
      zooms out while enforcing zoom 12, missing location centers on the first valid layer at zoom
      12 regardless of extent size, an empty project reports no location, and the stakeout
      arrow fallback stays screen-correct at non-zero map bearings while the numeric magnetic
      azimuth remains unchanged.
  SMOKE-NGRC-ORDER:
    type: device
    scope: [maplib, maplibui]
    steps: [Open a map with OSM and user layers, Import an NGRc/local raster, Inspect list and map order]
    expected: Raster is above OSM when OSM exists and is not above the entire user stack.
  SMOKE-NGRC-PRESERVE:
    type: device
    scope: [maplib, maplibui]
    steps: [Import a large NGRc into a Collector workspace, Run project composition and data sync, Restart the application]
    expected: Unpacked tiles remain, config records immutable_local provenance and SHA-256, and the underlay still renders.
  SMOKE-UPDATE-DATA-PRESERVE:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Record project database, form and NGRc files, Install a newer same-signature APK with adb install -r, Reopen and sync the project]
    expected: Project workspaces, SQLite data, forms and unpacked NGRc tiles remain in place without manual reimport.
  SMOKE-DEBUG-UNDERLAY-MIGRATION:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Prepare a signed 3.0.3.2 or 3.0.3.3 Debug installation with no project registry and at least two large unpacked local underlays in different TMS/OSM schemes
      - Record the source underlay names, visibility, relative order, tile count and total source size
      - Update Debug in place with the same debug signing certificate and verify its legacy default map opens without a recursive project copy
      - Install the signed Geonical release, manually import and select the intended current Web GIS or local project
      - Open Project settings, start Transfer underlays from Debug and approve the request in Debug
      - Interrupt one transfer, repeat it, then complete all underlays and cold-open the Geonical project
      - Run project composition/data sync and verify Debug still retains its original workspace
    expected: >
      Only local raster underlays enter the selected Geonical project; project/account/vector/track
      data do not cross. Extracted tiles stream directly into one raster MBTiles file per underlay
      without a second extracted tree or per-tile fsync, TMS/OSM rows render in the same locations,
      names/visibility/relative order are preserved above OSM, an interrupted partial database is
      ignored and removed, a retry creates no duplicate completed layer, sync retains the imported
      underlays, and the complete Debug source remains available for rollback.
  SMOKE-HOT-RASTER:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Hot-add a raster to an open map, Do not restart the application, Compare map style with the layer list]
    expected: The raster appears at the intended position without restart.
  SMOKE-LAYER-REORDER:
    type: device
    scope: [maplib, maplibui]
    steps: [Reorder mixed vector and raster layers, Finish the gesture, Compare list and map]
    expected: Map and list converge to the same bottom-to-top order.
  SMOKE-COLLECTOR-IMPORT:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Prepare a Collector project with at least 13 layers including a read-only simple Point layer whose initial visible is false, an editable field vector whose initial visible is false, a MultiPolygon feature with a real hole and a second polygon member, editable enabled only for field vectors, and supported qgis_vector_style and qgis_raster_style items between vectors
      - Add one server layer containing 15 MultiPolygon features and about 140000 positions, with one feature near 60000 positions and hundreds of polygon members
      - Reset all settings and import the Collector resource while interacting with the progress UI
      - Verify every layer has a distinct local storage path and the large layer has exactly 15 local features
      - Verify the ordinary MultiPolygon retains both members and exactly one hole
      - Enable the read-only Point layer only in the local layer drawer without changing server config or running sync
      - Verify Point features render immediately while identify returns the same objects
      - Verify style tiles load with the project account and mixed order matches Collector
      - Verify My Tracks is the first and OpenStreetMap Standard aka Mapnik is the last layer-list row
      - Start object creation and inspect offered layers, then select the hidden editable vector and add an object
      - Reopen and run composition sync, then repeat import with two different layers sharing a display name
    expected: >
      Project metadata and isolated workspace are created; concurrent fills use distinct storage and
      fail without retaining incomplete layers. The 15-feature large geometry layer finishes while
      the application stays responsive and progress never presents polygon members or positions as
      thousands of features. The ordinary MultiPolygon keeps both polygon members and its real hole.
      Enabling a layer omitted from the initial live style rebuilds its source/layer from local data
      without server config update, sync or app restart. Layers are keyed by remote id, supported
      styles appear as authenticated read-only raster layers in the same order as vectors, My Tracks
      stays on top, default OSM stays at internal index zero without visibility reset, and only
      Collector vectors with editable plus outbound sync are offered for object creation regardless
      of visibility; selecting a hidden eligible vector makes it visibly persist before editing.
  SMOKE-LAYER-SYNC-SETTINGS:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Choose a Collector-managed vector whose project item is editable, generic mobile is_editable is false and synchronization direction is both
      - Open layer properties, visit Synchronization, Fields and General, then leave without changing anything
      - Reopen properties and verify the direction is still both and the layer remains available for creating or editing objects
      - Select server-to-device only, close and reopen properties, then return the same layer to both directions
    expected: A no-op settings visit never mutates the stored direction; the Collector owning policy keeps the direction control available independently of generic is_editable, and an accidentally server-only layer becomes editable again after selecting both without deleting or reimporting it.
  SMOKE-COLLECTOR-RESUME:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Start a multi-layer Collector import and kill the application process during one layer fill
      - Before reopening the target project, activate another project and inspect both layers.db files
      - Reopen the application in the other project and wait beyond the normal repair delay
      - Return to the original project and wait for repair
      - Inspect referenced layer directories, marked partial directories, unmarked legacy layer directories and a large referenced MBTiles layer
    expected: >
      The durable journal waits while another project is active and creates no tables or rows in its
      layers.db. After returning to the matching project, existing complete layers and referenced
      directories are retained, only missing or broken layers are queued again, marked unreferenced
      stages and their tables are removed, and every unmarked legacy directory plus the referenced
      MBTiles layer remains untouched.
  SMOKE-COLLECTOR-INCOMPLETE:
    type: device
    scope: [maplib, maplibui]
    steps: [Fail one referenced-resource request while opening a Collector resource, Attempt import]
    expected: Import is rejected before a new workspace is prepared and no partial project is reported as successful.
  SMOKE-COLLECTOR-IDENTITY:
    type: device
    scope: [maplib, maplibui]
    steps:
      - Import a Collector project and record each layer account, remote id and managed origin
      - Corrupt or remove one vector R-tree file, then cold-open the project and run sync
      - Return 404 for one managed layer while it is still referenced by the project snapshot
      - Remove layer_origin and that layer's ngw_identity_backup from one otherwise valid legacy-style config, then reopen and sync
      - Create a second physical layer with the same account and remote id, then run composition sync
    expected: >
      Cache repair preserves NGW identity; a managed 404 does not convert the layer to local;
      one unowned physical match is adopted without redownload; an ambiguous duplicate identity
      records local_identity_conflict, blocks composition apply and never creates another layer.
  SMOKE-FORM-ROLLBACK:
    type: device
    scope: [maplib, maplibui]
    steps: [Open a working Collector form, Interrupt or corrupt a form update between staged file replacements, Reopen the form]
    expected: Hash mismatch is rejected and recovery yields the complete old or complete new form/meta pair, never a mixed pair.
  SMOKE-COLLECTOR-SWITCH:
    type: device
    scope: [app, maplibui]
    steps: [Prepare project A with saved tracks and project B without tracks, Verify the picker rows contain only project names, Open the track list in A, Switch A to B to A without killing the process, Open the track list and inspect the map after each switch, Start manual sync and try switching immediately and between sequential accounts, Verify that switching is refused while a track is actively recording]
    expected: Map paths, metadata, layers and track history always come from the active project; A restores its tracks, B remains empty, the picker exposes no account/id/district text, and neither sync nor active recording can cross the project boundary.
  SMOKE-PROJECT-MANAGEMENT:
    type: device
    scope: [app, maplibui]
    steps: [Reset application data and launch once, verify Local project is already active and add one local feature, import and switch to a Web GIS project then return to Local project, upgrade an installation that has a legacy default map with one local layer and verify it appears once as Local project while the previously active valid project stays active, Open Settings then Project and verify Web GIS name/account/id/district, Create an empty local project, add one local feature, rename the project, switch away and back, start synchronization and attempt to import another Collector project, delete the local project, delete a Web GIS project with one unsynchronized NGW layer, simulate a backup failure, then delete the last remaining project]
    expected: A clean install opens inside a registered Local project and legacy standalone data is copied once without deleting its source; local projects contain their own OSM/tracks/data; aliases persist and stay unique; import during synchronization shows a readable modal request to wait and creates no project entry; successful delete reports success, removes only the device workspace and never Web GIS/account data; unsynchronized NGW data is backed up and backup failure cancels deletion; deleting the last project opens a new empty local fallback.
  SMOKE-SCHEMA-REBUILD-GUARD:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Use a heavy NGW layer with a deliberately unchanged broken schema/config, Run sync and interrupt or fail the staged fill, Verify the old layer remains usable, repeat after the cooldown until two attempts are recorded, run sync a third time, inspect Project settings, reset the protection, fix the server config and sync again]
    expected: Failed fill never removes the old layer; an unchanged fingerprint runs at most twice per 24 hours and the third attempt is suppressed; Project settings reports the stopped layer and reset permits a new attempt; a changed/fixed fingerprint can rebuild successfully.
  SMOKE-BACKUP-GATE:
    type: device
    scope: [maplibui, maplib]
    steps:
      - Prepare unsent local layer data, trigger schema rebuild or Collector removal, simulate backup failure
      - Sync twice a layer whose server features have attachments but whose bytes were never downloaded to the device
      - Manually delete an editable layer that has server-only attachment metadata plus one attachment collected on this device
    expected: >
      Destructive mutation is cancelled and local layer data remains. Attachment metadata is
      available through FeatureAttachments after the first pull; the second pull creates no
      sync_remote_apply ZIP and does not download attachment bytes merely for backup. Manual layer
      deletion creates its backup without network access: tables retain all attachment metadata, the
      ZIP contains only the locally collected attachment bytes, and deletion completes without a crash.
  SMOKE-CRASH-DRAFT-RECOVERY:
    type: device
    scope: [app, maplibui, maplib]
    steps:
      - Start track recording, Force Stop or reboot, reopen app
      - Start walk digitizing a line, swipe the app away while editing geometry, reopen it even if Android has already restarted WalkEditService
      - On a cold start press walk Continue immediately, before map layers or edit sources finish loading
      - Draw a polygon manually, append it by walk from a middle node, swipe the app away, choose Continue, receive more GPS fixes, then Stop the walk
      - After restoring the walk, verify no second manual-geometry recovery prompt is offered for the same sketch
      - Repeat cold walk recovery with LineString and MultiLineString after a polygon recovery
      - Create a line with the normal vertex editor, move/add vertices, swipe the app away before saving geometry, reopen and choose Continue
      - Repeat with a partly drawn Polygon and MultiPolygon, choose Continue, then move several different restored nodes
      - Repeat normal line editing for an existing feature, choose Discard after reopening
      - Fill attribute form with fields/photos, Force Stop, reopen app
      - After recovering geometry for a new line, open its attribute form, swipe the app away, recover the form, press Save
      - For walk/manual geometry/form choose Continue then Discard on a second run
      - Add a point with unchanged default attributes, press Save, return to the map, then restart the app
    expected: >
      Track recording auto-resumes without a dialog and previous trackpoints remain;
      finish is only via Stop track menu. Walk draft offers Continue/Discard and Continue
      never crashes when selected before MapLibre edit sources exist; renderer attachment is
      deferred and then restores vertices and GPS writing even when its sticky service was already
      restarted. Walk and point geometry have different durable owners; a transferred sketch is offered once;
      a recovered polygon keeps one stable fill and red outline through later GPS updates,
      and Stop immediately republishes all editable vertices and midpoints;
      recovered line types show only an open red line without polygon fill and retain that
      geometry after Stop and Save;
      Cancel/Save does not re-offer. Normal vertex/tap editing offers its own
      Continue/Discard dialog; Continue restores the latest visible geometry in the same map,
      layer and feature while Discard clears it. Restored polygon fill and nodes agree before
      and after moving any restored node, with one outer fill and no invented duplicate hole.
      Form Continue restores fields/photos and
      Save persists and returns to the correct layer without depending on the pre-crash map
      selection or crashing; the newly inserted geometry appears on the map without an app
      restart, and Discard clears the draft. Saving a new point with unchanged
      defaults never creates or re-offers an attribute-form draft.
  SMOKE-SYNC-OFF-CONFIG:
    type: device
    scope: [maplib, maplibui]
    steps: [Set an NGW layer to SYNC_NONE, Change supported server configuration, Run the relevant refresh flow]
    expected: Feature data is not synced while supported configuration behavior remains correct.
  SMOKE-MULTI-ACCOUNT-SYNC:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Prepare two stored projects and an active map whose Collector account is not first in Android account order, make another account used by the active map unavailable, add a detectable server change only to the inactive project, run manual sync twice rapidly, leave and return to the layer drawer while sync finishes, verify the sync icon stops, restart and inspect enabled account schedules]
    expected: Only accounts with NGW layers in the active map run, its Collector account runs first, the inactive project change is not pulled, another active-map account error has a separate result, the second full sync is refused, the spinner stops even if the final broadcast was missed, and enabled schedules are restored without duplicate work.
  SMOKE-NGW-LARGE-PULL-CACHE:
    type: device
    scope: [app, maplib]
    steps:
      - Prepare an open NGW vector layer where one pull creates and deletes at least 1000 features while the map is visible; include one server feature with missing or invalid geometry and an existing local copy of that remote ID
      - Start manual sync once and interact with the map while that layer is applied
      - Reopen the project, run a no-change sync and export HyperLog
    expected: >
      The process remains alive and responsive; incremental pull emits no per-row vector cache
      notification storm, performs one final spatial cache rebuild and one layer reload; the invalid
      server geometry is skipped, its previous local row is retained, and the rest of the layer commits; no
      notify_insert/GeoEnvelope/GeometryRTree crash, LinkedTreeMap style exception or spatial cache
      count mismatch appears on reopen, and the no-change sync leaves cache and SQLite counts equal.
  SMOKE-NGW-ACCOUNT-ADD:
    type: device
    scope: [app, maplibui]
    steps: [Install a release APK beside official and debug variants, Add a Web GIS with valid credentials, Reopen the Web GIS selector, Inspect Android AccountManager and exported HyperLog]
    expected: The login screen closes only after the variant-specific Android account is created and listed; authenticator, sync adapter and runtime account types match, and a local add failure keeps the form open with an error and diagnostic log.
  SMOKE-NGW-CONNECTION-FAILURE:
    type: device
    scope: [app, maplibui]
    steps:
      - Configure a Web GIS endpoint that returns HTTP 500 for authentication or resource loading
      - Open the NGW resource selector and wait for the request to fail
      - Repeat and close the selector or leave its Activity before the request completes
    expected: >
      While the selector Activity is alive, the user sees a plain connection error and can retry;
      after the Activity is finished or destroyed, the late result creates no dialog. Neither path
      throws BadTokenException or terminates the application.
  SMOKE-WALK-POINT-SESSION:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Start a line or polygon walk with sound disabled; check the live sketch before saving and after full/lite style reload
      - Start point creation; verify every walk control is disabled already in the layer chooser
      - Create point geometry, open its form and camera, background/reopen, then fail a Save and recreate the process
      - During point creation try queued notification Resume, Finish and Discard; simulate a GPS gap
      - Save or explicitly cancel the point; verify the same walk survives and its controls unlock, with explicit reconnection if paused
      - Finish the walk; verify the final acknowledged geometry preserves all members/holes and remains recoverable after a validation or form failure
    expected: >
      Normal map menus and independent walk preview remain available. Point creation owns the
      foreground editor without stopping GNSS. No UI or backend command controls the walk while
      the point token exists; lifecycle and errors retain that token. Successful point Save or
      explicit Cancel unlocks only its own session. Finish does not restart after cold launch.
  SMOKE-WALK:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Enable background recording sound and start geometry-by-walk editing
      - Minimize notification volume while alarm volume remains audible, then mute alarm volume
      - Minimize the app, stand still for at least 35 seconds, then walk until several geometry points are saved
      - Disable every location provider or block background location delivery and wait at least 20 seconds
      - Revoke location permission in Android settings while walk recording is active, then return to the app
      - Restore location permission and continue the retained walk draft
      - Pause and resume the app, then finish geometry
      - Disable background recording sound and repeat the minimized recording segment
    expected: >
      Geometry and editing state survive lifecycle transitions without duplicate reload.
      While minimized, fresh usable callbacks produce a short confirmation every 10 seconds
      even while stationary and independently of saved vertices. Notification volume does not
      suppress the alarm-stream tone; muted alarm volume produces short vibration instead.
      The heartbeat stops after
      callbacks become stale; foreground and disabled-setting recording stay silent.
      Permission revocation causes no crash or forbidden location-FGS restart and the walk draft
      remains available after permission is restored.
  SMOKE-GPS-RECORDING:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - Start a track on the visible map, turn the screen off, move, then reopen where GNSS is unavailable
      - Verify current Network position and its metric accuracy circle; block all sources and wait over eight seconds
      - Grant approximate location only; verify map fallback and that track/walk cannot record Network
      - With sound disabled on Galaxy A54, record 10 minutes screen on and 10 minutes screen off; reopen repeatedly and compare GPS health raw cadence, accuracy, age, requests/stops and wake lock
      - Stand for 20 minutes indoors with 20-30 metre accuracy, then outdoors with about 5 metre accuracy; inspect saved distance and gradual correlated drift
      - Keep recording on a table, then hold and move the phone while remaining in place; verify handset handling does not start a false path
      - Repeat walking starts at 3-5 and 8-12 metre accuracy; verify the current cursor follows before the line confirms and the circle does not inflate with distance from the initial anchor
      - Start walking with an early turn inside the uncertainty radius; wait for confirmation and verify the first metres and corner appear with original timestamps
      - Cancel a tentative departure or lose GPS before confirmation; verify the buffer is not appended and another recording session cannot inherit it
      - Export one track and multiple tracks to a local file receiver; check .gpx filename and application/gpx+xml URI MIME including anonymous lookup
      - Explicitly stop a track and verify end time is saved, closedTracks is one, and that track does not auto-resume
      - Start at an uncertain fix, improve reception without moving and verify the stop vertex is corrected without an extra segment
      - Start slow walking from that stop, then repeat starting and stopping a car with the phone fixed in its mount
      - Walk slowly, stop, start again, turn and reverse; repeat on a road at legal vehicle speeds
      - Lose GNSS and regain it; reload the track and export GPX
      - Repeat with walk digitizing; verify pause, save, and explicit Continue and connect with fresh GPS
      - Select sparse point intervals and verify corner retention and validated final points
      - Record with screen off and both track and walk active; stop one and verify the other still receives GNSS
      - Revoke and restore fine permission, restart the process, and verify durable track intent and walk draft
      - Check the circle at several latitudes, zooms and camera tilts, after cold style load and hot layer add
      - Enable background sound, stand still, mute notification volume and then alarm volume, and lose GNSS
      - Compare battery use and run stakeout with the original external GNSS/mock receiver
    expected: >
      The map shows only a current source with an honest accuracy radius and clears both marker
      and circle on expiry. No network fix, camera anchor, cached final snap or unrecorded preview
      enters geometry. Walking and legal vehicle movement retain turns without stationary drift
      or isolated large jumps. GPS gaps remain separate map/Canvas/GPX segments; walk pause and
      insertion position survive restart and require explicit reconnection. Sound uses fresh
      measurement timestamps before decimation and keeps existing alarm/vibration behavior.
      Screen lifecycle and ending one recording consumer do not stop another consumer.
      Sound-disabled background recording retains its acquisition and wake lock. UI resume
      displays the actual current accuracy without a subscription-induced restart; real
      reception deterioration remains visible. Check battery drain during the screen-off run.
  SMOKE-STAKEOUT:
    type: device
    scope: [app, maplib]
    steps:
      - Connect the production geodetic receiver path and verify it publishes corrected WGS84 GPS fixes for the pole tip
      - Configure stakeout thresholds 5, 1, 0.5 and 0.1 metres and enable sound
      - Select editable and read-only Point, LineString, Polygon and their Multi variants, then start Слежение
      - Approach a point, a line segment interior, a polygon exterior boundary and an interior ring from both sides
      - For a polygon, repeat while starting inside its area
      - Cross every threshold repeatedly and hold at 0.1 m with both good accuracy and a constant coarse value such as 10 m
      - Stand still and rotate the device, then walk along a known bearing while turning the device independently
      - Compare the displayed magnetic azimuth with a control bearing plus known local WMM2025 declination, including wrap around 0/360 degrees
      - Repeat on a device/emulator without a rotation-vector sensor and compare the arrow with a known north-up and explicitly rotated map bearing
      - Open the azimuth button, select current location to map point, drag and replace the target, and verify the fixed GPS endpoint, temporary segment and result update after release
      - Select point A to point B, choose two arbitrary points, drag A and B independently, verify every released position recalculates the result, then test coincident points and tap a third point to begin a new measurement
      - On a narrow portrait screen verify the numeric magnetic-azimuth value remains visible below its label instead of being clipped
        - Mute and unmute the widget, rotate portrait/landscape, lock the screen and press Home for several minutes, then resume and stop the mode
      - Repeat with GPS loss/stale fixes, a network fallback, a mock-GPS receiver application, Bluetooth active and a non-normal Android audio mode
        - Export the debug log and verify it does not contain stakeout coordinates or extended mock Location samples
      - Open map settings after upgrading an existing install, verify both photo-coordinate options are initially enabled, disable them, restart and verify the explicit choice persists
      - Run a 4–8 hour field session and assess sound fatigue, battery use and CPU temperature
    expected: >
      The widget contains direction, WGS84 distance, numeric WMM2025 magnetic azimuth,
      reported horizontal accuracy, declination, mute and stop for live guidance;
      it never duplicates object name or coordinate source. Point uses its coordinate, line uses the nearest
      segment point and polygon uses the nearest outer/inner boundary even from inside. Sound
      cadence changes at configured distances without overlapping, chattering or using network
      fixes for precision guidance. Coarse or placeholder accuracy remains visible but does not
      silence GPS/mock distance bands. The final cue occurs once only after two fresh precision fixes
        whose distance is within tolerance. Stale/lost GPS silences audio; screen-off and background
        state keep cues and high-frequency GPS active under an ongoing silent notification. Foreground
        resume restores the widget, and explicit stop removes the notification and restores ordinary
        location sampling. Device rotation follows the filtered magnetic phone compass
      both stationary and moving; without it true bearing minus map bearing is used. The current-to-point
      mode updates a non-persistent segment, lets only the target be dragged and retains live GPS/audio behavior. Point A to B uses the same
      geodesic and magnetic-bearing calculation without GPS/audio, returns undefined azimuth for coincident
      points, lets either endpoint be corrected by dragging and starts a new A after the completed pair.
      The numeric magnetic azimuth is visible on narrow screens. Mock GPS from the
      receiver remains accepted, navigation cues remain audible with Bluetooth/audio-mode changes,
        use a loud short damped tap rather than a high sustained tone, and system volume can reduce it.
        The migrated photo defaults do not overwrite later explicit user choices. Debug logs do not
