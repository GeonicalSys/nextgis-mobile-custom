  SMOKE-LOCATION-CURSOR-TOP:
    type: device
    scope: [app, maplib]
    steps:
      - On an isolated Debug API 36 emulator with working EGL (-gpu host), grant the Debug package GPS, GET_ACCOUNTS and notification permissions before explicitly running com.nextgis.mobile.rendering.LocationOrbitTest; the SwiftShader reliability CI package does not run this graphics smoke
      - Open a map containing overlapping saved and active tracks plus vector layers; repeat on a light street map, dense thematic polygons and a textured aerial or forest basemap
