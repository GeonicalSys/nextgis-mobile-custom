schema_version: 1
hotspots:
  GPS-PIPELINE:
    repositories: [root, maplib, maplibui]
    paths:
      - maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/TrackerService.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/WalkEditService.java
    default_decision: ours
    reason: Preserve shared acquisition, current display expiry, GNSS-only filtered recording and persistent gaps; official HEAD still keeps independent recorder subscriptions and an unbounded location cache.
    invariants: [INV-GPS-TRACK-FILTER, INV-LOCATION-CURSOR-TOP]
    verify: [AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-UNIT, AUTO-APP-RELEASES, SMOKE-GPS-RECORDING, SMOKE-WALK]
  MAP-DRAWABLE:
    repositories: [maplib]
    paths: [maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java]
    default_decision: hybrid
    reason: Upstream MapLibre API changes must preserve fork layer order, hot-add, track policy and destroyed-view touch safety.
    invariants: [INV-LAYER-ORDER, INV-HOT-ADD-CONSISTENCY, INV-NO-TRACK-FLAGS, INV-MAPLIBRE-VIEW-LIFECYCLE]
    verify: [SMOKE-MAP-COLD-START, SMOKE-HOT-RASTER, SMOKE-TRACK-NO-FLAGS, SMOKE-MAP-SURFACE-LIFECYCLE]
  RASTER-ANCHOR:
    repositories: [maplib]
    paths: [maplib/src/main/java/com/nextgis/maplib/map/MPLFeaturesUtils.java]
    default_decision: hybrid
    reason: Preserve sibling-anchor behavior while accepting compatible MapLibre fixes.
    invariants: [INV-LAYER-ORDER]
    verify: [SMOKE-NGRC-ORDER]
  LAYER-FILL:
    repositories: [maplib, maplibui]
    paths:
      - maplib/src/main/java/com/nextgis/maplib/map/MapContentProviderHelper.java
      - maplib/src/main/java/com/nextgis/maplib/map/NGWVectorLayer.java
      - maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
      - maplib/src/main/java/com/nextgis/maplib/util/DatabaseContext.java
      - maplib/src/main/java/com/nextgis/maplib/util/NgwFeatureGeometryValidator.java
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/LayerFillService.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/LayerFillStaging.java
    default_decision: hybrid
    reason: Upstream fill fixes must preserve Collector batches, owning-workspace SQLite routing, bounded-cost server polygon validation, crash-stage cleanup and fork insertion order.
    invariants: [INV-LAYER-ORDER, INV-COLLECTOR-ISOLATION, INV-COLLECTOR-RESUMABLE]
    verify: [AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-UNIT, SMOKE-NGRC-ORDER, SMOKE-COLLECTOR-IMPORT, SMOKE-COLLECTOR-RESUME]
  MAP-HOST:
    repositories: [root, maplib]
    paths:
      - maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    default_decision: hybrid
    reason: Accept interface evolution and implement it in app without discarding fork deferred reload.
    invariants: [INV-HOT-ADD-CONSISTENCY, INV-MAPLIBRE-VIEW-LIFECYCLE]
    verify: [AUTO-APP-RELEASES, SMOKE-HOT-RASTER, SMOKE-MAP-SURFACE-LIFECYCLE]
  MAPLIBRE-BACKEND:
    repositories: [root, maplib, maplibui]
    paths: [app/build.gradle, maplib/build.gradle, maplibui/build.gradle]
    default_decision: ours
    reason: Preserve the explicit OpenGL artifact when upstream uses MapLibre 13 generic android-sdk with Vulkan by default; supported Android 9 devices may not provide compatible Vulkan.
    invariants: [INV-MAPLIBRE-BACKEND-COMPATIBILITY]
    verify: [AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-ASSEMBLE, AUTO-APP-VERSION-MATRIX, SMOKE-MAP-OPENGL-COMPATIBILITY]
  GEOMETRY-EDIT-HISTORY:
    repositories: [maplibui]
    paths:
      - maplibui/src/main/java/com/nextgis/maplibui/overlay/UndoRedoOverlay.java
    default_decision: ours
    reason: Preserve one-step-per-real-edit Undo/Redo and the 100-change field history when accepting upstream overlay changes.
    invariants: [INV-GEOMETRY-SKETCH-WORKFLOW]
    verify: [AUTO-MAPLIBUI-UNIT, SMOKE-GEOMETRY-SKETCH-WORKFLOW]
  COLLECTOR-RESOURCE:
    repositories: [maplib, maplibui]
    paths:
      - maplib/src/main/java/com/nextgis/maplib/datasource/ngw/Connection.java
      - maplibui/src/main/java/com/nextgis/maplibui/activity/SelectNGWResourceActivity.java
    default_decision: ours
    reason: Collector resource support is an explicit fork requirement even when upstream disables it.
    invariants: [INV-COLLECTOR-RESOURCE]
    verify: [SMOKE-COLLECTOR-IMPORT]
  APP-FLAVORS:
    repositories: [root]
    paths: [app/build.gradle]
    default_decision: ours
    reason: Preserve lisa/belka branding and fork versioning over a single upstream APP_NAME.
    invariants: [INV-FLAVORS, INV-VERSION-COUPLING]
    verify: [SMOKE-LISA-RELEASE, SMOKE-BELKA-RELEASE]
  RASTER-MBTILES:
    repositories: [root, maplib, maplibui]
    paths:
      - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
      - maplib/src/main/java/com/nextgis/maplib/map/TMSLayer.java
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - maplibui/src/main/java/com/nextgis/maplibui/mapui/LayerFactoryUI.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/LayerFillService.java
    default_decision: hybrid
    reason: Accept official 3.2 raster MBTiles while retaining atomic import, OpenGL, fork layer order, project isolation and legacy Debug streaming migration.
    invariants: [INV-LAYER-ORDER, INV-HOT-ADD-CONSISTENCY, INV-LEGACY-UNDERLAY-MIGRATION]
    verify: [AUTO-MAPLIB-UNIT, AUTO-APP-RELEASES, SMOKE-HOT-RASTER, SMOKE-DEBUG-UNDERLAY-MIGRATION]
