  INV-COLLECTOR-RESUMABLE:
    title: Collector import is complete or safely resumable
    owners: [maplib, maplibui]
    statement: >
      Reject incomplete remote snapshots, persist unfinished batches with their project UID, and
      after process death requeue only missing or broken layers once that exact project is active.
      Every unpublished layer directory is app-marked before data access; recovery may delete only
      marked unreferenced stages and their owning-workspace tables, while referenced stages and every
      unmarked legacy directory remain. Server Polygon/MultiPolygon validation must avoid the legacy
      quadratic segment-pair scan so a small feature count with very large geometry is still resumable.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/datasource/ngw/CollectorResource.java
      - maplib/src/main/java/com/nextgis/maplib/util/NgwFeatureGeometryValidator.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/CollectorImportJournal.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/LayerFillStaging.java
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/LayerFillService.java
    verify_smoke: [SMOKE-COLLECTOR-IMPORT, SMOKE-COLLECTOR-RESUME, SMOKE-COLLECTOR-INCOMPLETE]
    must_update_docs:
