    title: Local vector tile work has bounded concurrency and pressure admission
    owners: [maplib, app]
    statement: >
      The loopback local-vector-tile server has at most two concurrent workers and sixteen
      queued sockets; overload receives a retryable HTTP 503 instead of allocating another
      worker. Builds for one layer are serialized because geometry BLOB parsing and clipping
      retain large object graphs. A map generation change closes queued stale sockets, and a
      request is rejected before geometry decoding when Java or current system headroom is
      insufficient. A fair two-permit gate serializes complete builds under resource constraints;
      successful tiles must not omit arbitrary features or simplify source geometry. These checks
      do not enforce a native-memory ceiling, guarantee SDK retry or prove that OOM is impossible.
      Preserve layer order, identify semantics and the classic rendering fallback.
