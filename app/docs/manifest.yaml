  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayImporter.java
    responsibility: Convert legacy extracted TMS/OSM tiles directly into batched, atomically published raster MBTiles; track pipe progress, cancel or inactivity-timeout a blocked descriptor, retry one stalled source, clean partial stages, and release the project lease before later sync.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayTransferPolicy.java
    responsibility: Define the Android-independent inactivity deadline, one-retry bound and transfer-exit confirmation policy for the cross-package underlay stream.
  - path: app/src/test/java/com/nextgis/mobile/util/LegacyUnderlayTransferPolicyTest.java
    responsibility: Lock inactivity, retry, cancel and catalog Back-exit confirmation policy without Android.
  - path: app/src/test/java/com/nextgis/mobile/util/LegacyUnderlayMigrationContractPolicyTest.java
    responsibility: Lock pre-registry Debug workspace deferral and the shared-catalog migration skip without Android.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayMigrationContract.java
    responsibility: Pin Debug/Geonical package and signing-certificate identities, define the bounded-memory framed streaming schema and detect the one legacy Debug workspace that must stay in place without shared-catalog migration until export.
  - path: app/src/main/java/com/nextgis/mobile/util/OfflineSyncIntentService.java
    responsibility: Reserve the active project before manual sync starts, own a cancellable registration for that reservation, run as a dataSync foreground service, delegate all downloaded projects and accounts to the shared scoped queue under one lease, start the session-scoped progress ring, and interrupt pending or active manual work on an explicit user request.
  - path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    responsibility: Map screen, complete MapLibre MapView lifecycle, cancellation of pending SDK gestures before native destruction and renderer-reference cleanup across pause/resume/view recreation, bounded post-style continuous-render/presentation recovery and stale loading-foreground removal without full reload, EGL-recoverable SurfaceView on every API with bounded recovery bursts and no permanent old-API FPS limit, MaplibreMapInteraction implementation, opt-in persistent and immediate concurrent pinch/rotate gestures with north-up/location/layer-extent recovery, foreground compass-first Orbit ring pointer with a transparent opening, 5 dp blue dot with a 2 dp white border and moving-course fallback, retained compass uncertainty calculations and camera-scale refresh with all three sector layers hidden by default and controlled by the saved show_compass_accuracy_sector choice on resume, native NMEA HUD for RTK quality/sats/HDOP, hidden local-vector-tile attribute identification, track-mode popup and Start/Starting/Recording/Error button under the ruler with orange recording person and enlarged red dot, immediate current-camera-centre tap sketch creation with automatic target visibility, confirmed new-sketch cancellation without a duplicate add toolbar action, visible selected-to-successor insertion direction, hectare ruler labels with sketch-equivalent Undo/Redo routed to the active MapLibre measurement geometry and saved-instance restoration, selected-node independent walk insertion, passive preview, confirmed disk Finish followed by session-acknowledged minimum-vertex validation and immediate attributes for new/existing features, confirmed Pause/Resume/Cancel with full point-session control lock, same-zoom start pan to the actual current-location/walk geometry anchor, foreground stakeout host/widget plus transient current-location-to-point and arbitrary-point-to-point magnetic azimuth/distance modes with draggable editable endpoints and a widget that shows effective declination D+C without drag-hint copy, acknowledgement of completed post-fill style/source reload, shared Save/form handoff for new geometry with duplicate-launch protection, terminal successful-save cleanup to normal map mode with no feature selection for both new and existing objects, a single Measurements popup routing directly to ruler/current-location azimuth/free-point azimuth with restored control visibility and legacy ruler-only preference, typed Polygon validation messages, GTMultiPolygon-only topology repair, durable non-walk geometry journal, and deferred current-style-safe geometry restoration and owner-aware recovery of coexisting walk and point drafts with polygon-only fill, stable outline and editable vertices after Stop. GPS callbacks use the durable recording flag and asynchronous map-owned track snapshots, never a synchronous unfinished-track query. The MapLibre logo and SDK info button stay hidden; a single OpenStreetMap credit line appears at the left edge only while the built-in OSM layer is visible and lifts above bottom panels. Offer compatible-layer copying and whole-object transforms through normal category/form, draft, Save/Cancel and Undo contracts.
  - path: app/src/main/java/com/nextgis/mobile/location/DeviceHeadingProvider.kt
    responsibility: Foreground rotation-vector true heading for the Orbit pointer and compass-uncertainty sector, using WMM2025 declination without stakeout correction, plus magnetometer and heading-jitter inputs to HeadingConeAccuracy; actively notify compass expiry after 500 ms without waiting for another GPS/sensor event and clear/cancel on stop.
  - path: app/src/test/java/com/nextgis/mobile/location/DeviceHeadingProviderTest.kt
    responsibility: Exercise compass absence, registration failure, unreliable readings, active expiry, fresh-sample recovery and stop/restart on Android API 26 and 36 without GPS callbacks.
  - path: app/src/androidTest/java/com/nextgis/mobile/rendering/LocationOrbitTest.java
    responsibility: Explicit graphics smoke outside the SwiftShader reliability CI package; check actual MapLibre vector images and central fix anchor, topmost accuracy-sector-white-halo-blue-outline-symbol order after a hot style addition and lite reload, rendered compass/course/plain-dot transitions, default-hidden sector plus persisted opt-in/out after map resume and hot/lite reload while preserving its 56-pixel geometry through native projection at zoom 16/18/19, actual 5 dp blue-centre and white-border and outward thicker blue-rim pixels, transparent bitmap opening and an untinted 14 dp point symbol beneath all service overlays in screenshots and removal when the fix expires on an isolated Debug emulator with a working EGL backend.
  - path: app/src/main/java/com/nextgis/mobile/location/HeadingConeAccuracy.kt
    responsibility: Combine rotation-vector heading accuracy, circular yaw jitter, raw-vs-filtered innovation and magnetometer field penalty, then open the cone faster than it closes.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutController.kt
    responsibility: Active selected-feature or arbitrary-point live-guidance lifecycle, in-place target replacement without releasing foreground resources, independent GPS listener, WMM2025 magnetic-bearing UI state with persisted declination correction, GPS/mock precision-source gate, reported-accuracy UI state, monotonic navigation-audio scheduling, 3 s freshness with a 1 s future-timestamp tolerance, high-frequency GPS lease ownership across screen-off/background state, and full rollback on synchronous or owning asynchronous foreground rejection.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutForegroundService.kt
    responsibility: Explicit location-only foreground notification and partial wake lock without Bluetooth permission, process-local session ownership, failure callback and obsolete-request foreground-contract completion without restoring GPS/audio.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutHeadingProvider.kt
    responsibility: Circularly filtered magnetic rotation-vector heading plus location-cached WMM2025 declination for the live guidance arrow without movement-bearing fallback.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/MagneticAzimuthCalculator.kt
    responsibility: Normalize true initial bearing minus east-positive WMM2025 declination plus persisted user correction into clockwise magnetic azimuth and return undefined for coincident points.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/WorldMagneticModel2025.java
    responsibility: Calculate offline magnetic declination from the official WMM2025 coefficients for the 2025-2030 model interval.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutAudioCue.kt
    responsibility: Full-scale limited low-pitched non-overlapping damped wooden-tap PCM cues with 3x digital gain and a distinct double-tap in-tolerance pattern.
  - path: app/src/main/res/menu/add_layer.xml
    responsibility: Add-layer popup; Load project is first, Add NGW layer by URL stays hidden with its handler intact.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
    responsibility: Branch-specific Lisa Mobile manifest, trusted versioned URL, integrity, identity, Android 9-10 archive-certificate fallback, process-death-safe install continuation, and correlated check/network/HTTP/error/result logs; automatic completion distinguishes a valid result from a retry and does not require Android VALIDATED.
  - path: app/src/main/java/com/nextgis/mobile/util/StartupUpdateCheckScheduler.java
    responsibility: Main-thread foreground-only startup retries with bounded backoff, focus/network/resume wakeups, completion restoration limited to the current process session and no duplicate in-flight requests.
  - path: app/src/test/java/com/nextgis/mobile/util/StartupUpdateCheckSchedulerTest.java
    responsibility: Reproduce offline/request failure, restored process/window, modal focus, busy updater, companion UI, background response, bounded retries, duplicate callbacks and destruction without losing the pending check.
  - path: app/src/test/java/com/nextgis/mobile/util/AppUpdateNetworkStateTest.java
    responsibility: Permit active INTERNET networks without VALIDATED across Wi-Fi, cellular and VPN, retaining the offline gate and diagnostic network flags.
  - path: app/src/test/java/com/nextgis/mobile/util/AppUpdatePendingInstallationTest.java
    responsibility: Cleared malformed, invalid-product, denied-permission or already-installed continuation cannot suppress a new startup check; rejected product state never reaches the installer.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncAdapter.java
    responsibility: Run backup-gated project integrity repair before each account, durably journal unfinished passes, defer heavy MapLibre reload until completion, and surface the base NGW result or a plain failure without duplicating layer retry state; error notifications bypass default-off optional start/finish notices.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncService.java
    responsibility: Keep system account sync in a low-priority dataSync foreground service through finish/cancel and reject late callbacks after destruction.
  - path: app/src/main/java/com/nextgis/mobile/util/SyncRecoveryJournal.java
    responsibility: Atomically persist pending_v2 project/account pairs before dispatch; acknowledge each only after its children finish and recover its registered owner across active-project changes.
