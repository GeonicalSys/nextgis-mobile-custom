  INV-GPS-TRACK-FILTER:
    title: Track and walk recording retain real movement through 160 km/h
    owners: [maplib, maplibui, app]
    statement: >
      GpsEventSource owns one GNSS acquisition stream across screen and service lifecycles. The default-enabled app background owner starts from visible app opening, keeps GPS/Network and the shared wake lock through forms/screen-off/minimization, and releases after two hours outside the app, an explicit setting change, recent-task removal or confirmed double-Back exit without stopping recording/guidance owners. Explicit exit disarms automatic acquisition until the next Activity start.
      Attaching/detaching a map never unregisters active recording GPS or resets its filter. GPS recovery re-registers the same listener only after sustained fresh used-in-fix statuses without callbacks, once per episode and at most once per ten minutes; it never resets recording resources or treats no-fix as a stalled listener.
      The final recorder owns release of the shared partial wake lock unless an
      external NMEA session still needs it; sound off does not
      disable background acquisition. Sensor evidence expires and cannot alone freeze a vehicle.
      Global Battery Saver may still suppress screen-off GPS; check the actual location
      power policy independently of Doze exemption, warn before manual Start and monitor
      the active service notification. Do not mislabel native external GNSS or the
      foreground-only power policy as disabled GPS, and never close a track due to this warning.
      A refined stop replaces only the last owned vertex, retaining track arrival time;
      it never appends distance for an improving stationary position. Handset handling alone
      cannot confirm departure; direction, combined accuracy and trustworthy velocity or a
      longer persistent position trend are required. Accurate outdoor coordinates use short
      median/trend windows that tolerate ordinary speed uncertainty and an early corner. The
      displayed candidate remains current while the recorder holds its stop anchor; its accuracy
      cannot expand merely because the user has moved away from that anchor. Each recorder buffers at most 120 seconds
      or 512 tentative observations; confirmation backfills original times/corners, while Stop
      and gaps discard unconfirmed history. GPX share filename stays .gpx. The share Intent
      may remain application/gpx+xml for chooser filtering. FileProvider getType, including
      anonymous lookup, uses text/xml so MimeTypeMap clients do not append .bin or
      stringify a missing GPX mapping as .null; they may append .xml.
      Current display uses a fresh GPS fix (chip, mock or native NMEA, any accuracy) and falls
      back to Network only when GPS is missing or older than 8 seconds. A previously displayed network estimate remains visible with age and original accuracy between updates; fresh getters and recorders still reject stale measurements. A hidden network estimate older than the last displayed GPS cannot resurrect on GPS loss; a coarse GPS
      fix is never replaced by a more accurate Wi-Fi/cell estimate. A live mock GNSS
      stream displaces the phone chip. GPS Connector's no-extras 47 m placeholder does
      not replace a fresh receiver fix that carries hdop or diffStatus extras.
      An in-app external NMEA session (`gnss_input=external`) does not subscribe to the
      phone GPS provider, Network provider or Mock Location; Bluetooth Classic/LE, USB and TCP/IP streams
      are parsed as GGA/GST/GSA/RMC independently of receiver brand, plus ComNav BESTPOSA
      and CNB BESTPOSB (message 42). Factory ComNav CNB (AA 44 12) is framed with CRC;
      $/# inside binary is not an NMEA start. The session does not send unlogall; optional
      GGA/GST/GSA/RMC logs are one 20-byte command at a time unless ASCII is already flowing.
      Identified ComNav/Pigo BLE pairs service 3A20, write 3A21 and notify 3A22;
      it adds BESTPOSB only to a silent stream, never changing correction inputs
      or selecting unrelated writable GATT characteristics. CCCD/write failure and
      permission revocation do not crash callbacks. Late callbacks cannot affect
      a replacement session; HUD quality expires after eight seconds of silence.
      Native NMEA is not
      dropped as phone-chip while a previous receiver fix is still fresh.
      While an endpoint
      is configured, the session and a connected-device foreground service stay alive
      without map listeners; Home and sleep do not close the transport.
      Recording uses GNSS chip, mock GPS with receiver extras or native NMEA, finite coordinates,
      positive accuracy at most 50 metres and valid monotonic measurement time.
      Mock and native NMEA vertices skip pedestrian smoothing and are sampled no coarser than 2 s / 1 m. Live batches retain chronological
      session measurements without treating receipt time as current location or sound health.
      Robust adaptive smoothing and stationary anchoring precede the sequence validator;
      movement through 160 km/h remains supported by the shared source and mixed track mode.
      Track-only pedestrian mode skips speeds above 30 km/h before sampling and resumes in
      a new persisted segment; neither the cursor nor walk digitizing uses that speed cap.
      Sampling occurs after validation and retains turns. No raw start, preview or closing
      location may bypass filtering. GPS loss creates persistent track segments, preserved
      by MapLibre, Canvas and GPX; walk persists gps_paused and requires explicit reconnection.
      Background sound consumes the shared validated stream before decimation and stays
      silent when fixes are stale, UI is visible or the setting is disabled. Existing
      alarm/vibration fallback and persistence-error throttling remain in effect.
      Permission revocation preserves durable track intent and walk drafts without starting
      a forbidden location foreground service. TrackerService remains in the application
      process so Start and Stop cannot overtake each other.
