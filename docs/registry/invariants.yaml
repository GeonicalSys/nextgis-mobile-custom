  INV-MAP-CAMERA-CONTROLS:
    title: Map rotation is explicit and location recovery is predictable
    owners: [app]
    statement: >
      Two-finger map rotation is disabled by default and changes only through the
      dedicated toolbar toggle. Disabling rotation returns the camera north-up and
      keeps tilt disabled. When enabled, pinch and rotate detectors run together so an
      immediate two-finger twist does not require a hold or sequential finger placement.
      The location action always resets north, raises zoom to at
      least 12 without zooming out, and when no current fix exists centers on the first
      layer with a valid finite extent at zoom 12 regardless of extent size.
    related_code:
      - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
      - app/src/main/java/com/nextgis/mobile/util/AppSettingsConstants.java
