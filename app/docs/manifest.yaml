  - path: app/src/main/java/com/nextgis/mobile/util/WalkEmergencyReset.java
    responsibility: Remove only the durable walk owner and its owned form checkpoint for startup or user-confirmed emergency recovery.
  - path: app/src/main/java/com/nextgis/mobile/activity/SettingsActivity.java
    responsibility: Settings navigation with Project and Underlay storage as adjacent top-level entries, and updater continuation after Android special install permission returns to a manual update check.
  - path: app/src/main/res/xml/preferences_tracks.xml
    responsibility: Track settings UI, including enabled-by-default fixed ten-second background recording heartbeat shared with walk recording, gated by fresh usable location delivery rather than coordinate movement, audible through the alarm stream independently of notification volume and replaced by vibration when alarm audio is muted.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicy.java
    responsibility: Keep the legacy APK archive signature request on Android 9 and newer while also requesting modern SigningInfo, so Android 9 and 10 can validate a same-certificate update through the populated fallback field.
  - path: app/src/test/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicyTest.java
