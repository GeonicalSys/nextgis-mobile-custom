  INV-STAKEOUT-GUIDANCE:
    title: Stakeout and free-point tools use WGS84 distance, WMM2025 magnetic azimuth and transient overlays
    owners: [maplib, app]
    statement: >
      Stakeout accepts selected Point/MultiPoint, LineString/MultiLineString and
      Polygon/MultiPolygon geometry in EPSG:4326 or EPSG:3857 without mutating the
      feature. Lines use the nearest segment point; polygons use the nearest outer or
      inner boundary even when the current fix is inside. User distance and bearing are
      WGS84 geodesic results, never raw Web Mercator distance. While stakeout
      is active, an owner-based high-frequency location lease sets minDistance to zero
      and restores ordinary user settings after the final release. Audio is scheduled by
      monotonic time, stops for stale fixes and never uses network fixes for
      precision bands. GPS and Android mock fixes use distance-based bands even when the
      receiver bridge publishes a coarse accuracy placeholder; the reported horizontal
      accuracy remains visible in the widget and the final cue requires two consecutive
      fresh in-tolerance fixes. Audible bands use a full-scale-limited short damped tap with
      3x digital gain and the final state a double tap, not a sustained high tone. A location foreground service,
      ongoing silent notification and partial wake lock keep GPS and audio active while the
      screen is off or the UI is paused; explicit stop releases all three. The same
      live lifecycle is available from current location to an arbitrary map point. A
      separate arbitrary point A to point B mode does not acquire GPS/audio resources.
      True initial bearing is converted to numeric magnetic azimuth by subtracting
      WMM2025 declination at the start; coincident points have undefined azimuth.
      Direction uses only the filtered device rotation-vector magnetic compass, never
      movement bearing; without a live compass it keeps the arrow screen-correct by
      subtracting an explicitly enabled map bearing from true bearing. Free-point
      markers and segment are transient MapLibre layers below the user-location cursor,
      never project features. Both static endpoints and the live target are draggable;
      the live GPS start is not editable. The map widget does not duplicate object name or
      coordinate source. Process death never silently restarts audible guidance or
      restores half-selected free points.
    related_code:
