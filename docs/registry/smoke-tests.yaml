schema_version: 1
tests:
  AUTO-DOCS-VALIDATE:
    type: automatic
    scope: docs
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\docs-check.ps1
    expected: All documentation and registry checks pass.
  AUTO-MAPLIB-UNIT:
    type: automatic
    scope: maplib
    command: .\gradlew.bat :maplib:testDebugUnitTest
    expected: Maplib unit tests pass.
  AUTO-MAPLIBUI-ASSEMBLE:
    type: automatic
    scope: maplibui
    command: .\gradlew.bat :maplibui:assembleDebug
    expected: Maplibui debug library assembles.
  AUTO-APP-RELEASES:
    type: automatic
    scope: app
    command: .\gradlew.bat :app:assembleLisaRelease :app:assembleBelkaRelease
    expected: Both product release variants assemble.
  AUTO-APP-VERSION-MATRIX:
    type: automatic
    scope: [app, maplib]
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\verify-apk-version-matrix.ps1
    expected: Lisa Debug, Lisa Release and Belka Release assemble; aapt reports the exact expected package and version for each APK; maplib diagnostic versions match their consuming variants.
  SMOKE-MAP-COLD-START:
    type: device
    scope: [app, maplib]
    steps: [Open an existing multi-layer map from a cold process start, Compare visible layers and order with the saved layer list]
    expected: Map renders once with the saved visibility and order and without a crash.
  SMOKE-LOCATION-CURSOR-TOP:
    type: device
    scope: [app, maplib]
    steps: [Open a map containing overlapping saved and active tracks plus vector layers, Move the current location onto the overlap, Perform a lite reload or hot layer update]
    expected: The standing and moving location cursor remains fully visible above tracks and every other MapLibre object before and after reload.
  SMOKE-NGRC-ORDER:
    type: device
    scope: [maplib, maplibui]
    steps: [Open a map with OSM and user layers, Import an NGRc/local raster, Inspect list and map order]
    expected: Raster is above OSM when OSM exists and is not above the entire user stack.
  SMOKE-NGRC-PRESERVE:
    type: device
    scope: [maplib, maplibui]
    steps: [Import a large NGRc into a Collector workspace, Run project composition and data sync, Restart the application]
    expected: Unpacked tiles remain, config records immutable_local provenance and SHA-256, and the underlay still renders.
  SMOKE-UPDATE-DATA-PRESERVE:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Record project database, form and NGRc files, Install a newer same-signature APK with adb install -r, Reopen and sync the project]
    expected: Project workspaces, SQLite data, forms and unpacked NGRc tiles remain in place without manual reimport.
  SMOKE-HOT-RASTER:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Hot-add a raster to an open map, Do not restart the application, Compare map style with the layer list]
    expected: The raster appears at the intended position without restart.
  SMOKE-LAYER-REORDER:
    type: device
    scope: [maplib, maplibui]
    steps: [Reorder mixed vector and raster layers, Finish the gesture, Compare list and map]
    expected: Map and list converge to the same bottom-to-top order.
  SMOKE-COLLECTOR-IMPORT:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Prepare a Collector project with editable enabled only for field vectors and add supported qgis_vector_style and qgis_raster_style items between vectors, Select the NGW Collector resource, Import its composition, Verify style tiles load with the project account and mixed order matches Collector, Verify My Tracks is the first and OpenStreetMap Standard aka Mapnik is the last layer-list row, Start object creation and inspect offered layers, Reopen and run composition sync, Repeat import with two different layers sharing a display name]
    expected: Project metadata and isolated workspace are created, layers are keyed by remote id, supported styles appear as authenticated read-only raster layers in the same order as vectors, My Tracks stays on top, default OSM stays at internal index zero without visibility reset, and only Collector vectors with editable plus outbound sync are offered for object creation.
  SMOKE-COLLECTOR-RESUME:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Start a multi-layer Collector import, Kill the application process during a layer fill, Reopen and wait for repair]
    expected: Existing complete layers are retained and only missing or broken layers are queued again.
  SMOKE-COLLECTOR-INCOMPLETE:
    type: device
    scope: [maplib, maplibui]
    steps: [Fail one referenced-resource request while opening a Collector resource, Attempt import]
    expected: Import is rejected before a new workspace is prepared and no partial project is reported as successful.
  SMOKE-FORM-ROLLBACK:
    type: device
    scope: [maplib, maplibui]
    steps: [Open a working Collector form, Interrupt or corrupt a form update between staged file replacements, Reopen the form]
    expected: Hash mismatch is rejected and recovery yields the complete old or complete new form/meta pair, never a mixed pair.
  SMOKE-COLLECTOR-SWITCH:
    type: device
    scope: [app, maplibui]
    steps: [Prepare project A with saved tracks and project B without tracks, Open the track list in A, Switch A to B to A without killing the process, Open the track list and inspect the map after each switch, Verify that switching is refused while a track is actively recording]
    expected: Map paths, metadata, layers and track history always come from the active project; A restores its tracks, B remains empty, and an active recording cannot cross the project boundary.
  SMOKE-BACKUP-GATE:
    type: device
    scope: [maplibui]
    steps: [Prepare unsent local layer data, Trigger schema rebuild or Collector removal, Simulate backup failure]
    expected: Destructive mutation is cancelled and local layer data remains.
  SMOKE-SYNC-OFF-CONFIG:
    type: device
    scope: [maplib, maplibui]
    steps: [Set an NGW layer to SYNC_NONE, Change supported server configuration, Run the relevant refresh flow]
    expected: Feature data is not synced while supported configuration behavior remains correct.
  SMOKE-MULTI-ACCOUNT-SYNC:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Open a Collector project whose account is not first in Android account order, Make another map account unavailable, Run manual sync, Restart and inspect enabled account schedules]
    expected: The active Collector account sync runs first, another account error has a separate result, and enabled schedules are restored without duplicate work.
  SMOKE-NGW-ACCOUNT-ADD:
    type: device
    scope: [app, maplibui]
    steps: [Install a release APK beside official and debug variants, Add a Web GIS with valid credentials, Reopen the Web GIS selector, Inspect Android AccountManager and exported HyperLog]
    expected: The login screen closes only after the variant-specific Android account is created and listed; authenticator, sync adapter and runtime account types match, and a local add failure keeps the form open with an error and diagnostic log.
  SMOKE-WALK:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Start geometry-by-walk editing, Pause and resume the app, Finish geometry]
    expected: Geometry and editing state survive lifecycle transitions without duplicate reload.
  SMOKE-TRACK-NO-FLAGS:
    type: device
    scope: [maplib, maplibui]
    steps: [Start and stop a track, Inspect map style and rendered track]
    expected: Track renders without start/end flag sources or layers.
  SMOKE-LISA-RELEASE:
    type: device
    scope: [app]
    steps: [Install Lisa release APK, Open About and main screen, Verify package brand and version]
    expected: Lisa identity, resources and version are correct.
  SMOKE-BELKA-RELEASE:
    type: device
    scope: [app]
    steps: [Install Belka release APK, Open About and main screen, Verify package brand and version]
    expected: Belka identity, resources and version are correct.
  SMOKE-SELF-UPDATE:
    type: device
    scope: [app]
    steps: [Check the branch manifest for Lisa Release, Belka Release and Lisa Debug, Test mismatched branch or channel and an APK URL outside the versioned branch path, Test mismatched versionName, size, checksum and certificate, Revoke Install unknown apps for the current variant, Download a valid artifact, Grant the requested special permission and return to the app]
    expected: Valid same-branch same-signature update reuses the downloaded APK and opens the installer automatically after permission return; invalid schema, identity, version, URL or integrity is rejected.
  SMOKE-NGW-URL-IMPORT:
    type: device
    scope: [app, maplib, maplibui]
    steps: [Add a public vector resource URL without a pre-existing account, Add a raster resource URL from an existing account, Add a QGIS style URL, Open a vector resource without data.write permission]
    expected: Guest account is created only for the validated public server, vector and raster appear through the normal reload flow, style resolves to its parent layer, and the no-write vector is read-only and pull-only.
