schema_version: 1
invariants:
  INV-FEATURE-TYPE-CREATION:
    title: Explicit style categories initialize valid parents and survive draft handoff
    owners: [maplib, maplibui, app]
    statement: A new object created by sketch, current location or walk may explicitly choose a concrete local style category before geometry. The dialog preserves its originating tool through recreation; walk ownership persists typed initial values atomically until geometry/form handoff, and cancelling a point category releases only the foreground point lock. Mixed forms are inspected without normalizing non-selector or empty bindings. Legacy and cascading selectors use canonical values and every valid stable-key parent filter; ambiguous tuples remain separate choices. Initial state never overwrites restored control state or existing objects, survives geometry and pre-launch form checkpoints, and never bypasses the normal Save gates.
    related_code: [maplibui/src/main/java/com/nextgis/maplibui/util/FeatureTypeDefaults.java, maplibui/src/main/java/com/nextgis/maplibui/util/LayerUtil.java, app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt]
    verify_smoke: [SMOKE-FEATURE-TYPE-CREATION]
    must_update_docs: [docs/architecture/feature-type-creation.md, docs/guides/form-behavior-user-guide.md]
  INV-CONDITIONAL-REQUIRED:
    title: Pinned visibility and requirements preserve values and validate visible fields
    owners: [maplib, maplibui, app]
    statement: Native bounded NGFP conditions read owning scalar values only; markers and final Save use the same immutable pinned rules. V2 visibility hides complete field/element containers and their descendant validation, preserving every value and the original layer required flag; visible static required is never relaxed. Unknown or duplicate targets and unavailable/corrupt rules block Save before writes, and draft pins/values survive updates and recovery. Tab navigation never discards control state or consumes signature/photo/text child gestures.
    related_code: [maplib/src/main/java/com/nextgis/maplib/forms/ConditionalRequiredRules.java, maplibui/src/main/java/com/nextgis/maplibui/util/ConditionalRequiredController.java]
    verify_smoke: [SMOKE-CONDITIONAL-REQUIRED, SMOKE-FORM-NAVIGATION, SMOKE-REQUIRED-FIELDS]
    must_update_docs: [docs/architecture/conditional-form-rules.md, docs/guides/form-behavior-user-guide.md]
  INV-CASCADING-FORM-LISTS:
    title: Native dependent lists preserve parent identity, drafts and historical attributes
    owners: [maplib, maplibui, app]
    statement: >
      The optional versioned NGFP namespace is declarative offline data. Parent filters
      compare stable keys with AND semantics in an acyclic graph of arbitrary depth.
      An explicit parent change clears all descendants and writes SQL NULL; no first
      item or remembered value is selected. Immutable definitions, selected keys and
      original values survive rotation and durable recovery. Save rejects invalid new
      combinations before feature/attachment writes; unchanged historical values survive.
      Managed legacy pairs render as separate labelled full-width fields with touch spacing;
      this presentation change preserves source JSON, field names and pinned draft keys.
      Existing forms without the namespace retain their legacy behavior.
    related_code: [maplib/src/main/java/com/nextgis/maplib/forms/CascadingLists.java, maplibui/src/main/java/com/nextgis/maplibui/util/CascadingFormController.java, maplibui/src/main/java/com/nextgis/maplibui/util/CascadingFormElements.java]
    verify_smoke: [AUTO-MAPLIB-UNIT, SMOKE-CASCADING-FORM-LISTS, SMOKE-REQUIRED-FIELDS]
    must_update_docs: [docs/architecture/cascading-form-lists.md, docs/guides/cascading-form-lists-user-guide.md]
  INV-PROJECT-SCRIPTS:
    title: Project rules execute under an isolated UID through bounded read-only grants
    owners: [maplib, maplibui, app]
    statement: >
      Only verified source-only Collector packages activate. Script contexts receive no Android,
      SQL, network or write access; every native query revalidates owning account, project,
      managed origin and fields. Before-save checks precede all feature/outbox/photo writes.
      Form drafts pin the complete immutable reference; failed updates retain the previous
      verified package and report incomplete validation. New capabilities are implemented
      gradually in the APK with type, CRS/unit and resource-budget contracts.
    related_code: [maplib/src/main/java/com/nextgis/maplib/scripts, maplibui/src/main/java/com/nextgis/maplibui/util/ProjectScriptFormController.java]
    verify_smoke: [AUTO-MAPLIB-UNIT, SMOKE-PROJECT-SCRIPTS]
    must_update_docs: [docs/architecture/project-scripts.md, docs/guides/project-scripts-user-guide.md]
  INV-REQUIRED-FIELDS:
    title: Required form values gate final Save while incomplete drafts remain recoverable
    owners: [maplib, maplibui, app]
    statement: >
      Authoritative NGW required metadata survives import, local config and Parcel; a flag-only
      change never rebuilds the feature table. Both form types and toolbar/Back Save validate
      all fields including inactive tabs and dependent values before feature/attachment writes.
      Null, whitespace and the legacy Нет значения placeholder fail; не применимо, zero and
      false pass. Optional fields remain unchanged and drafts retain fields, geometry and photos.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/datasource/Field.java
      - maplib/src/main/java/com/nextgis/maplib/util/NGWLayerSchemaCompat.java
      - maplibui/src/main/java/com/nextgis/maplibui/activity/ModifyAttributesActivity.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/RequiredFieldValidation.java
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-UNIT, SMOKE-REQUIRED-FIELDS]
    must_update_docs: [docs/architecture/ngw-sync-and-storage.md, docs/architecture/crash-recovery.md]
  INV-LOCAL-WRITE-COMMIT:
    title: Local features and sync records share one owning-map commit
    owners: [maplib, maplibui]
    statement: >
      Feature writes and strict outbox mutations use the owning layer database in one transaction.
      Read failure cannot mean an empty outbox. Notifications, mutation generation and feature or
      NGW attachment file deletion publish only after commit. UUID operation journals reconcile
      lost insert replies; form or attachment failure retains the draft and assigned id for retry.
      Files and SQLite form a recoverable workflow, not one atomic cross-store transaction.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/util/LayerDatabaseTransaction.java
      - maplib/src/main/java/com/nextgis/maplib/util/FeatureSaveJournal.java
      - maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
      - maplibui/src/main/java/com/nextgis/maplibui/activity/ModifyAttributesActivity.java
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-RELIABILITY-NATIVE, SMOKE-RELIABILITY-FAILURES]
    must_update_docs: [docs/architecture/ngw-sync-and-storage.md, docs/architecture/crash-recovery.md]
  INV-TRACK-RETRY:
    title: Failed track writes and Stop retain the owning-map tail
    owners: [maplib, maplibui, app]
    statement: >
      Sampled points enter a bounded ordered owning-map queue before idempotent UUID SQLite insert.
      A failed write retains the point; pending files are removed only after commit. Stop intent,
      track row and recording flag survive until the full tail drains and session closure commits.
      Corrupt checkpoints block silent recovery. Disk-full RAM fallback cannot survive process death
      until durable persistence succeeds; this limit must remain explicit.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/util/PendingTrackPoints.java
      - maplib/src/main/java/com/nextgis/maplib/map/TrackLayer.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/TrackerService.java
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-RELIABILITY-NATIVE, SMOKE-RELIABILITY-FAILURES, SMOKE-GPS-RECORDING]
    must_update_docs: [docs/architecture/crash-recovery.md, docs/architecture/location-pipeline.md]
  INV-TOOL-TAP-TOLERANCE:
    title: Tool placement accepts short micro-drift without swallowing deliberate gestures
    owners: [maplib, app]
    statement: >
      Drawing, ruler and azimuth placement share max(12dp, system touch slop), one short single-finger
      down/up pair and matching MapLibre pan threshold. Long press, cancellation, multi-finger and
      any larger excursion including return to the start cannot place a point. Normal camera mode
      restores its original pan threshold. Editable selection immediately shows feature actions;
      clearing it terminates action mode, while read-only selection remains view-only.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/MapTapGesture.java
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-RELIABILITY-NATIVE, SMOKE-TOOL-TAP]
    must_update_docs: [docs/architecture/map-rendering.md, docs/runbooks/device-smoke-tests.md]
  INV-NGID-LOGIN:
    title: NextGIS ID accepts normalized email or username without changing password
    owners: [maplibui]
    statement: >
      NGID login screens request email or username, avoid keyboard capitalization and submit the
      trimmed identifier in Locale.ROOT lowercase. Password is passed unchanged. Web GIS account
      input keeps its separate existing rules.
    related_code:
      - maplibui/src/main/java/com/nextgis/maplibui/util/NGIDLoginName.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/NGIDUtils.java
    verify_smoke: [AUTO-MAPLIBUI-UNIT, AUTO-RELIABILITY-NATIVE, SMOKE-NGID-AND-RESOURCE-ICONS]
    must_update_docs: [maplibui/docs/README.md, docs/reference/official-differences.md]
  INV-SHARED-UNDERLAYS:
    title: Shared offline payloads outlive project links
    owners: [maplib, maplibui, app]
    statement: NGRc and raster MBTiles live once outside project workspaces; new NGRc streams directly to MBTiles, legacy payloads move without re-encoding, and confirmed catalog deletion unlinks every project before payload removal.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/util/SharedUnderlayCatalog.java
      - maplib/src/main/java/com/nextgis/maplib/util/SharedUnderlayStore.java
      - maplib/src/main/java/com/nextgis/maplib/util/SharedUnderlayKind.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/SharedUnderlayProjects.java
      - app/src/main/java/com/nextgis/mobile/activity/UnderlayCatalogActivity.kt
    verify_smoke: [AUTO-MAPLIB-UNIT, SMOKE-SHARED-UNDERLAYS]
    must_update_docs: [docs/architecture/shared-underlays.md, docs/architecture/map-rendering.md, docs/architecture/collector-projects.md]
  INV-DEBUG-COMPANION:
    title: Companion installation has its own identity and continuation
    owners: [app]
    statement: Only production Geonical updates a trusted installed Debug missing its exporter; validate debug manifest, release URL, size, hash, version, pinned and installed certificate and exporter. Keep self-update policy and state separate; resume after permission and return to transfer confirmation in Underlay storage for the originating project.
    related_code:
