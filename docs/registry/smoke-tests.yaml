    expected: >
      The Orbit location cursor remains fully visible above tracks and every
      other MapLibre object before and after reload. Its transparent 21 dp opening, 6 dp
      blue centre and thicker blue rim (outer radius 13 dp), white halo, dark
      outer edge and larger outlined triangle remain distinct from the blue track and
      basemap detail. A smaller point beneath the cursor is visible around the blue
      centre with its original colour, including inside the compass sector; neither
      service fill tints the opening. The sector has a separate white halo and blue boundary above its
      translucent fill. The heading cone stays between the
      accuracy circle and the puck, turns with the phone, widens when heading is uncertain
      or the compass is disturbed, narrows after the field settles, and disappears without
      hiding the circle when the compass is unavailable, unreliable, missing or stale.
      The triangle follows the compass even at rest, immediately switches to a moving
      fix's valid course when compass readings expire, and disappears only when neither
      direction is available. Restored compass takes priority again. Its sector remains
      about 56 logical map pixels long across zoom; GPS accuracy remains metric and
      movement course alone never creates a compass sector. The ring never shifts on rotation.

