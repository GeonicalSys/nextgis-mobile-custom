schema_version: 1
tests:
  AUTO-SYNC-JOURNAL-CONFIRMATION:
    type: automatic
    scope: [app]
    command: With installed JBR21 and existing Q offline Robolectric inputs, run gradlew.bat --offline --no-daemon -PciReliabilityChecks=true :app:testLisaDebugUnitTest --tests com.nextgis.mobile.util.SyncRecoveryJournalTest --tests com.nextgis.mobile.util.SyncJournalCommitTest --tests com.nextgis.mobile.util.SyncRecoveryJournalConfirmationTest; exact environment and task-graph gate are recorded in android-20261030-sync-journal-confirmation.
    expected: Actual journal APIs preserve exact accepted project/account/manual and seven-key legacy cohort after cache-new false or throw; a later ordinary success cannot adopt rejected removal. Stable exact-owner isolation, reader race, malformed data, diagnostics and interrupt controls pass. Technical cache/disk maps do not certify real failed storage, restart, remote idempotency, native Android or full-project completion.
  AUTO-UI-SOURCE-CONTRACTS:
    type: automatic
    scope: [app, maplib, maplibui]
    command: py -3.13 -B docs/scripts/check_ui_contracts.py
    expected: Bounded UI catalogue has explicit producers/actions/conditions/expectations/gaps and reviewed method fingerprints; missing/mutated bindings fail. Unit mutations cover wrong camera/device source even after a hash update, comments masking missing producers, missing/duplicate methods/references, confined paths and false native PASS. This is source-only, never Android execution or complete semantic coverage.
  SMOKE-UI-VALUE-PROVENANCE:
    type: device
    scope: [app, maplib, maplibui]
    command: After separate runtime authorization follow the independent pilot matrix in docs/architecture/ui-contracts.md on an owned verification project/device.
    steps:
      - Keep the technical device/display fix and camera deliberately different; pan the camera without follow and read both independent producers.
      - Exercise only the applicable conditional autopan route, missing/stale fix, locate and saved viewport restore separately; Slezhenie must target selected geometry.
      - Verify read-only versus editable layer, active project ownership, form validation/draft and stale sync callbacks with independent state/row witnesses.
      - Record actual build/device/flavor/permissions and results; these steps are planned NOT_RUN in the current source/docs stage.
    expected: Deliberately separate device/display fix, camera and project extent. Pan without follow, test applicable autopan gates, missing/stale fix and viewport restore; compare each UI source independently. Verify selected-object action, layer visibility/edit rights, project owner and pending/sync state separately. Planned NOT_RUN in this source/docs stage; no location/business/project mutation on an ordinary user's data.
  AUTO-GPS-CACHE-WITNESS:
    type: automatic
    scope: [app, maplib]
    command: Run focused DiagnosticsGpsFixWitnessTest, DiagnosticsGpsPlatformTest, AppDiagnosticsTest and GpsDisplayRetentionTest locally with existing GPS recovery/controller and HTTP/sync real-error preservation tests.
    expected: Fifteen pure witness cases and API30/36 Robolectric adapters cover fixed ten-key numeric/enum output, missing/invalid/future/denied/read/clock states, older/same/newer arithmetic, scalar-only extraction, unchanged Location payload and legacy replay. Independent source/native fixture assertions distinguish measurement time from receipt age. A successful JVM run does not reproduce real vendor GNSS delivery loss; native emulator cases and physical follow-up are separate, never silently executed under a paused scope.
  AUTO-SQLITE-LAYER-PRIORITY:
    type: automatic
    scope: [maplib, app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area sqlite-priority
    expected: In the separate verification APK, the one exact method exercises production SQLite CustomVectorSource/current aliases and empty global feature cache; all saved/current track passes remain below whole field-line and Point/Firefly/MultiPoint/icon/label groups in canonical root model order, with ordinary line and polygon-label negatives and tools/GPS above. Full/lite/reorder/style/data generations, completed literal track rename snapshot, unchanged-source order repair, cached provider/source/promoted wrapper identity and hide/Undo filter restoration retain complete native IDs/placed labels/background pixels/full SQL originals and unchanged rows. Firefly body query includes its actual Symbol sprite. Capture bounded native order/source JSON and PNG before cleanup and retain failed attempts. Direct root children do not certify nested groups or Activity recreation; one focused method, old classic results and source units never certify the full class/Related/Full or real-project acceptance. Unsupported vendor UID logcat collection remains an explicit diagnostic gap. An explicitly selected stationary verification device is allowed; production data are not touched and no project metadata fixture is required.
  AUTO-LOCAL-TILE-CACHE-ADMISSION:
    type: automatic
    scope: [maplib, maplibui, app]
    command: .\gradlew.bat :maplib:testDebugUnitTest --tests com.nextgis.maplib.map.LocalVectorTileDiskCacheTest --tests com.nextgis.maplib.map.SqliteVectorTileAdmissionTest --tests com.nextgis.maplib.map.SqliteVectorSourceBridgeTest --tests com.nextgis.maplib.map.SqliteVectorTileProviderTest --tests com.nextgis.maplib.map.LocalVectorTileFullContentTest --tests com.nextgis.maplib.map.RenderTileWorkGateTest
    expected: Real temporary filesystem cache fixtures assert no repeated hot-path directory inventory, shared canonical-root accounting/registry reuse, byte/file limits, loss/write/rename/delete/cancellation recovery and exact complete bytes. Concurrency units assert canceled waiters avoid IO dispatch, active noncooperative work owns permits until unwind, blocked Main does not retain completed IO permits, failures/retry/predispatch cancellation release once, and all original tile/lifecycle/geometry/label expectations stay green. These are source checks; no device speed or native acceptance claim.
  AUTO-SQLITE-NATIVE-VECTORS:
    type: automatic
    scope: [maplib, maplibui, app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area sqlite-render
    expected: Nine isolated SQLite production-route methods assert CustomVectorSource and an empty global feature cache, all129polygon IDs with Rule/NULL/Other colors, source/style/hide/show teardown, one-original edit/Cancel/Undo and all six geometry types with multipart/hole/icon/pattern/viewport-label cases. Factory constants are checked where simple styles omit redundant feature properties; Rule overrides remain mandatory. Actual pixel thresholds are unchanged and await asynchronous symbols within a bounded budget. Every failed attempt is retained; subsequent independent methods do not turn an overall FAIL into PASS. Fixed verification UID logs, native counters and bounded PBF evidence are diagnostic, not proof of native delivery, real-project speed or OOM prevention. Explicit software-only admission or a selected stationary verification device is required.
  AUTO-RENDER-MEMORY-UNITS:
    type: automatic
    scope: [maplib, app]
    command: .\gradlew.bat :maplib:testDebugUnitTest :app:testLisaDebugUnitTest
    expected: Independent payload required/dead-key and full-geometry/identity/unknown-property assertions, line query fallback, exact uniform defaults, real-headroom policy, no false memory notice from a full queue with ample free memory, retained free counters without legacy process-budget/private additions, fair complete tile work/cache roundtrip and atomic once-per-process notice pass. JVM results do not certify native rendering, OOM prevention or2GiB acceptance.
  AUTO-RENDER-MEMORY:
    type: automatic
    scope: [app, maplib]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area render-memory
    expected: In the isolated verification APK, RenderMemorySafetyTest checks independently expected129SQLitepolygonIDs and65coordinates in both rich and actual compact inputs, complete native IDs and unchanged whole-row hashes. First automatic production notice arrives without a manual host callback, later callbacks/recreation/another layer do not repeat it, and manual status passes eight bounded Russian component profiles. Render stress also requires real pan/pinch camera changes, heading updates and peak counters. Explicit software-only emulator admission or selected stationary verification-phone scope is required; these fixtures do not emulate real low RAM or replace Full/device acceptance.
  SMOKE-RENDER-MEMORY-NATIVE:
    type: device
    scope: [app, maplib]
    steps:
      - Run the current render-memory and style/editing native cases in the separate verification APK, preserving required text/geometry/IDs/rules/layout/gates/picking across reload, edit, Save and Cancel.
      - Exercise the authorized heavy real project with actual available-memory/process observations, pan/zoom/heading/recreate and retained native images; record source fingerprints and device/renderer identity.
      - Record actualRAM on a physical2GiB-class target separately from the required incidentSM-X115tablet, physicalphone and admitted software-emulator matrix; model identity alone does not prove2GiB coverage. Retain any failed or incomplete result.
      - Check automatic notice once per process and independent manual status while cache/work economy is applied, without hiding layers or changing authoritative geometry/data.
    expected: Required contents and interactions remain intact; warnings/economy follow actual free headroom, never nominalRAM or absolute used/native/RSS. Measured memory changes need actual evidence and an explicit device scope. Technical fixtures, successful route input and prior source/unit receipts cannot prove allOOM impossible or satisfy missing native/2GiB/Full checks.
  SMOKE-NATIVE-HEAP-DIAGNOSTIC:
    type: device
    scope: [app]
    command: python tools/native_heap_map_route.py --adb <existing-adb> --serial <selected-phone> --capture <active-owned-capture.json> --map-rect <observed-left,top,right,bottom> --zoom-controls <observed-plus-x,plus-y,minus-x,minus-y>
    steps:
      - Inspect the actual selected phone screen and supply observed map/control coordinates; require an active owned project787capture matching the serial, original appPID and owned Perfetto command identity.
      - Record three zoom-out taps,32map swipes and three zoom-in taps; stop on foreground/PID/capture ownership loss and retain map-route.json.
      - Evaluate trace completeness, lost/overrun/error flags, allocation stacks, source/build identity and independent camera/pixel evidence separately.
    expected: This38-input manual diagnostic route changes only the map view and writes its receipt. Completed input is not camera/render acceptance, a qualified heap attribution or Full QA; empty/incomplete stacks remain unusable even if observedRSSis lower.
  AUTO-LOCAL-VECTOR-TILE-OFFLINE:
    type: automatic
    scope: [maplibui, app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area offline-tiles
    expected: With Wi-Fi and mobile data disabled only on the owned emulator, SQLite loopback MVT actually renders and a live marker edit reaches classic Firefly; Android NetworkUtil remains offline and the fixture restores both radios. The method remains mandatory in Full.
  AUTO-MAINTENANCE-REMINDERS:
    type: automatic
    scope: [app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area maintenance
    expected: Durable clocks distinguish full success, local projects, unknown-history grace, pending releases and validated ready APK without installation; 288 local Russian dialog configurations preserve full text and visible actions, and Full includes the stationary new class on the selected verification phone.
  AUTO-POLYGON-STYLE-CONTROLS:
    type: automatic
    scope: [maplib, maplibui, app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area styles
    expected: Periodic procedural textures, independent fill/pattern/contour alpha, dashed and secondary contours, saved categories, Polygon/MultiPolygon holes, fractional zoom, visibility/picking, image cleanup and live MVT fallback pass actual native checks. The real editor keeps the native preview visible and Save/Cancel reachable across 72 Russian window-local profiles. The polygon-styles area is a scoped development subset; Full remains required before publication.
  AUTO-POINT-FIREFLY:
    type: automatic
    scope: [maplib, maplibui, app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area styles
    expected: Classic rendering pixels prove crisp core, outward-only glow, transparent interior, independent alpha, Point/MultiPoint, zoom, unchanged circle blur and rendering-child/image cleanup. The actual editor passes 72 local Russian theme/font/display/orientation configurations and real preset/Save/Cancel touches. Explicit PhoneOnly uses only the isolated verification APK; Full remains separate.
  AUTO-FEATURE-EDITING:
    type: automatic
    scope: [app, maplibui, maplib]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area feature-editing
    expected: Isolated native copying, compatible targets, category recreation, typed SQLite values, actual multipart transform gestures, exact cancel and 72 local font/display/theme/orientation profiles pass. An explicit phone serial permits only classified stationary verification methods; PhoneOnly cannot produce Full acceptance.
  SMOKE-FEATURE-COPY-TRANSFORM:
    type: device
    scope: [app, maplibui, maplib]
    steps:
      - Select a read-only point, line or polygon and copy it to a compatible editable target, including a hidden target; reject incompatible types and lossy multipart truncation.
      - Choose a destination category; check matching fields, NULL, zero, int64, unbound form fields, Cancel, recreate and independent SQLite identity.
      - Move an editable multipart feature with one finger and rotate it with two; retain holes, scale and fixed camera, transition pointer counts, Undo/Redo, exact gesture Cancel and Save.
      - Check every action and full Russian mode caption in both themes and orientations with 100/130/200 percent fonts and normal/320/280 dp effective widths.
    expected: Source remains unchanged, the destination uses normal form gates, each transform gesture is one reversible step and every bottom-panel command is reachable without overflow.
  AUTO-MOBILE-USAGE:
    type: automatic
    scope: [app]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area usage
    expected: Isolated native outbox restart, exact ACK, HTTP 503 retention/retry and absent duration fields pass; production reporting stays disabled in verification.
  AUTO-MOBILE-RELATED:
    type: automatic
    scope: [app, maplibui, maplib]
    command: tools\verify-mobile-tests.ps1 -Scope Related -Area layers
    expected: Affected native cases pass on the isolated emulator; layers adds 36 real UI profiles. Other areas are listed in mobile-test-plan.json.
  AUTO-MOBILE-FULL:
    type: automatic
    scope: [app, maplibui, maplib]
    command: tools\verify-mobile-tests.ps1 -Scope Full
    expected: Local core/runner units, strict docs/report impact, version matrix, every phone/emulator native case, permitted-project integration, diagnostics recovery, 36 chooser and 6 enlarged real-window profiles pass. Cloud is manual-only. Missing permitted project asks the user; no other project is chosen automatically.
  AUTO-MOBILE-PUBLICATION-GATE:
    type: automatic
    scope: [app, maplibui, maplib]
    command: tools\verify-mobile-tests.ps1 -Scope Check-Publication
    expected: Only a complete local Full receipt matching current content of all four checkouts with real_window_matrix and other required gates is accepted; Related, skips, incomplete/stale results and a chooser-only matrix fail.
  SMOKE-LAYER-CHOOSER:
    type: device
    scope: [app, maplibui]
    command: Run layers Related on emulator and Full on the explicitly selected verification phone
    steps:
      - Run the layers area on the isolated emulator and verify actual selection of point, line, polygon and Cancel in all 36 UI profiles.
      - Run Full on the explicitly selected verification phone with permitted project 1403 or ask the user to select a replacement if absent.
    expected: Three eligible geometry rows have a multi-row viewport, every geometry and Cancel receive actual touches; permitted project creation offers every editable layer and excludes read-only layers. Enlarged landscape may scroll but the last row remains reachable.
  AUTO-UPDATER-CHECKS:
    type: automatic
    scope: [app]
    command: .\gradlew.bat :app:testLisaDebugUnitTest
    expected: StartupUpdateCheckSchedulerTest reproduces network/request failures, focus/busy deferral, restored process and late callbacks. AppUpdateNetworkStateTest permits manifest requests without VALIDATED but rejects APK traffic in roaming. AppUpdateDownloadTest covers persisted ranges, interrupted and corrupt transfers; AppUpdateReadyStateTest revalidates local product/version/hash/certificate without an installer. AppUpdatePendingInstallationTest preserves permission continuation. Related updater exercises the native background transfer and complete Russian ready dialog at large scales.
  SMOKE-LARGE-TEXT-UI:
    type: device
    scope: [app, maplibui]
    steps:
      - On an isolated Debug emulator run LargeTextLayoutTest with Russian text, both themes, fontScale 1.0/1.3/2.0, density 420/540/620 and portrait/landscape effective widths 280/320/360/568 dp.
      - Check a compact ordinary two-row status panel at all display densities, no altitude/speed or empty footer; pass DOWN/MOVE/UP through collapsed menu slots and retain the visible add-button tap.
      - When coordinates wrap, place short zoom/GPS/accuracy values together if they fit; restore the ordinary arrangement when width returns. Notifications may cover the map: check their own full text/actions, then check map controls separately after dismissal.
      - Verify complete azimuth instructions, correction values, settings titles/summaries, layer/resource names, login labels and GPS status; reject ellipsis, hidden lines and overlapping controls.
      - Verify Close and all correction actions stay inside the fitted panel and receive touches at their transformed visible positions.
      - Open the real settings menu and General/Map/Location/Tracks sections; verify every adapter row and the actual account/login/project/underlay screens in both orientations, retaining their existing list/form scrolling.
      - Change real emulator font_scale to 2.0 and wm density to 620 together; invoke the real-window test with uiOrientation portrait and landscape, assert the actual Russian locale and orientation with the keyboard closed, no map-tool overlap, and reachable Close/Save/Cancel; inspect screenshots and run FormAppearanceTest. Restore emulator settings afterwards.
    expected: All displayed labels remain readable and actions accessible; wrap and shorten first, fit remaining oversized components locally, restore natural sizes when room returns, and do not add scrolling to map panels. Physical OEM smoke remains separate.
  SMOKE-SYNC-OFFLINE:
    type: device
    scope: [app, maplibui]
    command: On an isolated Debug emulator use DiagnosticsTestRunner with an explicit synthetic DSN for offline/walk, account queue and track delivery suites; select the emulator serial in every adb command.
    steps:
      - Build Lisa Debug/test APKs with diagnosticDeliveryChecks=true; grant storage, location and POST_NOTIFICATIONS only to the isolated emulator.
      - Run adb -s <isolated-emulator-serial> shell am instrument -w -r -e class com.nextgis.mobile.reliability.SyncOfflineAndWalkGpsTest,com.nextgis.mobile.reliability.SyncNotificationsTest,com.nextgis.mobile.util.ProjectSyncRunnerTest,com.nextgis.mobile.reliability.TrackUploadTest -e diagnosticsDsn http://synthetic@127.0.0.1:9/1 -e diagnosticsRun sync-offline-walk com.nextgis.mobile.debug.test/com.nextgis.mobile.util.DiagnosticsTestRunner.
    expected: Disconnected manual tap/retry shows No internet connection without dispatching sync or changing last-sync time. Error notification uses the same readable text. Account work stays ENQUEUED with zero attempts until network returns; disconnected runner and track delivery retain queues/points without HTTP. GPS loss/timestamp gap resumes automatically without dropping the first usable fix or releasing point locks; explicit pause and sticky user pause state remain intact. No physical phone or production NGW accounts.
  SMOKE-SYNC-NOTIFICATIONS:
    type: device
    scope: [app]
    command: Run SyncNotificationsTest on an isolated emulator with DiagnosticsTestRunner and an explicit synthetic loopback DSN; select the emulator serial for every adb command.
    steps:
      - Build app unit tests and Lisa Debug/test APKs with diagnosticDeliveryChecks=true; install only to the isolated emulator and grant POST_NOTIFICATIONS.
      - Run adb -s <isolated-emulator-serial> shell am instrument -w -r -e class com.nextgis.mobile.reliability.SyncNotificationsTest -e diagnosticsDsn http://synthetic@127.0.0.1:9/1 -e diagnosticsRun sync-notifications com.nextgis.mobile.debug.test/com.nextgis.mobile.util.DiagnosticsTestRunner.
    expected: Unit API 26/36 reproduces inactive-progress repost and destroyed callbacks across the next session and preserves explicit optional messages. Native notifications show only readable errors by default, remove orphan manual/account progress without clearing errors, and disappear after bound account finish/cancel despite delayed progress. No physical phone or live NGW accounts.
  SMOKE-BACKGROUND-LOCATION-WARNING:
    type: device
    scope: [app]
    steps:
      - On an isolated Debug emulator run BackgroundLocationWarningTest with location/account grants and enabled location; do not run on a physical phone.
      - Verify launch without recording warns for screen-off GPS Battery Saver, app background restriction and missing Doze exemption, even with the legacy prompt hidden.
      - Verify each single Settings action opens the relevant system request or page directly without an app choice dialog; rotation retains acknowledgement and Resume detects a new restriction.
      - Enable GPS Battery Saver and remove Doze exemption together; verify the choice dialog offers both settings and the selected battery optimization action opens its system request.
      - While the app UID is background-restricted, return from the foreground test helper with system Back and await RESUMED; do not rely on the restricted UID's implicit AndroidX resume broadcast.
    expected: Warning does not block the map or start a track/walk; unchanged acknowledged state does not repeat, new restriction warns and clearing restrictions dismisses it. OEM field smoke remains separate.
  SMOKE-DIAGNOSTIC-NOISE:
    type: device
    scope: [app, maplib, maplibui]
    steps:
      - On an isolated Debug emulator build with diagnosticDeliveryChecks and use DiagnosticsTestRunner with an explicit test DSN pointing to an unavailable loopback receiver.
      - Invoke DiagnosticsNoiseTest seedObsoleteEndpointAndLargeLocalBacklog, stop only the emulator Debug process and separately invoke coldStartRetainsBacklogAndDelegatingHandlerWithoutRemoteUpload.
      - Invoke sdkBeforeSendPersistsAddressAndOneHttpEventPerBurst and actualSdkHttpCaptureRetainsOriginalRequestAndResponse on fresh synthetic caches; rerun workerRetriesTemporaryServerFailureWithoutNetworkChange with its loopback DSN.
      - Invoke androidJsonHashKeepsSnapshotDownloadAndStagedFormConsistent with synthetic forms to exercise the actual Android JSON implementation.
    expected: 6000 synthetic log rows survive cold startup without an upload URL or repeated initialization; app format and delegating handler remain. Twenty-eight same-source 503 events produce one envelope retaining its address and a different source another. Actual SDK capture keeps original query/headers/response, while receiver 503 retry succeeds without reinstalling handlers. Never run this on a physical device.
  SMOKE-FEATURE-TYPE-CREATION:
    type: automatic
    scope: [app, maplib, maplibui]
    command: adb -s emulator-5554 shell am instrument -w -e class com.nextgis.mobile.reliability.CascadingFormsTest,com.nextgis.mobile.reliability.MapEditingToolsTest,com.nextgis.mobile.reliability.StandardFeatureTypesTest com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner
    expected: Isolated emulator only. Category defaults fill all stable-key parents, preserve blank unrelated branches, override remembered legacy values, survive dialog/form recreation and durable recovery, and write the selected pair through the shared SQLite Save gate. Real map creation paths choose a category before sketching, current-location form or walk recording, preserve the originating tool through recreation and interrupted recorder recovery, hand defaults to the attribute form, save both fields and return to the map without drafts. Cancelling a point category during a walk releases the point lock and retains the recording. Manual project smoke also covers Cancel, a single layer, simple styling and real project symbols.
  SMOKE-SYNC-JOURNAL-CANCELLATION:
    type: automatic
    scope: [app]
    command: powershell -NoProfile -File tools/verify-mobile-tests.ps1 -Scope Related -Area bugreports
    expected: On an isolated API 36 emulator, interrupted enqueue and pair acknowledgment reach physical shared_prefs XML, retain the other pair and restore caller interrupt. Blocked startup/query snapshots survive in SDK events, including a Backfillable AnrV2Hint without replacing original release or operation.
  AUTO-SQLITE-ORIGINAL-BATCH-UNITS:
    type: automatic
    scope: [maplib]
    command: .\gradlew.bat -PciReliabilityChecks=true :maplib:testDebugUnitTest --tests com.nextgis.maplib.map.SqliteVectorFeatureReaderTest --tests com.nextgis.maplib.map.SqliteVectorTileProviderTest
    expected: Independent technical originals preserve65IDs/order/typedNULL/wide integers/fullBLOB;65 small buffers need three bounded geometry cursors and zero PFD reads, while16385-byte/multiMiB originals remain whole through lazy PFD. API26/27 do not query geometry windows; API30 SQLite CASE excludes large/TEXT/NULL payloads, attrs projection stays unchanged, mid-window fallback never duplicates callbacks, cancellation/cleanup/SQL/cardinality errors cannot cache partial PBF. Multipart/hole bytes and logical path diagnostics remain complete; this is not native/PSS/speed acceptance.
  AUTO-SQLITE-PHASE-UNITS:
    type: automatic
    scope: [maplib]
    command: .\gradlew.bat -PciReliabilityChecks=true :maplib:testDebugUnitTest --tests com.nextgis.maplib.util.MapRuntimeDiagnosticsTest --tests com.nextgis.maplib.map.SqliteVectorTileProviderTest --tests com.nextgis.maplib.map.SqliteVectorSourceBridgeTest
    expected: Fixed phase timing and privacy, delayed cancellation flush,16 active/32 layer limits with explicit loss and inactive reuse, clock/writer/watch failure cleanup, compatible backend overload and unchanged bytes/cancellation pass on technical JVM fixtures only.
  SMOKE-SQLITE-PHASE-TABLET:
    type: device
    scope: [app, maplib]
    command: On the authorized physical tablet capture bounded UID logcat LISA-SqlitePhase from the exact ordinary private APK and repeat the recorded project/camera route.
    steps:
      - Record APK SHA, package/version, serial/model/API, project identity, zoom/camera route and effective labels before measuring; Collector1403 tablet evidence is separate from phone787. Use the user-directed sharp17to12 zoom and fullynew extent, not only small warm pans.
      - Retain active stage timings, candidates/reads/BLOB/PBF bytes/cache/retries, explicit observation loss and distinct return/cancel/failure counts without URI/coordinates/attributes.
      - Measure complete visible map contents independently; Java returned_to_sdk does not establish native content ready, and frames or absence of errors do not replace content acceptance.
    expected: Phase evidence separates queue/read/decode/style/clip/label/PBF/Main waits under bounded diagnostics without changed geometry, layer visibility, workers, memory policy or storage permissions. Missing native readiness remains unverified; no speed improvement, Full or2GiB acceptance is inferred.
  SMOKE-MAP-RUNTIME-DIAGNOSTICS:
    type: device
    scope: [app, maplib]
    command: On an isolated Debug emulator run MapRuntimeDiagnosticsNativeTest via DiagnosticsTestRunner with an explicit synthetic DSN.
    steps:
      - Block the main looper with a synthetic query and verify the observer persists a bounded snapshot before the main thread returns and BeforeSend includes it.
      - Saturate the real local tile server with two blocked workers and sixteen queued requests; verify the next request returns 503 with queue_full and a request id.
      - Run ProjectSyncRunnerTest and the unit parsing/commit-failure fixtures; retain the original pending queue and check the precise phase/cause.
    expected: Fast operations do not write, slow/failed operations remain observable with bounded overhead, HTTP reasons survive SDK context and sync failure never clears recovery state.
  SMOKE-DIAGNOSTIC-DELIVERY:
    type: automatic
    scope: [app]
    command: powershell -NoProfile -File tools/verify-diagnostic-delivery.ps1 -TestDsn <private-test-project-dsn>
    expected: Isolated Debug emulator only. Offline handled and fatal reports survive a process restart and reach the test GlitchTip after network return. Temporary HTTP 503 retains the SDK envelope and WorkManager delivers after recovery without a network change or replacement crash handler. Verify real server stack, device, version and operation separately; fatal phase must terminate its synthetic process.
  SMOKE-STAKEOUT-PERMISSIONS:
    type: automatic
    scope: [app]
    command: adb -s emulator-5554 shell am instrument -w -e class com.nextgis.mobile.reliability.StakeoutForegroundServiceTest com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner
    expected: Isolated Android 14+ emulator only with Bluetooth Connect/Scan denied. With location granted, real location-only service survives background and Stop releases GPS, wake lock and notification; stale requests cannot stop a newer owner. Run deniedLocationStopsGuidanceWithoutCrashOrLeakedGps again with Fine and Coarse revoked to verify asynchronous rejection and retry cleanup. Unowned redelivery does not restore GPS/audio or crash.
  SMOKE-FORM-APPEARANCE:
    type: automatic
    scope: [app, maplibui]
    command: adb -s emulator-5554 shell am instrument -w -e class com.nextgis.mobile.reliability.FormAppearanceTest com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner
    expected: Isolated emulator only; both app themes keep permanent captions distinct from outlined values, long selections wrap, hidden comments occupy no layout space and footer Save uses the same required gate without SQLite writes on failure.
  SMOKE-ALL-PROJECT-SYNC:
    type: automatic
    scope: [app, maplib, maplibui]
    command: adb -s emulator-5554 shell am instrument -w -e class com.nextgis.mobile.util.ProjectSyncRunnerTest com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner
    expected: Isolated emulator only; default/manual/scheduled/off scope, equal layer names, retained draft, per-project failure continuation, exact recovery, cancellation and real background LayerFillService write all preserve their owning database. Pending pair and Collector journals remain separate across accounts and project paths.
  SMOKE-CONDITIONAL-REQUIRED:
    type: automatic
    scope: [app, maplib, maplibui]
    command: .\gradlew.bat :app:connectedLisaDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.nextgis.mobile.reliability.ConditionalRequiredFieldsTest"
    expected: V1 required remains compatible. V2 hides complete comment or element containers without clearing values; visible-only required, inactive/nested tabs, view-only and pinned headers share rules. Hide/show/rotation/durable recovery retain text; corrupt pins, duplicate IDs and unknown targets block Save before SQLite writes.
  SMOKE-FORM-NAVIGATION:
    type: automatic
    scope: [app, maplibui]
    command: .\gradlew.bat :app:connectedLisaDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.nextgis.mobile.reliability.CascadingFormsTest"
    expected: Default-form launch supplies matching metadata and outer headers stay visible; repeated swipes over enabled selectors, checkboxes, short comments and blank space preserve data; vertical drags, selected text and signature strokes do not navigate.
