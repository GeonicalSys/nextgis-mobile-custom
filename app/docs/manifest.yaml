    responsibility: Main navigation, per-launch and settings-return runtime permission checks for location, device accounts and legacy storage (notification permission is optional and requested only in Settings), track-mode dropdown with durable pedestrian/mixed selection, one-tap Stop without a location-permission gate, system-location-gated track/walk start, confirmed versus pending track toolbar/map-button state and failure warning, map rotation/location recovery, local file and shared-underlay import, default migration, walk-state reconciliation and crash-recovery hub, NGW URL/project selection, sync interruption, backup sharing and updater continuation.
  - path: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    responsibility: Choose Bluetooth Classic/LE, USB or TCP endpoint and persist gnss_input keys without Mock Location; show scan RSSI for duplicate-name Bluetooth receivers, request discovery permissions and release scans on pause/select/transport switch; identified ComNav/Pigo BLE uses the native paired UART/BESTPOSB session and expires stale HUD quality.
