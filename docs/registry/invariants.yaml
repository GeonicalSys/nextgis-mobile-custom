  INV-BACKGROUND-LOCATION-WARNING:
    title: Background GPS restrictions are checked without starting a recorder
    owners: [app]
    statement: >
      Check launch/resume for screen-off GPS Battery Saver policy, user background
      restriction and battery optimization. Open the applicable public system setting
      directly when there is one action; retain a choice when multiple restrictions apply,
      without changing settings or starting a recorder automatically. Retain one acknowledgement
      per unchanged launch state across rotation; a changed risk warns again and clearing
      restrictions removes the warning. Legacy Doze prompt suppression does not hide it.
      Missing Doze exemption means a possible risk, not proof of current GPS failure.
