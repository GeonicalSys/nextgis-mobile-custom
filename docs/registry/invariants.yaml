  INV-PROJECT-OPERATION-EXCLUSION:
    title: Active project identity is stable during database background work
    owners: [app, maplib, maplibui]
    statement: >
      Manual and per-account scheduled sync share a serial project queue; sync_all_projects defaults
      to true and false limits new full runs to the open map. A layer-specific run stays in the open map.
      The queue holds one DATA_SYNC lease throughout every project, account and async child without
      changing active preferences, MapBase active identity or drafts. Background maps use scoped lookup,
      opaque provider/service tokens and tracked callbacks; expired tokens cannot fall back to the UI database.
      Only session-owned fill/rebuild stages may join a scoped queue and touch SQLite in its dependent phase.
      Switch/create/rename/delete and unrelated imports wait for all owners, and duplicate full sync is refused.
      Cancellation stops reads and rolls back interrupted apply while awaiting unresolved outbound writes
      and children before releasing their database. The complete durable pair plan survives process death
      and each successful pair is acknowledged separately. Collector journals are path-partitioned;
      legacy migration, runtime state, schema guards and draft reservations validate the owning project.
      An unchanged schema mismatch is circuit-broken after two attempts in 24 hours, with at least
      ten minutes between attempts, and LayerFillService timeout must preserve the durable import journal.
