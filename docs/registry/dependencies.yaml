schema_version: 1
edges:
  - from: app
    to: maplibui
    type: gradle
    scope: implementation
    purpose: UI, NGW import, sync orchestration and GISApplication base
    contracts:
      - maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
      - maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/NGWResourceImportHelper.java
      - maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
      - maplib/src/main/java/com/nextgis/maplib/util/StakeoutGuidancePolicy.java
      - maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
  - from: app
    to: easypicker-module
    type: gradle
    scope: implementation
    purpose: Picker UI used by the application
    contracts: []
  - from: app
    to: wizardpager
    type: gradle
    scope: implementation
    purpose: Wizard-based application flows
    contracts: []
  - from: maplibui
    to: maplib
    type: gradle
    scope: api
    purpose: GIS model, storage, NGW and MapLibre contracts exposed through UI
    contracts:
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
      - maplib/src/main/java/com/nextgis/maplib/map/TrackLayer.java
      - maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
      - maplib/src/main/java/com/nextgis/maplib/util/NGWResourceUrl.java
      - maplib/src/main/java/com/nextgis/maplib/datasource/ngw/ResourceGroup.java
  - from: maplibui
    to: easypicker-module
    type: gradle
    scope: api
    purpose: Picker controls exposed by maplibui forms
    contracts: []
runtime_contracts:
  independent-walk-session:
    owner: maplibui
    defined_in: maplibui/src/main/java/com/nextgis/maplibui/util/WalkSessionStore.java
    implementers: [maplibui, app]
    callers: [app, maplibui]
  passive-walk-preview:
    owner: maplib
    defined_in: maplib/src/main/java/com/nextgis/maplib/map/WalkPreviewGeometry.java
    implementers: [maplib]
    callers: [app]
  map-host:
    owner: maplib
    defined_in: maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
    implementers: [app]
    callers: [maplib, maplibui]
  gis-application:
    owner: maplib
    defined_in: maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
    implementers: [maplibui]
    callers: [maplib, maplibui, app]
    integrity_hook: repairProjectIntegrityBeforeSync(accountName)
  collector-metadata:
    owner: maplib
    defined_in: maplib/src/main/java/com/nextgis/maplib/map/CollectorProjectMetadata.java
    implementers: [maplib]
    callers: [maplib, maplibui, app]
  ngw-url-import:
    owner: maplib
    defined_in: maplib/src/main/java/com/nextgis/maplib/util/NGWResourceUrl.java
    implementers: [maplib, maplibui, app]
    callers: [app]
  ngw-account-identity:
    owner: app
    defined_in: app/build.gradle
    implementers: [app, maplibui]
    callers: [app, maplibui]
  maplibre-renderer-backend:
    owner: app
    defined_in: app/build.gradle
    implementers: [app, maplibui, maplib]
    callers: [app, maplibui, maplib]
    artifact: org.maplibre.gl:android-sdk-opengl:13.0.2
    backend: OpenGL ES
  stakeout-guidance:
    owner: maplib
    defined_in: maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
    implementers: [maplib, app]
    callers: [app]
