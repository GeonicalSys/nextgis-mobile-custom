schema_version: 1
module_id: app
repository_id: root
maturity: maintained
last_verified: 2026-09-20
entrypoints:
  - app/src/main/java/com/nextgis/mobile/MainApplication.java
  - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
  - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
  - app/src/main/AndroidManifest.xml
key_components:
  - path: app/src/main/java/com/nextgis/mobile/fragment/LayersFragment.java
    responsibility: Reconcile sync animation against worker-owned state, query pending changes off the main thread with lifecycle and map guards, and confirm explicit rechecking of skipped server geometries on long press.
  - path: app/src/main/java/com/nextgis/mobile/provider/ExportFileProvider.java
    responsibility: For GPX FileProvider URIs, advertise text/xml in getType and anonymous lookup so MimeTypeMap clients do not append .bin or .null, while retaining canonical root and grant checks.
  - path: app/src/main/java/com/nextgis/mobile/activity/UnderlayCatalogActivity.kt
    responsibility: Browse shared assets, attach, rename and confirm deletion with affected projects; offer Debug underlay import into the active project on Geonical when trusted Debug is installed, except in layer-picker mode; AppTheme.UnderlayCatalog and an explicit Toolbar above the list respect system bar and display cutout insets in both modes.
  - path: app/src/main/res/layout/activity_underlay_catalog.xml
    responsibility: Keep catalog toolbar, progress, empty state, Debug import action and scrolling assets in a vertical layout below system insets.
  - path: app/src/main/java/com/nextgis/mobile/util/DebugCompanionInstaller.java
    responsibility: Separate trusted Debug installer, actual PackageManager exporter availability and enabled/exported checks, durable permission/project continuation, and focus-safe dialog/external-result guards shared by MainActivity and UnderlayCatalogActivity.
  - path: app/src/main/java/com/nextgis/mobile/util/DebugCompanionPolicy.java
    responsibility: Pure manifest, URL, version and signing identity rules for the Debug companion.
  - path: app/build.gradle
    responsibility: Variant application ID, provider authority, NGW authenticator/sync account identity, flavor resources, explicit MapLibre 13.0.2 OpenGL backend, production 3.1.2.21/215 versus Lisa Debug 3.1.2.21/216 version contract, and signing configuration.
  - path: app/src/lisa/res/values/launcher_icon.xml
    responsibility: Lisa launcher, intro and about icon binding to density-specific ic_launcher_lisa resources without changing Belka branding.
  - path: app/src/belka/res/values/launcher_icon.xml
    responsibility: Belka-only launcher, intro and about icon binding to density-specific ic_launcher_belka resources without changing Lisa branding.
  - path: app/src/main/java/com/nextgis/mobile/MainApplication.java
    responsibility: Main-process initialization and logging; honour save_log or verbose_log for HyperLog export; create or adopt and activate the initial local project before GISApplication opens its first map, schedule same-workspace recovery for an interrupted account sync, except that a pre-registry Debug workspace is kept in place for explicit underlay streaming; create editable local vector layers and keep default OSM at internal index zero plus tracks at the top of the reversed layer list for every workspace.
  - path: app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
    responsibility: Main navigation and toolbar state for explicit map rotation/location recovery, ordered in-process track Start/Stop intent shared with TrackerService, local GeoJSON/KML/GPX file routing, shared-underlay import from Open local and New underlay from file, photo-overlay default migration, ordered walk/manual-geometry/form crash-recovery hub, direct NGW resource URL resolution, Load project from the lisa catalog, name-only project picker with sync/fill/track switch protection, backup sharing UI and updater continuation on activity resume.
  - path: app/src/main/java/com/nextgis/mobile/activity/ExternalGnssActivity.java
    responsibility: Choose Bluetooth Classic/LE, USB or TCP NMEA endpoint and persist gnss_input device keys without Mock Location.
  - path: app/src/main/res/xml/preferences_general.xml
    responsibility: General settings including save_log file export and opt-in verbose_log GNSS dumps.
  - path: app/src/main/java/com/nextgis/mobile/activity/SettingsActivity.java
    responsibility: Settings navigation with Project and Underlay storage as adjacent top-level entries, and updater continuation after Android special install permission returns to a manual update check.
  - path: app/src/main/res/xml/preferences_tracks.xml
    responsibility: Track settings UI, including enabled-by-default fixed ten-second background recording heartbeat shared with walk recording, gated by fresh usable location delivery rather than coordinate movement, audible through the alarm stream independently of notification volume and replaced by vibration when alarm audio is muted.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicy.java
    responsibility: Keep the legacy APK archive signature request on Android 9 and newer while also requesting modern SigningInfo, so Android 9 and 10 can validate a same-certificate update through the populated fallback field.
  - path: app/src/test/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicyTest.java
    responsibility: Lock the updater signature-flag contract at the API 27/28 boundary and across Android 9, 10, 11 and current SDKs.
  - path: app/src/main/java/com/nextgis/mobile/activity/ProjectSettingsActivity.kt
    responsibility: Active project information and controls for current-project sync, local project creation, device-only rename/delete, changed-layer backup gate and schema-rebuild guard reset.
  - path: app/src/main/java/com/nextgis/mobile/activity/LegacyUnderlayExportActivity.java
    responsibility: Require an explicit user confirmation in Debug before granting Geonical read-only underlay stream URIs.
  - path: app/src/main/java/com/nextgis/mobile/provider/LegacyUnderlayProvider.java
    responsibility: Stream one local Debug underlay through a granted pipe without exposing paths, accounts, vectors, tracks or project identity.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayImporter.java
    responsibility: Convert legacy extracted TMS/OSM tiles directly into batched, atomically published raster MBTiles in the Geonical shared catalog followed by attachment to the active project and make retries source-key idempotent.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayMigrationContract.java
    responsibility: Pin Debug/Geonical package and signing-certificate identities, define the bounded-memory framed streaming schema and detect the one legacy bootstrap case that must stay in place.
  - path: app/src/main/java/com/nextgis/mobile/util/OfflineSyncIntentService.java
    responsibility: Reserve the active project before manual sync starts, run as a dataSync foreground service, and process only accounts represented by NGW layers in that active map, sequentially under one lease.
  - path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    responsibility: Map screen, complete MapLibre MapView lifecycle and renderer-reference cleanup across pause/resume/view recreation, bounded post-style continuous-render/presentation recovery and stale loading-foreground removal without full reload, EGL-recoverable SurfaceView selection on every API with API 26-27 30-FPS limits and API 28 resumed-only 5-FPS continuous compatibility mode, MaplibreMapInteraction implementation, opt-in persistent and immediate concurrent pinch/rotate gestures with north-up/location/layer-extent recovery, foreground rotation-vector heading cone on the GPS cursor without changing stand/go bearing, native NMEA HUD for RTK quality/sats/HDOP, hidden local-vector-tile attribute identification, immediate current-camera-centre tap sketch creation with automatic target visibility, confirmed new-sketch cancellation without a duplicate add toolbar action, visible selected-to-successor insertion direction, hectare ruler labels with sketch-equivalent Undo/Redo routed to the active MapLibre measurement geometry and saved-instance restoration, selected-node independent walk insertion, passive preview and session-acknowledged Finish with full point-session control lock, foreground stakeout host/widget plus transient current-location-to-point and arbitrary-point-to-point magnetic azimuth/distance modes with draggable editable endpoints and a widget that shows effective declination D+C without drag-hint copy, acknowledgement of completed post-fill style/source reload, shared Save/form handoff for new geometry with duplicate-launch protection, terminal successful-save cleanup to normal map mode with no feature selection for both new and existing objects, typed Polygon validation messages, GTMultiPolygon-only topology repair, durable non-walk geometry journal, and deferred current-style-safe geometry restoration and owner-aware recovery of coexisting walk and point drafts with polygon-only fill, stable outline and editable vertices after Stop. GPS callbacks use the durable recording flag and asynchronous map-owned track snapshots, never a synchronous unfinished-track query.
  - path: app/src/main/java/com/nextgis/mobile/location/DeviceHeadingProvider.kt
    responsibility: Foreground rotation-vector true heading for the map GPS cone, using WMM2025 declination without stakeout correction, plus magnetometer and heading-jitter inputs to HeadingConeAccuracy.
  - path: app/src/main/java/com/nextgis/mobile/location/HeadingConeAccuracy.kt
    responsibility: Combine rotation-vector heading accuracy, circular yaw jitter, raw-vs-filtered innovation and magnetometer field penalty, then open the cone faster than it closes.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutController.kt
    responsibility: Active selected-feature or arbitrary-point live-guidance lifecycle, in-place target replacement without releasing foreground resources, independent GPS listener, WMM2025 magnetic-bearing UI state with persisted declination correction, GPS/mock precision-source gate, reported-accuracy UI state, monotonic navigation-audio scheduling, 3 s freshness with a 1 s future-timestamp tolerance, and high-frequency GPS lease ownership across screen-off/background state.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutForegroundService.kt
    responsibility: Location foreground-service notification and partial wake-lock lifetime for audible stakeout guidance while the UI is paused.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutHeadingProvider.kt
    responsibility: Circularly filtered magnetic rotation-vector heading plus location-cached WMM2025 declination for the live guidance arrow without movement-bearing fallback.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/MagneticAzimuthCalculator.kt
    responsibility: Normalize true initial bearing minus east-positive WMM2025 declination plus persisted user correction into clockwise magnetic azimuth and return undefined for coincident points.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/WorldMagneticModel2025.java
    responsibility: Calculate offline magnetic declination from the official WMM2025 coefficients for the 2025-2030 model interval.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutAudioCue.kt
    responsibility: Full-scale limited low-pitched non-overlapping damped wooden-tap PCM cues with 3x digital gain and a distinct double-tap in-tolerance pattern.
  - path: app/src/main/res/menu/add_layer.xml
    responsibility: Add-layer popup; Load project is first, Add NGW layer by URL stays hidden with its handler intact.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
    responsibility: Branch-specific Lisa Mobile manifest, trusted versioned URL, integrity, identity, Android 9-10 archive-certificate fallback without weakening SHA-256 matching, and process-death-safe continuation after Android install permission.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncAdapter.java
    responsibility: Run backup-gated project integrity repair before each account, durably journal unfinished passes, defer heavy MapLibre reload until account completion, and surface the base NGW result or a plain user-visible repair/server failure without duplicating layer retry state.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncService.java
    responsibility: Keep system account sync in a low-priority dataSync foreground service from adapter start through finish/cancel.
  - path: app/src/main/java/com/nextgis/mobile/util/SyncRecoveryJournal.java
    responsibility: Persist one active account/workspace sync marker and request an idempotent same-workspace pass after process restart until a clean finish.
public_contracts:
  - id: map-host
    symbol: MapFragment implements MaplibreMapInteraction
    path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    consumers: [maplib, maplibui]
settings_refs: [feature_label_field, map_show_loc, map_show_compass, map_rotation_enabled, map_bearing, photo_overlay_enabled, photo_overlay_use_object_coords, photo_overlay_defaults_enabled_v1, stakeout_sound_enabled, stakeout_far_distance, stakeout_medium_distance, stakeout_near_distance, stakeout_reached_distance, stakeout_declination_correction, background_recording_sound, check_updates, sw_track_service, apk_version_update, updater-pending-install, sync_recovery_journal, com.nextgis.mobile.PREFS_UNDERLAYS, debug_companion_install, shared_underlay_migration, provider_auth, nextgis_accounts_auth, nextgis_accounts_auth_type, com.nextgis.mobile.UPDATE_FLAVOR, io.sentry.traces.user-interaction.enable, io.sentry.attach-screenshot, io.sentry.attach-view-hierarchy, io.sentry.traces.sample-rate, io.sentry.traces.profiling.sample-rate]
storage_contracts:
