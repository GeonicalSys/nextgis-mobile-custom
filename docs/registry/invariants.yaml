  INV-LOCAL-VECTOR-TILE-RESOURCE-BOUNDS:
    title: Local vector tiles cannot exhaust the Android heap with concurrent requests
    owners: [maplib, app]
    statement: >
      The loopback local-vector-tile server has at most two concurrent workers and sixteen
      queued sockets; overload receives a retryable HTTP 503 instead of allocating another
      worker. Builds for one layer are serialized because geometry BLOB parsing and clipping
      retain large object graphs. A map generation change closes queued stale sockets, and a
