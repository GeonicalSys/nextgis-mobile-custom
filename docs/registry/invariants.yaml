schema_version: 1
invariants:
  INV-UI-VALUE-PROVENANCE:
    title: UI meaning follows its producer and effective action, not visual position
    owners: [app, maplib, maplibui]
    statement: >
      Device raw/display location, camera center, saved viewport/project extent,
      selected geometry and entered coordinates are distinct. Trace effective
      widget/binding, units/CRS/axes/freshness, state gates and action side effects
      before using UI as evidence. Preserve source review and runtime UNKNOWN
      separately; new confirmed links are persisted without a separate request.
    related_code:
      - docs/registry/ui-contracts.json
      - docs/scripts/check_ui_contracts.py
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    must_update_docs: [docs/architecture/ui-contracts.md, docs/registry/ui-contracts.json]
    verify_smoke: [AUTO-UI-SOURCE-CONTRACTS, SMOKE-UI-VALUE-PROVENANCE]
  INV-GPS-CACHE-WITNESS:
    title: Passive system GPS cache evidence cannot change acquisition or disclose position
    owners: [app, maplib]
    statement: >
      Source schema4 raw_fix_elapsed_realtime_ms describes the existing rawGps measurement,
      including a possible cache seed, not exact callback entry time. Only an already emitted
      classified recovery report may perform at most one system GPS lastKnown read. The app
      extracts measurement time only and neither retains nor seeds the Location. Its ten fixed
      numeric/enum witness keys distinguish missing, invalid, future, denied, read and clock
      states; safe monotonic subtraction and relation enums preserve unknown/sentinel meaning.
      No coordinates, extras, accounts, URI, Location text or exception messages are added.
      No sensor activation, new observer, retry, classification, filter, recording or stored-data
      change. Binder execution time is not bounded by this observer; duration is reported.
      Cache/used-in-fix/registration evidence alone never establishes the root cause of a gap.
      Prior report replay remains historical and never acquires a new observation retrospectively.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
      - app/src/main/java/com/nextgis/mobile/util/DiagnosticsGpsFixWitness.java
      - app/src/main/java/com/nextgis/mobile/util/DiagnosticsGpsPlatform.java
      - app/src/main/java/com/nextgis/mobile/util/AppDiagnostics.java
    verify_smoke: [AUTO-GPS-CACHE-WITNESS, AUTO-APP-DEBUG, AUTO-APP-RELEASES]
    must_update_docs: [docs/architecture/error-reporting.md, docs/architecture/location-pipeline.md, app/docs/README.md, app/docs/manifest.yaml, maplib/docs/README.md, maplib/docs/manifest.yaml]
  INV-LOCAL-TILE-CACHE-ADMISSION:
    title: Complete derived tiles keep bounded shared cache accounting and cancellable pre-dispatch admission
    owners: [maplib, maplibui, app]
    statement: >
      Native and HTTP local tile consumers share the canonical-root cache ledger per operation.
      Hot publication cannot inventory or sort the entire cache catalog on every put; bootstrap
      and reconciliation are separate bounded ownership events. Preserve full PBF bytes, byte/file/
      entry budgets, atomic temporary-file publication, safe cache misses and SQLite authority.
      Native current guards apply inside optional disk publication; fallback HTTP retains its
      preexisting outer current/key checks without socket probes in the cache lock. Its peer
      cancellation/queue are not reworked here. Arbitrary external concurrent
      cache writers are not assumed supported. Android cache loss must not lose project data.
      A shared cancellable two-permit admission precedes native blocking IO dispatch across layers.
      Canceled SDK waiters do not enqueue a blocking payload each. A permit belongs to actual IO
      until it unwinds, releases before Main completion and releases exactly once on all paths.
      SDK Job demand remains authoritative: never discard a valid parent/fade/adjacent tile by
      heuristic age, zoom or density. This is not a bound on SDK pending jobs or the separate line
      label query scheduler. New source/content/style guards, editor originals, scale gates and
      complete geometry/identity/label output stay unchanged. JVM/build checks do not certify
      real device speed, final frame contents, low-RAM behavior or a two-second target.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileDiskCache.java
      - maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileServer.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorSourceBridge.kt
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorTileProvider.java
      - maplib/src/test/java/com/nextgis/maplib/map/LocalVectorTileDiskCacheTest.java
      - maplib/src/test/java/com/nextgis/maplib/map/SqliteVectorTileAdmissionTest.kt
    verify_smoke: [AUTO-LOCAL-TILE-CACHE-ADMISSION, AUTO-SQLITE-NATIVE-VECTORS, AUTO-APP-RELEASES]
    must_update_docs: [docs/architecture/map-performance.md, docs/architecture/map-rendering.md, maplib/docs/README.md, maplib/docs/manifest.yaml]
  INV-SQLITE-NATIVE-VECTORS:
    title: Ordinary vector rendering reads SQLite tiles without a global GeoJSON snapshot
    owners: [maplib, maplibui, app]
    statement: >
      Supported Simple and Field Rule renderers of all six geometry kinds use complete SQLite
      originals through the RTree, full MVT8192 and stock CustomVectorSource13.7.1 without HTTP.
      Cold/hot/lite/style/data load must not materialize the complete Java/GeoJSON layer. Preserve
      every eligible identity, rule/layout/paint/scale/label and original DB coordinate. Polygon
      Fill/Line exclude inline Point label roles; Symbol uses anchors. Selection/edit reads one
      unquantized DB original and only transient overlays remain GeoJSON. Cancel/save/hide/undo/
      remap restore native background without a global list. Cancel source work before native
      detach/style/project/view replacement; canonical model, owner, source, content and style
      generations reject late delivery. Project retirement is immediate and nonblocking even from
      workers. Stable SQLite layer paths and transient native source identities are separate:
      every source generation has a distinct renderer ID so SDK13.7.1 cannot keep the previous
      loader/tile pyramid across same-ID replacement. Factories, visible labels, lookup and removal
      use that actual ID; explicit classic binding first retires the streaming generation.
      Real Canvas hide invalidates the previous content generation; edit activation must rebind
      a current provider while keeping its owned original hidden. Actual finish restores that
      same model ID before capturing the replacement. Duplicate/invalid hide and no-op show
      never invalidate a current provider, including while another object is hidden for Undo.
      Query and full clipping share the classic128/512 tile buffer (2048 of8192 extent), so
      switching storage paths cannot lose the previous margin before style translations.
      This parity floor does not promise arbitrary out-of-buffer translation visibility.
      No simplification, thinning, hidden layer fallback or partial successful PBF is allowed.
      Resource admission uses only measured free remainder. JNI/PBF decode is not zero-copy, a
      bounded cache does not cap every native allocation, and native contents/performance/2GiB
      acceptance must be recorded independently of compilation and JVM results.
      TrackLayer is outside VectorLayer admission: saved/active tracks retain preexisting
      complete GeoJSON snapshots and point arrays. This contract does not certify track
      residency/long-session RAM or remove all GeoJSON from the application.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorLayerController.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorTileProvider.java
      - maplib/src/main/java/com/nextgis/maplib/map/NativeVectorTileEncoder.java
      - maplib/src/test/java/com/nextgis/maplib/map/NativeVectorTileBufferParityTest.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorSourceBridge.kt
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
      - maplib/src/test/java/com/nextgis/maplib/map/VectorLayerVisibilityEpochTest.java
      - maplib/src/main/java/com/nextgis/maplib/map/MPLFeaturesUtils.java
      - maplib/src/main/java/com/nextgis/maplib/map/VisibleLineLabelController.java
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
      - app/src/androidTest/java/com/nextgis/mobile/rendering/NativeSqliteVectorRenderingTest.java
    verify_smoke: [AUTO-SQLITE-NATIVE-VECTORS, AUTO-RENDER-MEMORY-UNITS, AUTO-RENDER-MEMORY, SMOKE-RENDER-MEMORY-NATIVE, AUTO-FEATURE-EDITING]
    must_update_docs: [docs/architecture/map-performance.md, docs/architecture/map-rendering.md, docs/runbooks/automated-tests.md, maplib/docs/README.md, maplib/docs/manifest.yaml, maplibui/docs/README.md, maplibui/docs/manifest.yaml, app/docs/manifest.yaml]
  INV-RENDER-MEMORY-PRESSURE:
    title: Resource pressure reduces caches and bounds work without changing layer contents
    owners: [maplib, app]
    statement: >
      Decide resource economy from actual remaining free system memory relative to its low-memory
      threshold and current Java headroom. Nominal device RAM, Android low-RAM class, absolute used
      memory and self-process native/RSS observations must not independently trigger a warning,
      cache degradation or work serialization. Nominal RAM class may choose ordinary disk-cache
      capacity and the allocation reserve only; native/RSS/used counters remain diagnostics, not
      pressure targets or hard caps. Unknown counters must not be treated as zero free memory.
      An 8 GiB device with little free memory must receive the same free-headroom protection.
      Only the current map/view/host epoch
      receives lifecycle-bound cache callbacks. Keep complete geometry, every eligible feature,
      source registration, model visibility, editing state, SQLite and sync unchanged. Normal tile
      work retains two permits; actual resource constraints serialize complete builds fairly, and
      unavailable headroom yields retryable HTTP 503 rather than successful partial tiles. Cache
      trimming and SDK onLowMemory do not guarantee eviction of GeoJSONVT's internal index or no OOM.
      Derived PBF disk caching and direct SQLite CustomVectorSource paging are implemented;
      native performance, complete styles/edit behavior and 2GiB acceptance remain separate gates.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/RenderMemoryGuard.java
      - maplib/src/test/java/com/nextgis/maplib/map/RenderMemoryGuardTest.java
      - maplib/src/main/java/com/nextgis/maplib/map/RenderMemoryPolicy.java
      - maplib/src/main/java/com/nextgis/maplib/map/RenderTileWorkGate.java
      - maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileServer.java
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - maplib/src/main/java/com/nextgis/maplib/util/MapRuntimeDiagnostics.java
      - maplib/src/test/java/com/nextgis/maplib/util/MapRuntimeDiagnosticsTest.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
      - app/src/androidTest/java/com/nextgis/mobile/rendering/RenderMemorySafetyTest.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/MapRenderStressTest.java
    verify_smoke: [AUTO-RENDER-MEMORY-UNITS, AUTO-RENDER-MEMORY, SMOKE-RENDER-MEMORY-NATIVE]
    must_update_docs: [docs/architecture/map-performance.md, docs/architecture/map-rendering.md, docs/runbooks/automated-tests.md, app/docs/README.md, app/docs/manifest.yaml, maplib/docs/README.md, maplib/docs/manifest.yaml]
  INV-NATIVE-GEOJSON-PAYLOAD:
    title: Compact native properties preserve complete geometry and rich editor state
    owners: [maplib, app]
    statement: >
      SQLite originals remain authoritative for project data; compatibility rich Java features
      and single-original editor overlays retain their complete original geometry/properties.
      Native-only copies retain geometry, all parts/rings/coordinates, bbox, feature/layer/order and
      GeoJSON identities, unknown properties and applicable explicit overrides. Drop only verified
      native-unused fields and properties not consumed by that source role. Polygon label points
      require a nonempty signature and carry label inputs rather than geometry paint; point sources
      retain both roles, and line geometry retains the native-query label fallback inputs. Preserve
      rule layout/dash keys, custom zoom curves, label gates and actual paint values. Uniform polygon
      sparsity requires the exact SimpleFeatureRenderer/SimplePolygonStyle context and matching
      factory defaults; missing context uses conservative projection. Initial/reload/edit/save,
      including all six MLP background constructors, must not restore the full rich native payload.
      Selected/tool/vertex sources and the public polygon anchor helper keep their prior contract.
      Styled URI files cannot bypass the projection. Transport counts contain IDs/counts only and
      are not native-memory attribution; neither pruning nor unit success is an OOM guarantee.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/NativeFeaturePayload.java
      - maplib/src/main/java/com/nextgis/maplib/map/MPLFeaturesUtils.java
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - maplib/src/main/java/com/nextgis/maplib/map/VisibleLineLabelController.java
      - maplib/src/main/java/com/nextgis/maplib/map/MLP
      - maplib/src/test/java/com/nextgis/maplib/map/NativeFeaturePayloadTest.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/VectorStyleRenderingTest.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/RenderMemorySafetyTest.java
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-RENDER-MEMORY, AUTO-POLYGON-STYLE-CONTROLS, AUTO-FEATURE-EDITING]
    must_update_docs: [docs/architecture/map-performance.md, docs/architecture/map-rendering.md, docs/reference/official-differences.md, docs/registry/dependencies.yaml, docs/runbooks/automated-tests.md, maplib/docs/README.md, maplib/docs/manifest.yaml, app/docs/README.md, app/docs/manifest.yaml]
  INV-RENDER-MEMORY-NOTICE:
    title: Automatic resource-economy notice is once per application process
    owners: [app, maplib]
    statement: >
      When cache economy, serialized work or actual free-memory resource delay is applied, the visible resumed current
      map receives a readable resource notice. An atomic process-session claim prevents repeats
      across callbacks, layers, maps and Activity recreation; only a new process starts a new claim.
      Manual map-loading status remains independent of that claim and is available while the current
      guard reports economy. Retry re-evaluates resource/cache policy rather than rebuilding every
      GeoJSON source. UI and lifecycle callbacks must not change saved visibility, geometry or data.
      The isolated verification app preserves production automatic delivery in the dedicated memory
      suite; other gesture/layout suites acknowledge that one known notice only in verification.
    related_code:
      - app/src/main/java/com/nextgis/mobile/util/RenderMemoryNotice.java
      - app/src/test/java/com/nextgis/mobile/util/RenderMemoryNoticeTest.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
      - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
      - app/src/main/res/menu/main.xml
      - app/src/main/res/values/render_memory.xml
      - app/src/main/res/values-ru/render_memory.xml
      - maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/RenderMemorySafetyTest.java
    verify_smoke: [AUTO-RENDER-MEMORY-UNITS, AUTO-RENDER-MEMORY, SMOKE-RENDER-MEMORY-NATIVE]
    must_update_docs: [docs/guides/bug-reports-user-guide.md, docs/runbooks/automated-tests.md, docs/registry/dependencies.yaml, app/docs/README.md, app/docs/manifest.yaml]
  INV-LOCAL-VECTOR-TILE-OFFLINE-TRANSPORT:
    title: Local vector tiles render without external network connectivity
    owners: [maplibui, app]
    statement: >
      MapLibre HTTP transport must remain available to the SQLite loopback tile server
      when Android reports no external network. This SDK override must not change
      Android NetworkUtil, WorkManager constraints, device radios or upload/update intent.
      Native offline coverage is emulator-only and restores its owned network state.
    related_code:
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/LocalVectorTileLabelTest.java
    verify_smoke: [AUTO-LOCAL-VECTOR-TILE-OFFLINE]
    must_update_docs: [docs/architecture/map-rendering.md, docs/reference/official-differences.md, maplibui/docs/README.md, maplibui/docs/manifest.yaml]
  INV-MIXED-MAP-CANDIDATES:
    title: A normal tap offers all eligible tracks and vector objects together
    owners: [app, maplib]
    statement: Collect vector SQL candidates with the existing inclusion and geometry-refinement policy plus visible native track IDs before choosing. Points and tracks never suppress each other or other vector geometry types. Deduplicate track segments by ID, retain layer plus feature identity separately from track identity, use a single scrolling chooser for multiple candidates, and select one candidate directly. Retain tool gestures, cancel without selection, reject stale map callbacks and dismiss the chooser with its view.
    related_code: [app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt, app/src/main/java/com/nextgis/mobile/util/MapSelectionDialog.java, maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java, app/src/androidTest/java/com/nextgis/mobile/rendering/TrackControlsTest.java]
    verify_smoke: [AUTO-MOBILE-RELATED, AUTO-MAPLIB-UNIT]
    must_update_docs: [docs/architecture/track-controls.md, docs/architecture/map-rendering.md, app/docs/README.md, maplib/docs/README.md]
  INV-FIELD-LINE-DISPLAY-PRIORITY:
    title: Standard field lines are above tracks and below point groups
    owners: [maplib, app]
    statement: Match only line or multiline geometry named Полевые линейные or field_lines (trimmed, case-insensitive). Keep whole body/halo/icon/label groups above ordinary data and every saved/current track pass and below actual Point/MultiPoint groups across full/lite/style/source/data/private refresh/reorder. Resolve exact logical, style-controller current native and known line-label aliases without stale-generation/prefix guesses; polygon Point label anchors never acquire point priority. Take relative group order from canonical bottom-to-top flattened LayerGroup, never source-cache insertion or registration arrival. Preserve internal order, cached Style.getLayer wrapper/filter-owner identity and higher transient tools/GPS; an already-correct stack is unchanged. Display priority never filters hit candidates or modifies cache/queue/currentness or authoritative data. The new sqlite-priority native corpus covers direct root children; nested/recreation acceptance remains separate.
    related_code: [maplib/src/main/java/com/nextgis/maplib/map/LayerDisplayPriority.java, maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java, maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorLayerController.java, maplib/src/test/java/com/nextgis/maplib/map/LayerDisplayPriorityTest.java, app/src/androidTest/java/com/nextgis/mobile/rendering/TrackControlsTest.java, app/src/androidTest/java/com/nextgis/mobile/rendering/NativeSqliteVectorRenderingTest.java]
    verify_smoke: [AUTO-MAPLIB-UNIT, AUTO-SQLITE-LAYER-PRIORITY, AUTO-MOBILE-RELATED]
    must_update_docs: [docs/architecture/track-controls.md, docs/architecture/map-rendering.md, maplib/docs/README.md, maplib/docs/manifest.yaml]
  INV-MAINTENANCE-REMINDERS:
    title: Weekly reminders distinguish complete online-project sync and verified app updates
    owners: [app]
    statement: Read only the active online project's canonical ProjectSyncState full-success clock; local maps never need sync. Persist successful validated manifest checks separately from first discovery of an uninstalled update, retaining the outstanding age across newer releases. Only a fully revalidated matching APK means downloaded. Unknown legacy history gets observation grace without claiming success. Foreground reminders preserve retry, Install/Later and offline work; rotation/network retries do not duplicate them, and a resident process receives a fresh review on reopening after a day.
    related_code:
      - app/src/main/java/com/nextgis/mobile/util/MaintenanceReminders.java
      - app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
      - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
      - app/src/test/java/com/nextgis/mobile/util/MaintenanceRemindersTest.java
      - app/src/androidTest/java/com/nextgis/mobile/util/MaintenanceRemindersNativeTest.java
    verify_smoke: [AUTO-MAINTENANCE-REMINDERS, AUTO-UPDATER-CHECKS, AUTO-MOBILE-RELATED]
    must_update_docs: [docs/architecture/maintenance-reminders.md, docs/runbooks/release-apk.md, app/docs/README.md, app/docs/manifest.yaml]
  INV-POLYGON-STYLE-CONTROLS:
    title: Configurable polygon symbols preserve old styles and match the live native preview
    owners: [maplib, maplibui, app]
    statement: Missing option objects preserve old patterns and opacity. Explicit disabled settings override inherited Other options. Procedural textures are periodic, bounded and shared by style with independent pattern alpha and last-owner native cleanup. Dash/cap/join use constant filtered rendering children with normal order, picking and visibility. Advanced MVT styles use the existing classic fallback. The live offline preview uses production native geometry factories and owns its lifecycle. A category modal edits an independent effective clone, leaves the source rule and Other unchanged on Cancel and saves only the chosen category; its separate remove action remains independent. Invalid new inputs block Save; Russian controls and actions remain reachable at large scales.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/display/ConfigurablePolygonPatternRegistry.java
      - maplib/src/main/java/com/nextgis/maplib/map/mpl/PolygonOutlineLayerFactory.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/StylePreviewView.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/PolygonStyleControls.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/PolygonStyleRenderingTest.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/PolygonStyleEditorTest.java
    verify_smoke: [AUTO-POLYGON-STYLE-CONTROLS, AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-ASSEMBLE]
    must_update_docs: [docs/architecture/polygon-style-controls.md, docs/architecture/classic-style-verification.md]
  INV-POINT-FIREFLY:
    title: Firefly core remains crisp and its glow has no interior coverage
    owners: [maplib, maplibui, app]
    statement: Marker type 9 shares the existing JSON fields and never changes the blur rendering of types 1–8. Its independent core and outer glow alpha compose without filling a transparent centre. Whole-symbol zoom and one layer-opacity multiplier apply to non-SDF children with the logical layer picking/order/visibility lifecycle. Native images are released after their last owner and CPU bitmaps are bounded. Type selection preserves existing settings; the field-points preset is explicit. Full remains a separate publication gate.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/display/FireflyMarkerRegistry.java
      - maplib/src/main/java/com/nextgis/maplib/map/mpl/FireflyLayerFactory.java
      - maplibui/src/main/java/com/nextgis/maplibui/fragment/StyleFragment.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/VectorStyleRenderingTest.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/FireflyStyleEditorTest.java
      - app/src/androidTest/java/com/nextgis/mobile/rendering/FireflyTileFallbackTest.java
    verify_smoke: [AUTO-POINT-FIREFLY, AUTO-MAPLIB-UNIT, AUTO-MAPLIBUI-ASSEMBLE]
    must_update_docs: [docs/architecture/point-firefly.md, docs/architecture/classic-style-verification.md]
  INV-FEATURE-COPY:
    title: Copying creates an independent compatible feature with destination category precedence
    verify_smoke: [AUTO-FEATURE-EDITING, SMOKE-FEATURE-COPY-TRANSFORM]
    owners: [app, maplib, maplibui]
    statement: A selected vector feature may be copied from a read-only source into another editable current-map layer only through lossless same-family single/multi compatibility. Match exact schema keys and compatible scalar types; never copy row identity. Destination category defaults override copied values. Save validates the normal destination form and preserves unbound fields, SQL NULL, empty strings, typed values and durable recovery. Cancellation never changes the source.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/util/FeatureCopyPolicy.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/FeatureCopyDefaults.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    must_update_docs: [docs/architecture/feature-copy-transform.md, docs/architecture/feature-type-creation.md]
  INV-WHOLE-OBJECT-TRANSFORM:
    title: Whole-object gestures preserve camera, structure, scale and one-step Undo
    verify_smoke: [AUTO-FEATURE-EDITING, SMOKE-FEATURE-COPY-TRANSFORM]
    owners: [app, maplib, maplibui]
    statement: An explicit geometry editor tool consumes one-finger translation and two-finger rotation for every component and hole without scaling or moving the camera. Pointer transitions do not jump. Preview journals projected geometry without allocating history steps; one completed gesture allocates one Undo step. CANCEL restores the exact prior coordinates. History retains container and nested CRS so a transformed multipart geometry remains saveable after Undo/Redo. All editing actions stay inside the bottom panel without overflow.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/util/GeometryTransform.java
      - maplib/src/main/java/com/nextgis/maplib/map/GeometryTransformGesture.java
      - maplibui/src/main/java/com/nextgis/maplibui/overlay/UndoRedoOverlay.java
      - maplibui/src/main/java/com/nextgis/maplibui/fragment/BottomToolbar.java
    must_update_docs: [docs/architecture/feature-copy-transform.md, docs/architecture/map-rendering.md, docs/architecture/crash-recovery.md]
  INV-MOBILE-USAGE:
    title: Usage statistics preserve offline ownership and never collect foreground duration
    owners: [app]
    statement: Release-only usage events have durable UUID and monotonic installation sequence in backup-excluded SQLite. Capture UI event time and owner before asynchronous storage; never substitute the upload-time project. Background workers do not count as openings. Retry immutable events and delete only explicitly acknowledged IDs from the sent batch. Device metadata and project inventory never read passwords, feature rows, GPS or crash storage. No foreground-duration events or timers are collected. Debug and verification never embed production usage credentials.
    related_code: [app/src/main/java/com/nextgis/mobile/usage, app/src/main/java/com/nextgis/mobile/MainApplication.java]
