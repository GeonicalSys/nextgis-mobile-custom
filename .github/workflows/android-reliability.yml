name: Android reliability

on:
  # Local Related/Full are the default; cloud minutes require an explicit request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare SDK configuration
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          chmod +x gradlew
      - name: Unit tests, debug APKs and both release source sets
        run: >-
          ./gradlew -PciReliabilityChecks=true -Pkotlin.compiler.execution.strategy=in-process --console=plain
          :maplib:testDebugUnitTest :maplibui:testDebugUnitTest :app:testLisaDebugUnitTest
          :maplibui:assembleDebug :app:assembleLisaDebug :app:assembleLisaDebugAndroidTest
          :app:compileLisaReleaseKotlin :app:compileLisaReleaseJavaWithJavac
          :app:compileBelkaReleaseKotlin :app:compileBelkaReleaseJavaWithJavac
      - name: Release build memory before starting the emulator
        run: ./gradlew --stop
      - name: Resolve built Debug APK paths
        run: |
          set -- app/build/outputs/apk/lisa/debug/*.apk
          [ "$#" -eq 1 ] && [ -f "$1" ]
          printf 'LISA_DEBUG_APK=%s\n' "$1" >> "$GITHUB_ENV"
          set -- app/build/outputs/apk/androidTest/lisa/debug/*.apk
          [ "$#" -eq 1 ] && [ -f "$1" ]
          printf 'LISA_TEST_APK=%s\n' "$1" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare host OpenGL for native glyph and image assertions
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0
          mkdir -p build
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset > build/xvfb.log 2>&1 &
          for attempt in $(seq 1 30); do
            if glxinfo -B > build/graphics-host.txt 2>&1; then
              cat build/graphics-host.txt
              exit 0
            fi
            sleep 1
          done
          cat build/graphics-host.txt
          exit 1
      - name: Native SQLite, track Stop, map tools and login regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Match the locally verified emulator; 37.2.12 loses its host EGL process
          # after the native suite when the enlarged-UI profile is applied.
          emulator-build: 13610412
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu host -feature -Vulkan -no-boot-anim
          script: |
            adb install -r "$LISA_DEBUG_APK"
            adb shell cmd locale set-app-locales com.nextgis.mobile.debug --locales ru
            adb shell appops set com.nextgis.mobile.debug MANAGE_EXTERNAL_STORAGE allow
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_BACKGROUND_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.GET_ACCOUNTS
            adb shell pm grant com.nextgis.mobile.debug android.permission.POST_NOTIFICATIONS
            adb shell cmd location set-location-enabled true
            adb shell svc wifi disable
            # The physical-project case belongs to local Full. Map/chooser checks use the
            # verification runner below, including clean per-method map fixtures and UI profiles.
            ./gradlew -PciReliabilityChecks=true :app:connectedLisaDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.nextgis.mobile.reliability -Pandroid.testInstrumentationRunnerArguments.notClass=com.nextgis.mobile.reliability.TrackUploadTest,com.nextgis.mobile.reliability.ProjectLayerSelectionTest,com.nextgis.mobile.reliability.MapEditingToolsTest,com.nextgis.mobile.reliability.SharedTracksTest,com.nextgis.mobile.reliability.LayerSelectionDialogTest --console=plain
            # UTP removes both packages. Reinstall for the remaining legacy permission/UI probes.
            # TrackUpload runs through the versioned verification runner's tracks area below,
            # with the same methods and its startup/workspace barriers, as in local Full.
            adb install -r "$LISA_DEBUG_APK"
            adb install -r "$LISA_TEST_APK"
            adb shell appops set com.nextgis.mobile.debug MANAGE_EXTERNAL_STORAGE allow
            adb shell pm grant com.nextgis.mobile.debug android.permission.POST_NOTIFICATIONS
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.GET_ACCOUNTS
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_BACKGROUND_LOCATION
            adb shell am force-stop com.nextgis.mobile.debug
            adb shell pm revoke com.nextgis.mobile.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm revoke com.nextgis.mobile.debug android.permission.ACCESS_COARSE_LOCATION
            adb shell am instrument -w -r -e class com.nextgis.mobile.reliability.StakeoutForegroundServiceTest#deniedLocationStopsGuidanceWithoutCrashOrLeakedGps com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/stakeout-location-denied.log
            cat build/stakeout-location-denied.log
            python3 -c "from pathlib import Path; text = Path('build/stakeout-location-denied.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.nextgis.mobile.debug android.permission.ACCESS_BACKGROUND_LOCATION
            # Check real windows with the keyboard closed, including Close and dialog actions.
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system font_scale 2.0
            adb shell wm density 620
            adb shell settings put system user_rotation 0
            adb shell am force-stop com.nextgis.mobile.debug
            adb shell am instrument -w -r -e uiOrientation portrait -e dialogStyle native -e class com.nextgis.mobile.reliability.LargeTextLayoutTest#realMapCloseAndDialogActionsStayReachable com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/large-text-real-0-native.log
            cat build/large-text-real-0-native.log
            python3 -c "from pathlib import Path; text = Path('build/large-text-real-0-native.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb shell am instrument -w -r -e uiOrientation portrait -e dialogStyle compat -e class com.nextgis.mobile.reliability.LargeTextLayoutTest#realMapCloseAndDialogActionsStayReachable com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/large-text-real-0-compat.log
            cat build/large-text-real-0-compat.log
            python3 -c "from pathlib import Path; text = Path('build/large-text-real-0-compat.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb shell am instrument -w -r -e uiOrientation portrait -e class com.nextgis.mobile.reliability.LargeTextLayoutTest#realSettingsAndSecondaryScreensRetainCompleteLabels com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/large-text-real-0-settings.log
            cat build/large-text-real-0-settings.log
            python3 -c "from pathlib import Path; text = Path('build/large-text-real-0-settings.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb shell settings put system user_rotation 1
            adb shell am force-stop com.nextgis.mobile.debug
            adb shell am instrument -w -r -e uiOrientation landscape -e dialogStyle native -e class com.nextgis.mobile.reliability.LargeTextLayoutTest#realMapCloseAndDialogActionsStayReachable com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/large-text-real-1-native.log
            cat build/large-text-real-1-native.log
            python3 -c "from pathlib import Path; text = Path('build/large-text-real-1-native.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb shell am instrument -w -r -e uiOrientation landscape -e dialogStyle compat -e class com.nextgis.mobile.reliability.LargeTextLayoutTest#realMapCloseAndDialogActionsStayReachable com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/large-text-real-1-compat.log
            cat build/large-text-real-1-compat.log
            python3 -c "from pathlib import Path; text = Path('build/large-text-real-1-compat.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb shell am instrument -w -r -e uiOrientation landscape -e class com.nextgis.mobile.reliability.LargeTextLayoutTest#realSettingsAndSecondaryScreensRetainCompleteLabels com.nextgis.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner > build/large-text-real-1-settings.log
            cat build/large-text-real-1-settings.log
            python3 -c "from pathlib import Path; text = Path('build/large-text-real-1-settings.log').read_text(); assert 'OK (1 test)' in text and 'FAILURES!!!' not in text and 'Process crashed' not in text, text"
            adb exec-out run-as com.nextgis.mobile.debug tar -czf - files/large-text-qa > build/large-text-qa.tar.gz
            adb shell settings put system font_scale 1.0
            adb shell wm density reset
            adb shell settings put system user_rotation 0
            python3 tools/run_mobile_tests.py --scope related --area map --area layers --area tracks --area styles --area usage --area bugreports --output build/ci-verification
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reliability-reports
          path: |
            build/graphics-host.txt
            build/xvfb.log
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            maplib/build/reports/tests
            maplibui/build/reports/tests
            build/stakeout-location-denied.log
            build/large-text-real-*.log
            build/large-text-qa.tar.gz
            build/ci-verification
          if-no-files-found: ignore
