  INV-DIAGNOSTIC-DELIVERY:
    title: Diagnostic events survive offline and temporary server failures
    owners: [app]
    statement: >
      Initialize only after the isolated-script guard and before the delegating local crash
      handler. Persist bounded SDK envelopes in private files storage before async HTTP;
      retain offline, 5xx and rate-limited failures, replay through SDK observers and a
      connected WorkManager job without reinitializing handlers. Event UUID and diagnostic
      stack/version/device/typed-operation context survive process restart. Never read or
      attach raw HyperLog, NMEA, GIS attributes/geometry, accounts or photos. Fatal exceptions
      still delegate to Android and existing draft recovery remains independent.
