      - maplibui/src/main/java/com/nextgis/maplibui/view/TrackSelectionPanel.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/FittedDialogs.java
      - app/src/androidTest/java/com/nextgis/mobile/util/VerificationEnvironment.java
      - maplibui/src/main/java/com/nextgis/maplibui/mapui/LocalChangesWorker.java
      - maplib/src/main/java/com/nextgis/maplib/util/ProjectSyncState.java
      - maplib/src/main/java/com/nextgis/maplib/gnss/GnssDevice.java
      - maplib/src/main/java/com/nextgis/maplib/gnss/GnssDeviceScanner.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/TrackRecordingMode.java
      - maplibui/src/main/java/com/nextgis/maplibui/service/TrackerService.java
      - maplib/src/main/java/com/nextgis/maplib/map/MaplibreMapInteraction.java
      - maplib/src/main/java/com/nextgis/maplib/map/RenderMemoryGuard.java
      - maplib/src/main/java/com/nextgis/maplib/util/MapRuntimeDiagnostics.java
      - maplib/src/main/java/com/nextgis/maplib/map/NativeFeaturePayload.java
      - maplib/src/main/java/com/nextgis/maplib/api/IGISApplication.java
      - maplibui/src/main/java/com/nextgis/maplibui/util/NGWResourceImportHelper.java
      - maplib/src/main/java/com/nextgis/maplib/util/StakeoutGeometryTarget.java
      - maplib/src/main/java/com/nextgis/maplib/util/StakeoutGuidancePolicy.java
      - maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
      - maplib/src/main/java/com/nextgis/maplib/location/GpsRecoveryPolicy.java
  - from: app
    to: easypicker-module
    type: gradle
    scope: implementation
    purpose: Picker UI used by the application
    contracts: []
