  INV-SPATIAL-CACHE-CONSISTENCY:
    title: Vector spatial cache remains consistent across sync and main-thread notifications
    owners: [maplib]
    statement: >
      An incremental NGW pull suppresses per-row insert, update and delete broadcasts, applies all
      tracked changes in one rollback-safe SQLite transaction, and performs one spatial-cache rebuild
      plus one map reload after commit. Public
      GeometryRTree reads and mutations are serialized; a cache rebuild never exposes an envelope
      after unInit and never swallows ConcurrentModificationException while leaving null bounds.
      Vector-layer notifications do not mutate a cache during bulk/rebuild, and a receiver callback
      failure is logged without terminating the Android main thread. MapLibre style workers never
      mutate Feature.properties already published to the live map; they use an independent render-cache
      snapshot or fall back to a full data reload. A full untracked NGW response is staged on disk and
      stream-applied in one SQLite transaction. A remote feature with missing or invalid geometry remains
      represented by its remote ID but is not applied, so it neither aborts the layer nor deletes an existing
      local row. MapLibre reloads once after commit and hidden layers do not materialize full GeoJSON until enabled.
