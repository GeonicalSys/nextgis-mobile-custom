apply plugin: 'com.android.application'
apply plugin: 'io.sentry.android.gradle'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'
//apply plugin: 'kotlin-kapt'

def productionVersionCode = 212
def productionVersionName = '3.1.2.18'
def debugVersionCode = 213
def debugVersionName = '3.1.2.18'

def geonicalSigningPropertyNames = [
        'GEONICAL_STORE_FILE',
        'GEONICAL_STORE_PASSWORD',
        'GEONICAL_KEY_ALIAS',
        'GEONICAL_KEY_PASSWORD'
]
def geonicalSigningPropertyCount = geonicalSigningPropertyNames.count {
    project.hasProperty(it)
}
if (geonicalSigningPropertyCount > 0
        && geonicalSigningPropertyCount < geonicalSigningPropertyNames.size()) {
    throw new GradleException(
            "Incomplete Geonical release signing configuration. Required properties: "
                    + geonicalSigningPropertyNames.join(', '))
}
def geonicalSigningConfigured =
        geonicalSigningPropertyCount == geonicalSigningPropertyNames.size()


android {
    namespace "com.nextgis.mobile"

    buildFeatures {
        buildConfig = true
    }

    // Setup the Sentry DSN from the file 'sentry.properties', which should contain
    // sentry.dsn=https://publicKey:secretKey@host:port/1?options
    // DO NOT PUBLIC the file 'sentry.properties' !!!
    File sentryPropFile = rootProject.file('sentry.properties')
    String sentryDsn = ""
    if (sentryPropFile.exists()) {
        Properties sentryProp = new Properties()
        sentryProp.load(sentryPropFile.newDataInputStream())
        sentryDsn = sentryProp.get("sentry.dsn")
        if (sentryDsn == null || sentryDsn.trim().isEmpty()) {
            throw new GradleException("sentry.dsn is missing or empty in sentry.properties")
        }
    }else{
        throw new GradleException("Missing required file: sentry.properties. Build cannot continue.")
    }


    defaultConfig {
        applicationId 'com.nextgis.mobile'
        minSdkVersion 26
        compileSdk 36
        targetSdkVersion 36
        // Fork versioning: docs/reference/build-matrix.md and docs/runbooks/release-apk.md
        versionCode productionVersionCode
        versionName productionVersionName
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""

        def props = new Properties()
        file("../local.properties").withInputStream { props.load(it) }

    }

    flavorDimensions "brand"
    productFlavors {
        lisa {
            dimension "brand"
            manifestPlaceholders = [updateFlavor: "lisa"]
            resValue 'string', 'APP_NAME', 'NextGIS ЛИСА'
            resValue 'string', 'app_name', 'NextGIS ЛИСА'
        }
        belka {
            dimension "brand"
            manifestPlaceholders = [updateFlavor: "belka"]
            resValue 'string', 'APP_NAME', 'NextGIS Белка'
            resValue 'string', 'app_name', 'NextGIS Белка'
        }
    }

    // Debug uses Android's standard debug keystore. Production signing credentials live only
    // in the user's ~/.gradle/gradle.properties and point to a keystore outside this repository.
    signingConfigs {
        release {
            if (geonicalSigningConfigured) {
                File configuredStoreFile = file(project.property('GEONICAL_STORE_FILE'))
                if (!configuredStoreFile.isFile()) {
                    throw new GradleException(
                            "Geonical release keystore does not exist: " + configuredStoreFile)
                }
                storeFile configuredStoreFile
                storePassword project.property('GEONICAL_STORE_PASSWORD')
                keyAlias project.property('GEONICAL_KEY_ALIAS')
                keyPassword project.property('GEONICAL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            applicationIdSuffix '.geonical'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Bright fox-orange production palette. Debug keeps maplibui's green palette.
            resValue 'color', 'primary', '#D75A12'
            resValue 'color', 'primary_dark', '#94320A'
            resValue 'color', 'accent', '#C94F0C'
            // APP_NAME intentionally NOT set in release buildType — productFlavors lisa/belka
            // own that key (CUSTOMIZATIONS §14). Adding it here would override the flavor value.
            resValue 'string', 'SENTRY_DSN', sentryDsn
            resValue 'string', 'provider_auth', 'com.nextgis.mobile.geonical.provider'
            resValue 'string', 'nextgis_mobile_accounts_auth', 'com.nextgis.mobile.geonical.account'
            // authenticator.xml, syncadapter.xml and MainApplication must expose the same type.
            // Without this app-level override maplibuiRelease falls back to com.nextgis.account,
            // so AccountManager rejects the Geonical runtime type after valid NGW authentication.
            resValue 'string', 'nextgis_accounts_auth', 'com.nextgis.account.geonical'
            resValue 'string', 'nextgis_accounts_auth_type', 'com.nextgis.account.geonical'
            buildConfigField "String", "providerAuth", '"com.nextgis.mobile.geonical.provider"'
            buildConfigField "String", "nextgismobile_accounts_auth", '"com.nextgis.account.geonical"'
            if (geonicalSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
            manifestPlaceholders = [updateFlavor: "debug"]
            resValue 'string', 'APP_NAME', 'ЛИСА тест'
            resValue 'string', 'app_name', 'ЛИСА тест'
            resValue 'string', 'SENTRY_DSN', sentryDsn
            resValue 'string', 'provider_auth', 'com.nextgis.mobile.provider.debug'
            resValue 'string', 'nextgis_mobile_accounts_auth', 'com.nextgis.mobile.account.debug'
            resValue 'string', 'nextgis_accounts_auth', 'com.nextgis.account.debug'
            resValue 'string', 'nextgis_accounts_auth_type', 'com.nextgis.account.debug'
            buildConfigField "String", "providerAuth", '"com.nextgis.mobile.provider.debug"'
            buildConfigField "String", "nextgismobile_accounts_auth", '"com.nextgis.account.debug"'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // The archive basename follows the production default. Variant identity/version must be read
    // from APK metadata; the publisher assigns the canonical versioned filename after inspection.
    base {
        archivesName = "ngmobile-${productionVersionName}"
    }

}

// There is one internal build: lisaDebug. Belka is a production brand only.
androidComponents {
    beforeVariants(selector().withBuildType("debug")) { variantBuilder ->
        if (variantBuilder.productFlavors.any { it.second == "belka" }) {
            variantBuilder.enable = false
        }
    }
    // AGP 9.x does not expose application versionCode/versionName on buildTypes.
    // Override the single enabled debug output through the public Variant API instead.
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(debugVersionCode)
            output.versionName.set(debugVersionName)
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':maplibui')
    implementation project(':easypicker-module')

    //implementation 'com.github.joshdholtz:Sentry-Android:1.6.0'
    //implementation 'io.sentry:sentry-android:1.7.30'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation ('io.sentry:sentry-android:8.37.1'){
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-ktx'
    }


    implementation 'com.github.JakeWharton:NineOldAndroids:2.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
//    implementation 'com.android.support:support-compat:28.0.0'
    implementation('androidx.recyclerview:recyclerview:1.4.0') {
    }
    implementation('androidx.legacy:legacy-support-v4:1.0.0') {
    }
//    implementation 'com.github.TechFreak:WizardPager:1.0.3'
    //implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.barsrb:hyperlog-android:master-SNAPSHOT'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // MapLibre 13's generic android-sdk artifact uses Vulkan. Keep OpenGL explicit so
    // devices without a compatible Vulkan implementation can open the map.
    implementation 'org.maplibre.gl:android-sdk-opengl:13.0.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

//    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
//    debugImplementation "com.squareup.leakcanary:leakcanary-android-core:2.14"

    implementation project(path: ':wizardpager')
}

/*
 * With multiple product flavors, Gradle task name abbreviation matches several candidates
 * (e.g. assembleDebugUnitTest → assembleLisaDebugUnitTest vs assembleBelkaDebugUnitTest).
 * Exact aliases defaulting to flavor "lisa" restore IDE / "Run tests" / short Gradle invocations.
 */
afterEvaluate {
    String defaultFlavor = 'lisa'
    String f = defaultFlavor.capitalize()
    [
            'assembleDebug'            : "assemble${f}Debug",
            'assembleRelease'          : "assemble${f}Release",
            'assembleDebugUnitTest'    : "assemble${f}DebugUnitTest",
            'assembleReleaseUnitTest'  : "assemble${f}ReleaseUnitTest",
            'testDebugUnitTest'        : "test${f}DebugUnitTest",
            'testReleaseUnitTest'      : "test${f}ReleaseUnitTest",
            'installDebug'             : "install${f}Debug",
            'installRelease'           : "install${f}Release",
            'uninstallDebug'           : "uninstall${f}Debug",
            'uninstallRelease'         : "uninstall${f}Release",
            'bundleDebug'              : "bundle${f}Debug",
            'bundleRelease'            : "bundle${f}Release",
    ].each { String alias, String targetName ->
        if (tasks.findByName(alias) == null) {
            def targetTask = tasks.findByName(targetName)
            if (targetTask != null) {
                tasks.register(alias) {
                    dependsOn(targetTask)
                    group = 'build'
                    description = "Alias for :${project.path} ${targetName} (default flavor ${defaultFlavor})"
                }
            }
        }
    }
}
