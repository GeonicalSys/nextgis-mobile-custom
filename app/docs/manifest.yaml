schema_version: 1
module_id: app
repository_id: root
maturity: maintained
last_verified: 2026-09-13
entrypoints:
  - app/src/main/java/com/nextgis/mobile/MainApplication.java
  - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
  - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
  - app/src/main/AndroidManifest.xml
key_components:
  - path: app/src/main/java/com/nextgis/mobile/provider/ExportFileProvider.java
    responsibility: Match GPX URI MIME, anonymous MIME lookup and share filename while retaining canonical FileProvider root and grant checks.
  - path: app/build.gradle
    responsibility: Variant application ID, provider authority, NGW authenticator/sync account identity, flavor resources, explicit MapLibre 13.0.2 OpenGL backend, production 3.1.2.18/212 versus Lisa Debug 3.1.2.18/213 version contract, and signing configuration.
  - path: app/src/lisa/res/values/launcher_icon.xml
    responsibility: Lisa launcher, intro and about icon binding to density-specific ic_launcher_lisa resources without changing Belka branding.
  - path: app/src/belka/res/values/launcher_icon.xml
    responsibility: Belka-only launcher, intro and about icon binding to density-specific ic_launcher_belka resources without changing Lisa branding.
  - path: app/src/main/java/com/nextgis/mobile/MainApplication.java
    responsibility: Main-process initialization and logging; create or adopt and activate the initial local project before GISApplication opens its first map, schedule same-workspace recovery for an interrupted account sync, except that a pre-registry Debug workspace is kept in place for explicit underlay streaming; create editable local vector layers and keep default OSM at internal index zero plus tracks at the top of the reversed layer list for every workspace.
  - path: app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
    responsibility: Main navigation and toolbar state for explicit map rotation/location recovery, ordered in-process track Start/Stop intent shared with TrackerService, local GeoJSON/KML/GPX file routing, photo-overlay default migration, ordered walk/manual-geometry/form crash-recovery hub, direct NGW resource URL resolution, name-only project picker with sync/fill/track switch protection, backup sharing UI and updater continuation on activity resume.
  - path: app/src/main/java/com/nextgis/mobile/activity/SettingsActivity.java
    responsibility: Settings navigation, including the dedicated project screen, and updater continuation after Android special install permission returns to a manual update check.
  - path: app/src/main/res/xml/preferences_tracks.xml
    responsibility: Track settings UI, including enabled-by-default fixed ten-second background recording heartbeat shared with walk recording, gated by fresh usable location delivery rather than coordinate movement, audible through the alarm stream independently of notification volume and replaced by vibration when alarm audio is muted.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicy.java
    responsibility: Keep the legacy APK archive signature request on Android 9 and newer while also requesting modern SigningInfo, so Android 9 and 10 can validate a same-certificate update through the populated fallback field.
  - path: app/src/test/java/com/nextgis/mobile/util/AppUpdatePackageInfoPolicyTest.java
    responsibility: Lock the updater signature-flag contract at the API 27/28 boundary and across Android 9, 10, 11 and current SDKs.
  - path: app/src/main/java/com/nextgis/mobile/activity/ProjectSettingsActivity.kt
    responsibility: Active project information and controls for current-project sync, local project creation, device-only rename/delete, changed-layer backup gate, schema-rebuild guard reset and certificate-gated Debug underlay transfer into the selected project.
  - path: app/src/main/java/com/nextgis/mobile/activity/LegacyUnderlayExportActivity.java
    responsibility: Require an explicit user confirmation in Debug before granting Geonical read-only underlay stream URIs.
  - path: app/src/main/java/com/nextgis/mobile/provider/LegacyUnderlayProvider.java
    responsibility: Stream one local Debug underlay through a granted pipe without exposing paths, accounts, vectors, tracks or project identity.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayImporter.java
    responsibility: Convert legacy extracted TMS/OSM tiles directly into batched, atomically published raster MBTiles in the active Geonical project and make retries source-key idempotent.
  - path: app/src/main/java/com/nextgis/mobile/util/LegacyUnderlayMigrationContract.java
    responsibility: Pin Debug/Geonical package and signing-certificate identities, define the bounded-memory framed streaming schema and detect the one legacy bootstrap case that must stay in place.
  - path: app/src/main/java/com/nextgis/mobile/util/OfflineSyncIntentService.java
    responsibility: Reserve the active project before manual sync starts, run as a dataSync foreground service, and process only accounts represented by NGW layers in that active map, sequentially under one lease.
  - path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    responsibility: Map screen, complete MapLibre MapView lifecycle and renderer-reference cleanup across pause/resume/view recreation, bounded post-style continuous-render/presentation recovery and stale loading-foreground removal without full reload, EGL-recoverable SurfaceView selection on every API with API 26-27 30-FPS limits and API 28 resumed-only 5-FPS continuous compatibility mode, MaplibreMapInteraction implementation, opt-in persistent and immediate concurrent pinch/rotate gestures with north-up/location/layer-extent recovery, hidden local-vector-tile attribute identification, immediate current-camera-centre tap sketch creation with automatic target visibility, confirmed new-sketch cancellation without a duplicate add toolbar action, visible selected-to-successor insertion direction, hectare ruler labels with sketch-equivalent Undo/Redo routed to the active MapLibre measurement geometry and saved-instance restoration, selected-node independent walk insertion, passive preview and session-acknowledged Finish with full point-session control lock, foreground stakeout host/widget plus transient current-location-to-point and arbitrary-point-to-point magnetic azimuth/distance modes with draggable editable endpoints, acknowledgement of completed post-fill style/source reload, shared Save/form handoff for new geometry with duplicate-launch protection, terminal successful-save cleanup to normal map mode with no feature selection for both new and existing objects, typed Polygon validation messages, GTMultiPolygon-only topology repair, durable non-walk geometry journal, and deferred current-style-safe geometry restoration and owner-aware recovery of coexisting walk and point drafts with polygon-only fill, stable outline and editable vertices after Stop.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutController.kt
    responsibility: Active selected-feature or arbitrary-point live-guidance lifecycle, in-place target replacement without releasing foreground resources, independent GPS listener, WMM2025 magnetic-bearing UI state, GPS/mock precision-source gate, reported-accuracy UI state, monotonic navigation-audio scheduling and high-frequency GPS lease ownership across screen-off/background state.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutForegroundService.kt
    responsibility: Location foreground-service notification and partial wake-lock lifetime for audible stakeout guidance while the UI is paused.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutHeadingProvider.kt
    responsibility: Circularly filtered magnetic rotation-vector heading plus location-cached WMM2025 declination for the live guidance arrow without movement-bearing fallback.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/MagneticAzimuthCalculator.kt
    responsibility: Normalize true initial bearing minus east-positive declination into clockwise magnetic azimuth and return undefined for coincident points.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/WorldMagneticModel2025.java
    responsibility: Calculate offline magnetic declination from the official WMM2025 coefficients for the 2025-2030 model interval.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutAudioCue.kt
    responsibility: Full-scale limited low-pitched non-overlapping damped wooden-tap PCM cues with 3x digital gain and a distinct double-tap in-tolerance pattern.
  - path: app/src/main/java/com/nextgis/mobile/fragment/LayersFragment.java
    responsibility: Layer drawer and sync controls, including reconciliation of the animation with adapter-owned process sync state after lifecycle-sensitive broadcasts.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
    responsibility: Branch-specific Lisa Mobile manifest, trusted versioned URL, integrity, identity, Android 9-10 archive-certificate fallback without weakening SHA-256 matching, and process-death-safe continuation after Android install permission.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncAdapter.java
    responsibility: Run backup-gated project integrity repair before each account, durably journal unfinished passes, defer heavy MapLibre reload until account completion, and surface the base NGW result or a plain user-visible repair/server failure without duplicating layer retry state.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncService.java
    responsibility: Keep system account sync in a low-priority dataSync foreground service from adapter start through finish/cancel.
  - path: app/src/main/java/com/nextgis/mobile/util/SyncRecoveryJournal.java
    responsibility: Persist one active account/workspace sync marker and request an idempotent same-workspace pass after process restart until a clean finish.
public_contracts:
  - id: map-host
    symbol: MapFragment implements MaplibreMapInteraction
    path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    consumers: [maplib, maplibui]
settings_refs: [feature_label_field, map_show_loc, map_show_compass, map_rotation_enabled, map_bearing, photo_overlay_enabled, photo_overlay_use_object_coords, photo_overlay_defaults_enabled_v1, stakeout_sound_enabled, stakeout_far_distance, stakeout_medium_distance, stakeout_near_distance, stakeout_reached_distance, background_recording_sound, check_updates, sw_track_service, apk_version_update, updater-pending-install, sync_recovery_journal, provider_auth, nextgis_accounts_auth, nextgis_accounts_auth_type, com.nextgis.mobile.UPDATE_FLAVOR, io.sentry.traces.user-interaction.enable, io.sentry.attach-screenshot, io.sentry.attach-view-hierarchy, io.sentry.traces.sample-rate, io.sentry.traces.profiling.sample-rate]
