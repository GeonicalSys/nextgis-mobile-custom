schema_version: 1
module_id: app
repository_id: root
maturity: maintained
last_verified: 2026-08-15
entrypoints:
  - app/src/main/java/com/nextgis/mobile/MainApplication.java
  - app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
  - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
  - app/src/main/AndroidManifest.xml
key_components:
  - path: app/build.gradle
    responsibility: Variant application ID, provider authority, NGW authenticator/sync account identity, flavor resources, version and signing configuration.
  - path: app/src/lisa/res/values/launcher_icon.xml
    responsibility: Lisa launcher, intro and about icon binding to density-specific ic_launcher_lisa resources without changing Belka branding.
  - path: app/src/belka/res/values/launcher_icon.xml
    responsibility: Belka-only launcher, intro and about icon binding to density-specific ic_launcher_belka resources without changing Lisa branding.
  - path: app/src/main/java/com/nextgis/mobile/MainApplication.java
    responsibility: Process initialization, logging, GISApplication configuration, creation of editable local vector layers, default OSM at internal index zero and tracks at the top of the reversed layer list for every map/workspace.
  - path: app/src/main/java/com/nextgis/mobile/activity/MainActivity.kt
    responsibility: Main navigation and toolbar state for explicit map rotation/location recovery, local GeoJSON/KML/GPX file routing, photo-overlay default migration, ordered walk/manual-geometry/form crash-recovery hub, direct NGW resource URL resolution, Collector project switch with active-track protection, backup sharing UI and updater continuation on activity resume.
  - path: app/src/main/java/com/nextgis/mobile/activity/SettingsActivity.java
    responsibility: Settings navigation and updater continuation after Android special install permission returns to a manual update check.
  - path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    responsibility: Map screen, MaplibreMapInteraction implementation, opt-in persistent map bearing with north-up/location/layer-extent recovery, object-creation layer eligibility with automatic target visibility, foreground stakeout host/widget, acknowledgement of completed post-fill style/source reload, GTMultiPolygon-only topology repair before one attribute-form handoff, durable non-walk geometry journal, and explicit restoration/discard of interrupted walk or geometry drafts.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutController.kt
    responsibility: Active stakeout lifecycle, independent GPS listener, GPS/mock precision-source gate, reported-accuracy UI state, monotonic navigation-audio scheduling and high-frequency GPS lease ownership across screen-off/background state.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutForegroundService.kt
    responsibility: Location foreground-service notification and partial wake-lock lifetime for audible stakeout guidance while the UI is paused.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutHeadingProvider.kt
    responsibility: True-north device rotation-vector heading for the stakeout arrow without movement-bearing fallback.
  - path: app/src/main/java/com/nextgis/mobile/stakeout/StakeoutAudioCue.kt
    responsibility: Full-scale limited low-pitched non-overlapping damped wooden-tap PCM cues with 3x digital gain and a distinct double-tap in-tolerance pattern.
  - path: app/src/main/java/com/nextgis/mobile/fragment/LayersFragment.java
    responsibility: Layer drawer and sync controls, including reconciliation of the animation with adapter-owned process sync state after lifecycle-sensitive broadcasts.
  - path: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
    responsibility: Branch-specific Lisa Mobile manifest, trusted versioned URL, integrity, identity and process-death-safe continuation after Android install permission.
  - path: app/src/main/java/com/nextgis/mobile/datasource/SyncAdapter.java
    responsibility: Surface the base per-account NGW synchronization result and user-visible transient-server failure without duplicating layer retry state.
public_contracts:
  - id: map-host
    symbol: MapFragment implements MaplibreMapInteraction
    path: app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
    consumers: [maplib, maplibui]
settings_refs: [feature_label_field, map_show_loc, map_show_compass, map_rotation_enabled, map_bearing, photo_overlay_enabled, photo_overlay_use_object_coords, photo_overlay_defaults_enabled_v1, stakeout_sound_enabled, stakeout_far_distance, stakeout_medium_distance, stakeout_near_distance, stakeout_reached_distance, check_updates, sw_track_service, apk_version_update, updater-pending-install, provider_auth, nextgis_accounts_auth, nextgis_accounts_auth_type, com.nextgis.mobile.UPDATE_FLAVOR, io.sentry.traces.user-interaction.enable, io.sentry.attach-screenshot, io.sentry.attach-view-hierarchy, io.sentry.traces.sample-rate, io.sentry.traces.profiling.sample-rate]
storage_contracts:
  - id: updater-pending-install
    path: app/src/main/java/com/nextgis/mobile/util/AppUpdateManager.java
invariant_refs: [INV-FLAVORS, INV-VERSION-COUPLING, INV-NGW-ACCOUNT-IDENTITY, INV-DEFAULT-OSM-BOTTOM, INV-TRACK-LAYER-TOP, INV-HOT-ADD-CONSISTENCY, INV-LOCATION-CURSOR-TOP, INV-MAP-CAMERA-CONTROLS, INV-COLLECTOR-ISOLATION, INV-COLLECTOR-EDITABILITY, INV-COLLECTOR-RESUMABLE, INV-NGRC-PRESERVE, INV-SYNC-ACCOUNT-ISOLATION, INV-UPDATER-IDENTITY, INV-UPDATER-PERMISSION-RESUME, INV-ECOSYSTEM-SERVER-BOUNDARY, INV-CRASH-DRAFT-RECOVERY, INV-MULTIPOLYGON-REPAIR, INV-GPS-TRACK-FILTER, INV-STAKEOUT-GUIDANCE, INV-LOCAL-VECTOR-LAYERS]
global_docs:
  - docs/architecture/overview.md
  - docs/architecture/lisa-ecosystem.md
  - docs/architecture/map-rendering.md
  - docs/architecture/crash-recovery.md
  - docs/architecture/stakeout.md
  - docs/reference/build-matrix.md
  - docs/reference/flavors-and-versioning.md
  - docs/runbooks/release-apk.md
smoke_tests: [AUTO-APP-DEBUG, AUTO-APP-RELEASES, AUTO-APP-VERSION-MATRIX, SMOKE-HOT-RASTER, SMOKE-LOCATION-CURSOR-TOP, SMOKE-MAP-CAMERA-CONTROLS, SMOKE-NGW-ACCOUNT-ADD, SMOKE-NGW-URL-IMPORT, SMOKE-LOCAL-VECTOR-LAYERS, SMOKE-COLLECTOR-IMPORT, SMOKE-COLLECTOR-SWITCH, SMOKE-COLLECTOR-RESUME, SMOKE-UPDATE-DATA-PRESERVE, SMOKE-MULTI-ACCOUNT-SYNC, SMOKE-LISA-RELEASE, SMOKE-BELKA-RELEASE, SMOKE-SELF-UPDATE, SMOKE-CRASH-DRAFT-RECOVERY, SMOKE-MULTIPOLYGON-REPAIR, SMOKE-GPS-RECORDING, SMOKE-STAKEOUT]
upstream_hotspots: [MAP-HOST, APP-FLAVORS]
