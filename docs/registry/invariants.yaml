  INV-BACKUP-BEFORE-DESTRUCTION:
    title: Required backup gates destructive layer mutation
    owners: [maplibui, maplib]
    statement: >
      For NGW vector layers with retained local data, a successful data backup is required before any destructive
      mutation — remote sync delete/overwrite, schema rebuild, Collector vector-layer removal,
      duplicate-layer repair, manual layer delete, manual feature delete, or active project workspace
      delete. Schema rebuild must retain the old layer until its staged replacement is saved in the
      same map commit that removes old references. Backup must include every attachment file that is
      physically present in the layer directory, while server-only attachment metadata remains in the
      attachment table and must never trigger a network download during backup. If backup fails, local
      feature data must remain unchanged and the user must see an alert with the failure reason. Current read-only status does not bypass the gate for existing vector data;
      recreatable raster-style tile caches are not data-backup operations. LayerBackups/
      is capped by preference layer_backup_max_gb (default 5); oldest ZIP archives are deleted when
      the limit is exceeded. After a successful attachment push, the local file stays under the
      server attach id and FeatureAttachments is updated so identification works without a second sync.
      Pulling server attachment metadata without downloading its bytes is not destructive: metadata
      is compared with and persisted to FeatureAttachments, not with optional local META files, and
      must not trigger a feature backup by itself. Whole-feature deletion remains backup-gated.
    related_code:
      - maplibui/src/main/java/com/nextgis/maplibui/util/LayerBackupManager.java
      - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
      - maplib/src/main/java/com/nextgis/maplib/map/NGWVectorLayer.java
