  INV-HIDDEN-VECTOR-TILE-IDENTIFY:
    title: Local-vector-tile attributes remain identifiable while display is hidden
    owners: [maplib, app]
    statement: >
      A vector layer whose persisted origin requests local_vector_tiles participates in tap and
      long-press identification even when its display visibility is false. Identification queries
      the local vector database and does not turn rendering on. Hidden classic vector layers remain
      excluded, so the exception is limited to the configured rendering method.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/LayerIdentifyPolicy.java
      - maplib/src/main/java/com/nextgis/maplib/map/LocalVectorTileRenderMode.java
