schema_version: 1
edges:
  - from: app
    to: maplib
    type: runtime
    scope: SQLite vector rendering, original editing and GPS recovery observation
    purpose: Read complete SQLite originals through bounded native tiles without full startup GeoJSON; keep attributes-only32-ID queries separate from API28+1MiB small-geometry windows, full large/API26PFD fallback, exact order/bytes/current/error semantics and actual provider/owner lifecycle with transient full-original overlays. Full/lite and standalone rebinds preserve whole current-source field/point groups above all saved/current track passes using canonical model order independently from registration arrival and retaining cached wrapper/filter identity; sqlite-priority observes actual SDK ranges/labels/pixels/SQL/hide/Undo, with nested/recreation native gaps explicit. GpsEventSource supplies additive schema4 raw measurement time to the app's rare passive framework-cache witness without a lower-layer dependency on app or a change to acquisition/recording.
    contracts:
      - maplib/src/main/java/com/nextgis/maplib/map/LayerDisplayPriority.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorLayerController.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorSourceBridge.kt
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorTileBackend.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorTileProvider.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorFeatureReader.java
      - maplib/src/main/java/com/nextgis/maplib/map/SqliteVectorTileRequest.java
      - maplib/src/main/java/com/nextgis/maplib/util/MapRuntimeDiagnostics.java
      - maplib/src/main/java/com/nextgis/maplib/map/NativeVectorTileEncoder.java
      - maplib/src/main/java/com/nextgis/maplib/map/NativeVectorTilePropertyCodec.java
      - maplib/src/main/java/com/nextgis/maplib/map/NativeVectorTileClipper.java
      - maplib/src/main/java/com/nextgis/maplib/map/MapDrawable.java
      - maplib/src/main/java/com/nextgis/maplib/map/VisibleLineLabelQuery.java
      - app/src/main/java/com/nextgis/mobile/fragment/MapFragment.kt
      - app/src/androidTest/java/com/nextgis/mobile/rendering/NativeSqliteVectorRenderingTest.java
      - maplib/src/main/java/com/nextgis/maplib/location/GpsEventSource.java
      - app/src/main/java/com/nextgis/mobile/util/AppDiagnostics.java
      - app/src/main/java/com/nextgis/mobile/util/DiagnosticsGpsPlatform.java
      - app/src/main/java/com/nextgis/mobile/util/DiagnosticsGpsFixWitness.java
  - from: app
    to: maplibui
    type: gradle
    scope: implementation
    purpose: UI, NGW import, sync orchestration and GISApplication base
    contracts:
