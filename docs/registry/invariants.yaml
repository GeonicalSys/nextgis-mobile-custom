  INV-LOCAL-VECTOR-LAYERS:
    title: Local vector layers remain editable and accept standard WGS84 coordinate files
    owners: [maplib, maplibui, app]
    statement: >
      A vector layer created in the application or imported from a local GeoJSON file
      is editable by default. GeoJSON without an explicit CRS is WGS84; CRS84 and common
      EPSG:4326 URN or OGC URL forms are accepted as WGS84, while EPSG:3857 aliases are
      converted through the existing Web Mercator path and other coordinate systems remain
      unsupported. A local KML or GPX file is treated as WGS84 and every valid coordinate,
      in source order, becomes a separate point in one editable layer; source geometry,
      styling and route/track topology are deliberately not retained. SQLite bulk-write
      PRAGMAs are configured before the import transaction and are never changed from inside
      an active transaction. An editable local layer remains in the object-creation picker
      while hidden; choosing it enables and saves visibility before editing starts.
    related_code:
      - maplib/src/main/java/com/nextgis/maplib/map/VectorLayer.java
      - maplib/src/main/java/com/nextgis/maplib/util/GeoJSONUtil.java
