      Each Undo or Redo press changes exactly one node even after selection and map callbacks that
      only refresh CRS metadata, and more than ten real changes remain available without a no-op
      boundary step. The ruler exposes the same enabled-at-boundaries Undo/Redo controls; each
      press restores one measurement-point change and a new point after Undo clears the Redo branch.
